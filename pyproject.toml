[project]
name = "opencad"
version = "0.1.0"
description = "Agentic CAD pipeline on Zoo/KCL: part contracts, Codex-authored KCL, independent verification, truth scoring."
requires-python = ">=3.12,<3.13"
dependencies = [
  "pydantic>=2.7",
  "numpy>=1.26",
  "trimesh>=4.4",
  "cadquery-ocp>=7.8",
  "openpyxl>=3.1",
  "pyyaml>=6.0",
  "pillow>=10.0",
  "scipy>=1.13",
  "networkx>=3.2",
  "shapely>=2.0",
  "rtree>=1.2",
  "pypdf>=6.18.1",
  "pymupdf>=1.28.2",
  "matplotlib>=3.11.2",
  "py7zr>=1.1.3",
  "pygltflib>=1.16.5",
  "cadquery>=2.8.0",
  "build123d>=0.12.0",
  "ruff>=0.16.8",
  "manifold3d>=3.5.3",
  "gmsh>=4.15.2",
  "psutil>=7.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
opencad = "opencad.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/opencad"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "truth: immutable external-truth corpus checks",
  "engine: needs the hosted Zoo engine (billed)",
  "codex: needs the local Codex CLI",
]
addopts = "-m 'not engine and not codex'"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.uv]
dev-dependencies = ["pytest>=8.0"]
