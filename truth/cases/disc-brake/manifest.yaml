notes:
- The published model resolves the rotation with a translational-motion (Eulerian) term; a ring-averaged
  or lumped model is a declared model-form difference.
- The documentation's parameter file (r_wheel, T_air) is not public; both enter as inferred inputs.
- Run A (reference geometry, this pipeline's analysis) is recorded in the calibration log before thresholds
  are revisited.
