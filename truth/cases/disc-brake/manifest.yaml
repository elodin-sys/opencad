id: disc-brake
title: 'COMSOL 6.3 heat generation in a disc brake: disc and pad as an assembly, transient braking heat'
kind: machine
truth_class: B
role: validation
source:
  citation: 'COMSOL Multiphysics 6.3 Application Library, Heat Transfer Module: Heat Generation in a Disc
    Brake (brake_disc)'
  urls:
  - https://doc.comsol.com/6.3/doc/com.comsol.help.models.heat.brake_disc/brake_disc.html
  - https://www.comsol.com/model/heat-generation-in-a-disc-brake-102
  accessed: '2026-09-25'
  revision: '6.3'
  license: COMSOL documentation (c) COMSOL AB; evaluator copy only; the packet is a transcription
intent: 'Rebuild the COMSOL 6.3 disc-brake heat-generation model of the attached reference packet as a
  machine of two separately designed parts, in COMSOL''s coordinates converted to millimetres: the half-thickness
  disc with its hub, rotating about the z axis on a revolute joint driven by the car''s braking history
  (speed converted through the wheel radius), and one pad, the fixed datum, resting on the disc face z
  = 13 mm. Declare the named boundaries the thermal analysis needs (the disc and pad contact faces, the
  disc symmetry plane z = 0, every other face free), the panic-braking operating case, a transient CalculiX
  thermal analysis with the friction_brake source and the reduced brake_energy budget, with every material
  property and condition taken from the packet; values the packet does not give are inferred with a rationale
  and an open question.'
