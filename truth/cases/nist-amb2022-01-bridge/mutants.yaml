# Deliberately wrong parts the scorer must reject. Frame: x in [0, 75], y in [0, 5], z in [0, 12.5]; thin 0.5 mm legs at x = 25.75, 39.75, 53.75, 67.75.
mutants:
  - id: scaled_1pct
    op: scale
    factor: 1.01
    expect_caught_by: [bbox_size]
  - id: shifted_0p3mm
    op: translate
    offset: [0.3, 0, 0]
    note: bbox size unchanged; COM and leg centres move by 0.3 mm.
  - id: thin_leg_missing
    op: cut_box
    min: [53.25, -1, -1]
    max: [54.25, 6, 5.9]
    note: the 0.5 mm leg at x = 53.75 removed below the bridge; z = 3 loop count drops from 13 to 12.
  - id: cavity_sealed
    op: fill_box
    min: [28, 0, 0]
    max: [33, 5, 12.5]
    note: the L10 cavity at x = 30.5 filled solid; the 5 holes in that section vanish.
