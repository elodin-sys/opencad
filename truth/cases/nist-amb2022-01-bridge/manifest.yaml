notes:
- 'Leg numbering (Figure 4): L1 is the 5 mm leg at the far end (x 70..75), L12 the 2.5 mm leg nearest
  the block (x 21..23.5); L10 (x 28..33) is hollow.'
- 'Leg pattern along +x from the block (0..19): [gap 2, 2.5, gap 2, 0.5, gap 2, 5] repeating with a 14
  mm pitch; each member is vertical to z = 5 and chamfers 45 deg on its +x side from z = 5 to 7.'
- STEP vs drawing/STL discrepancy recorded above; the drawing-faithful STL is primary truth because the
  2023 drawing update post-dates the STEP export.
