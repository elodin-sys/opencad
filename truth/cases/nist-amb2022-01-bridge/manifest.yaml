id: nist-amb2022-01-bridge
title: 'NIST AM Bench AMB2022-01 individual bridge artifact (IN718 LPBF benchmark part): 12 legs, 45 deg
  overhangs, pointed taper, 11 top tabs, hollow leg L10 with four thin walls'
truth_class: B
role: validation
source:
  citation: NIST AM Bench 2022, AMB2022-01 Benchmark Measurements and Challenge Problems; dataset 'AM
    Bench 2022 3D Build Modeling Challenge Description Data (AMB2022-01)', doi:10.18434/mds2-2607, /CAD_Geometry/
  urls:
  - https://www.nist.gov/ambench/amb2022-01-benchmark-measurements-and-challenge-problems
  - https://doi.org/10.18434/mds2-2607
  - https://data.nist.gov/od/ds/ark:/88434/mds2-2607/CAD_Geometry/AMB2022-01-AMMT-PartCAD.STL
  - https://data.nist.gov/od/ds/ark:/88434/mds2-2607/CAD_Geometry/AMB2022-01-AMMT-PartCAD.STEP
  accessed: '2026-09-15'
  revision: Figure 3 drawing updated by NIST 2023-09-20; PartCAD.STEP exported from SolidWorks 2021 on
    2022-03-14; STL/STEP sha256 verified against NIST's published .sha256 files
  license: NIST public data (US Government work)
intent: 'Reconstruct the NIST AMB2022-01 individual bridge artifact as editable, parameterized KCL from
  the attached NIST description excerpts and figures; Figure 3 is the dimensioned plan and elevation drawing
  and is authoritative for every external dimension. Frame: x along the 75 mm length with x = 0 at the
  pointed (45 degree tapered) end and x increasing toward the far end, y across the 5 mm width with y
  = 0 at one long side face, z vertical from the build plate (z = 0) upward. Model the tapered nose, the
  tall solid end block, the twelve legs with their 45 degree overhangs merging into the solid bridge,
  the eleven 1 mm wide top tabs on a 7 mm pitch, and the hollow leg L10 with its 0.5 mm outer walls, 1
  mm base, four 4 mm tall internal thin walls parallel to x, and flat ceiling, exactly as documented.
  Where the sources do not fix a dimension (the single- and double-track thin-wall widths), record it
  as an open question and use a clearly labelled inferred value with a wide tolerance rather than approximating
  silently. One solid; export STEP and STL. Reference geometry supplied by NIST is for inspection only:
  the deliverable must be editable construction, never an import.'
inputs:
- path: inputs/nist-amb2022-01-description.md
  kind: text
  sha256: ad20b8b64ceffc5122b055fd97c5e12b4b89b3cd2d52876ba74afb4d66cf2094
  note: geometry excerpts of the NIST challenge description
- path: inputs/nist-figure3-drawing.png
  kind: drawing
  sha256: a2377f44a5d37ee5e2193817bc33f079d664fae8c9df7bd675480f9e97b37d49
  units: mm
  note: 'Figure 3 (2023-09-20 update): dimensioned plan and elevation views'
- path: inputs/nist-figure4-legs-thinwalls.png
  kind: image
  sha256: a55dce91299778420a4970d51478be5856a89b291644459d93b7cb71524b7417
  note: 'Figure 4: leg numbering (L1 at the far end, L12 nearest the block) and the L10 thin-wall scan
    pattern'
- path: inputs/nist-figure1-overview.png
  kind: image
  sha256: 8cfc5aa92c73cb51cae87d1238b865d1c33565d5757e27244c19eb1e90e62142
  note: 'Figure 1: rendered overview'
- path: inputs/AMB2022-01-AMMT-PartCAD.STL
  kind: mesh
  sha256: d92f368a35952ff877624f3d15fb0e38c099e2528cfd96bf1d76a868a088e1f4
  units: mm
  note: 'NIST-published mesh of the part (mesh-input arm only); 6 shells: main body plus five inverted
    pocket shells'
truth:
- path: truth/AMB2022-01-AMMT-PartCAD.STL
  kind: mesh
  sha256: d92f368a35952ff877624f3d15fb0e38c099e2528cfd96bf1d76a868a088e1f4
  units: mm
  note: NIST-published mesh; consistent with the Figure 3 drawing (legs reach the plate, 0.5 mm tabs,
    12.5 mm overall). Primary geometric truth.
- path: truth/AMB2022-01-AMMT-PartCAD.STEP
  kind: cad
  sha256: 623ee615d015bb231accdff3594592c3c7c563d98c463bd21680da2c0005d055
  units: mm
  note: 'NIST-published B-rep (SolidWorks 2021). Differs from the drawing: leg bottoms at z = 0.6 (block
    at z = 0) and 0.25 mm tabs (12.25 overall). Recorded as a documented source discrepancy; scored only
    as an optional check.'
