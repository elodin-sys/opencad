id: planetary-set
title: 'Planetary gear set as an assembly: fixed internal ring, sun, carrier and three planets, carrier
  ratio 1/3'
kind: machine
truth_class: C
role: validation
source:
  citation: Analytic mechanism reference (scripts/derive_mechanism_truth.py); tooth counts, module and
    phases from the specification
  urls: []
  accessed: '2026-09-25'
  revision: spec v1
  license: this repository
intent: 'Build the planetary gear set of the attached specification as a machine of separately designed
  parts: a base plate, an internal 48-tooth ring rigidly fixed to it, a 24-tooth sun and a carrier turning
  about the common axis, and one 12-tooth planet design used for three planets turning on the carrier,
  each drafted and modelled in its own frame as the specification states. Phase every gear exactly as
  specified so all six meshes engage. The sun is the motor-driven joint; each planet follows through two
  epicyclic gear transmissions relative to the carrier (sun to planet, and the fixed ring to planet),
  and the carrier is free, so the loops through the planets set its motion. Declare a motion sweep of
  the sun. Predict the carrier ratio and the carrier angle from the geometry.'
