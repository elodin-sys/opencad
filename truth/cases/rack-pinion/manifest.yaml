id: rack-pinion
title: 'Rack and pinion as an assembly: a 20-tooth module-2 pinion driving a straight-flank rack on a
  slide'
kind: machine
truth_class: C
role: validation
source:
  citation: Analytic mechanism reference (scripts/derive_mechanism_truth.py); module, tooth count and
    rack teeth from the specification
  urls: []
  accessed: '2026-09-25'
  revision: spec v1
  license: this repository
intent: 'Build the rack and pinion of the attached specification as a machine of three separately designed
  parts: a base plate, a 20-tooth pinion and a 32-tooth rack, each drafted and modelled in its own frame
  as the specification states. Place the pinion on a revolute joint and the rack on a slider joint along
  +x on the plate, phased as specified so the mesh engages; the pinion is the motor-driven joint and the
  rack follows through a gear transmission (mm of rack travel per degree of pinion rotation). Declare
  a motion sweep of one pinion revolution. Predict the rack ratio and the rack travel from the geometry.'
inputs:
- path: inputs/rack-pinion-spec.md
  kind: text
  sha256: 87f6a8bbc15c559e23899017105cd36ee8b503a6238b00213d3b99103d903561
  note: the complete design specification
truth:
- path: truth/rack-pinion-truth.yaml
  kind: yaml
  sha256: a6f3797f0137ff6114f573ec965aadc3a820028e6b583a47f98416ae0efb8197
  note: analytic ratio, travel and rack volume (scripts/derive_mechanism_truth.py)
arms:
