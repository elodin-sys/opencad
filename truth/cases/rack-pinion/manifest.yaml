  value: 0.3490658503988659
  tolerance: 0.001
  source: pi m z / 360 = pi x 2 x 20 / 360
  where: the rack (`body` the rack), rack travel per degree of pinion rotation
  note: the prediction uses the pinion's tooth count and the rack pitch measured on the placed parts
- id: rackTravel
  quantity: joint_range
  unit: mm
  evidence: C
  value: 125.66370614359172
  tolerance: 0.1
