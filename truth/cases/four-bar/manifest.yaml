id: four-bar
title: 'Planar four-bar crank-rocker as an assembly: ground, crank, coupler and rocker closed into one
  loop'
kind: machine
truth_class: C
role: validation
source:
  citation: Analytic mechanism reference (scripts/derive_mechanism_truth.py); circle intersection on the
    assembled branch
  urls: []
  accessed: '2026-09-25'
  revision: spec v1
  license: this repository
intent: 'Build the four-bar linkage of the attached specification as a machine of four separately designed
  parts: a ground plate and three stadium links (crank 40, coupler 100, rocker 80 between hole centres),
  each drafted and modelled in its own frame as the specification states, in the stated layers. Connect
  them with four revolute pins into one closed loop: three pins form the joint tree from the ground and
  the fourth is the loop''s closing joint; place the links in the specified rest configuration so the
  loop closes. The crank is the motor-driven joint. Declare a motion sweep of one full crank revolution.
  Predict the rocker angle, its swing and the coupler point path from the geometry.'
inputs:
- path: inputs/four-bar-spec.md
  kind: text
  sha256: aececd85a2ba8a2e020775f05a44f1bd1c3a505c8c8c5ed634606d975490bf17
  note: the complete design specification
