id: rpi5-enclosure
title: Raspberry Pi 5 two-piece enclosure designed to functional requirements (board fit, standoff datums,
  plug access, lid closure, wall minimum)
truth_class: C
role: validation
source:
  citation: Raspberry Pi Ltd, Raspberry Pi 5 mechanical drawing RP-008347-DS-1 (pip.raspberrypi.com);
    requirements authored for this benchmark
  urls:
  - https://pip-assets.raspberrypi.com/categories/892-raspberry-pi-5/documents/RP-008347-DS-1-raspberry-pi-5-mechanical-drawing.pdf
  - https://pip.raspberrypi.com/categories/892-raspberry-pi-5
  accessed: '2026-09-17'
  revision: drawing updated 6 Oct 2025 per the product information portal
  license: 'Raspberry Pi drawing: reference use; requirements: this repository'
intent: Design a two-piece FFF-printed enclosure (base and removable lid, two separate solids in one STEP)
  for a Raspberry Pi 5 to the attached requirements document, in the board frame it defines (x along 85,
  y along 56, PCB bottom at z = 0). The board must fit with 0.5 mm edge clearance and 20 mm headroom above
  the PCB; four standoffs meet the PCB bottom at the Ø2.7 mounting holes (3.5,3.5) (61.5,3.5) (3.5,52.5)
  (61.5,52.5) with Ø2.5 x 5 pilot holes; every listed cable-plug envelope (USB-C, 2x micro-HDMI on y =
  0; 2x USB-A stacks and RJ45 on x = 85; micro-SD under x = 0) passes through its wall opening; the lid
  closes on the base rim with zero interference and is held by four Ø3 through holes into Ø2.5 corner-post
  pilots; walls and floor >= 2 mm (5th percentile of inward ray casts; the Ø6.2 standoff bosses' 1.85
  mm annuli are the accepted exception). Declare the base and lid as acceptance solids by a contained
  point, the keep-outs and plug envelopes as acceptance hardware with no-interference clearances, the
  standoff faces and pilot holes as faces and cylinders pinned by interfaces, and the wall minimum as
  a p05 thickness check. Headroom, wall thickness and standoff height are top-level parameters; the headroom
  parameter gets a 10-value regeneration sweep (15..35, every value must build) and one infeasible negative
  value guarded by an assert.
