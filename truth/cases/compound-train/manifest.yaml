id: compound-train
title: 'Compound spur-gear train as an assembly: pinion, compound idler and output gear on a base plate,
  two meshes, ratio +1/6'
kind: machine
truth_class: C
role: validation
source:
  citation: Analytic mechanism reference (scripts/derive_mechanism_truth.py); tooth counts, module and
    phases from the specification
  urls: []
  accessed: '2026-09-25'
  revision: spec v1
  license: this repository
intent: 'Build the compound spur-gear train of the attached specification as a machine of four separately
  designed parts: a base plate, a 20-tooth input pinion, a compound idler carrying a 40-tooth and a 15-tooth
  gear on one body, and a 45-tooth output gear, each drafted and modelled in its own frame as the specification
  states. Place the gears on revolute joints on the plate at the three specified axes, phased exactly
  as specified so both meshes engage; the pinion is the motor-driven joint, the idler follows the pinion
  and the output follows the idler through gear transmissions with mesh checks. Declare a motion sweep
  of the pinion through two pitches. Predict the train ratio and the output angle from the geometry.'
inputs:
- path: inputs/compound-train-spec.md
  kind: text
  sha256: e2734c43ae1d2aa36320d0b7680e21616422e902b471b3eb98295e3292296af5
  note: the complete design specification
