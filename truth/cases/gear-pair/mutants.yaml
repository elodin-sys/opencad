# Deliberately wrong gear sets the scorer must reject.
mutants:
- id: gears_fused
  op: fill_box
  min:
  - 17.0
  - -1.5
  - 0.5
  max:
  - 43.0
  - 1.5
  - 7.5
  expect_caught_by:
  - solid_count
  note: 'a bar joining pinion and wheel: one fused body'
- id: wheel_shifted_1mm
  op: translate_solid
  contains:
  - 90
  - 0
  - 4
  offset:
  - 1.0
  - 0
  - 0
  expect_caught_by:
  - wheel_bore
  - gear_mesh
  note: 'centre distance 61: backlash band violated'
- id: wheel_too_close
  op: translate_solid
  contains:
  - 90
  - 0
  - 4
  offset:
  - -0.5
  - 0
  - 0
  expect_caught_by:
  - gear_mesh
  note: 'centre distance 59.5: the gears interfere'
- id: pinion_19_teeth
  op: scale
  factor: 1.0
  source: truth/pair-19t.step
  expect_caught_by:
  - pinion_teeth
  note: a 19-tooth pinion of the same tip radius
