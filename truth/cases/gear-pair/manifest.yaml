id: gear-pair
title: 'Spur-gear pair (20T/40T, m = 2, 20 deg) on a carrier plate: separate solids, tooth counts, involute
  profile, meshing motion'
truth_class: C
role: validation
source:
  citation: Design specification authored for this benchmark; reference geometry generated independently
    by scripts/derive_gear_truth.py (numpy involute + OpenCascade)
  urls: []
  accessed: '2026-09-17'
  revision: spec v1
  license: this repository
intent: 'Design the spur-gear pair and carrier plate exactly as specified in the attached specification:
  module 2, pressure angle 20 deg, zero profile shift, 20-tooth pinion (bore Ø6) at the origin and 40-tooth
  wheel (bore Ø8) at (60, 0), face width 8 (z 0..8), 0.10 mm total circular backlash, pinion tooth centred
  on +x and the wheel phased half a pitch so the pair meshes; carrier 110 x 50 x 5 under the gears with
  clearance holes on the axes. Three separate solids in one KCL file; the pair must turn through a full
  pitch without interference. Declare the three solids by contained points, the bores as cylinders, and
  the gears'' tooth counts and mesh as acceptance items.'
