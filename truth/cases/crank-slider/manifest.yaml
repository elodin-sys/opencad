id: crank-slider
title: 'Offset crank-slider as an assembly: ground, crank, connecting rod and slider closed into one loop'
kind: machine
truth_class: C
role: validation
source:
  citation: Analytic mechanism reference (scripts/derive_mechanism_truth.py); x = r cos t + sqrt(l^2 -
    (e - r sin t)^2)
  urls: []
  accessed: '2026-09-25'
  revision: spec v1
  license: this repository
intent: 'Build the offset crank-slider of the attached specification as a machine of four separately designed
  parts: a ground plate, a crank (30 between holes), a connecting rod (100) and a slider block, each drafted
  and modelled in its own frame as the specification states, in the stated layers. Connect them with three
  revolute pins and a prismatic guide along +x into one closed loop: three joints form the joint tree
  from the ground and the fourth is the loop''s closing joint; place the parts in the specified rest configuration
  so the loop closes. The crank is the motor-driven joint. Declare a motion sweep of one full crank revolution.
  Predict the slider travel and the stroke from the geometry.'
inputs:
- path: inputs/crank-slider-spec.md
  kind: text
  sha256: cd01ebc4dc4d7289a786bef3bca834eb565dd9f6109941bbcc2ec04b879c0d1c
  note: the complete design specification
truth:
- path: truth/crank-slider-truth.yaml
  kind: yaml
  sha256: ffd908b15809c83eaaa822f6a82a06df2c8441932c7f2fb869bc696ef591f07d
  note: rest pin position, stroke and part volumes (scripts/derive_mechanism_truth.py)
- path: truth/slider-travel.csv
  kind: table
  sha256: 5cfd13b57a17ca65f5b69190e83605072ff940177aa01d56f20f9b3b850e0bc7
  note: slider travel from rest vs crank angle, 0..360 deg by 10
