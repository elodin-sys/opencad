    motion (`motion`, range 0 to 360 deg, no `at`)
- id: stroke
  quantity: joint_range
  unit: mm
  evidence: C
  value: 60.332781665402095
  tolerance: 0.05
  source: sqrt((l + r)^2 - e^2) - sqrt((l - r)^2 - e^2)
  where: the guide joint (`joint`) over the one-revolution crank motion (`motion`)
notes:
- Link volumes are 5 (L 16 + pi 8^2 - 2 pi 3^2); the slider 30 x 16 x 5 - pi 3^2 5; the ground 200 x 70
  x 5 - pi 3^2 5.
- Series references are scored by the largest absolute error at their points (the prediction interpolated
  onto them).
