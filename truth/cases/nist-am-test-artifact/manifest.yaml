id: nist-am-test-artifact
title: 'NIST Additive Manufacturing Test Artifact (Moylan et al. 2014): diamond base with centre hole,
  concentric bosses, 16 pins, 4 holes, two staircases, ramp, lateral and fine features'
truth_class: B
role: validation
source:
  citation: S. P. Moylan, J. A. Slotwinski, A. L. Cooke, K. K. Jurrens, M. A. Donmez, An Additive Manufacturing
    Test Artifact, J. Res. NIST 119 (2014) 429-459, doi:10.6028/jres.119.017; NIST artifact download page
  urls:
  - https://www.nist.gov/el/intelligent-systems-division-73500/production-systems-group/nist-additive-manufacturing-test
  - https://doi.org/10.6028/jres.119.017
  - https://www.nist.gov/system/files/documents/2017/10/19/nist_test_artifact_ver3b.zip
  accessed: '2026-09-17'
  revision: NIST Test Artifact_ver3b.step (2017-10-05) and NIST Test Artifact online.STL (2013-04-10);
    STL translated by (-70.7107, -70.7107, -10) into the STEP frame
  license: US Government work, public domain (17 USC 105); NIST asks for acknowledgement
intent: 'Reconstruct the NIST Additive Manufacturing Test Artifact (Moylan et al. 2014, Fig. 8) as editable,
  parameterized KCL from the attached drawing, paper excerpts, renders, section drawings and dimension
  sheet. Frame: origin at the centre of the top surface, z = 0 on the top surface with +z toward the pin
  tips (the base extends to z = -10, features to z = +7), the Ø10 centre hole on the z axis, +x toward
  the Ø4 hole at x = +60; the four rows of Ø4 pins (20, 30, 40, 50) and the four Ø4 holes (60) lie on
  the +-x and +-y axes; the diamond base is a 100 mm square rotated 45 deg (corners on the axes at 70.71).
  Model every feature at its stated size and position: centre hole and two concentric central cylinders,
  16 pins and 4 holes, both L-shaped staircases with 1 mm steps and 10 mm treads, the 1-in-25 ramp with
  2.5 mm landings, the lateral cavities and bosses on one side, the five fine pins and five fine holes
  (Ø2 to Ø0.25, 2 mm tall/deep) and the fine rectangular bosses and slots. Small features are scored individually:
  a correct base cannot compensate for a missing pin. One solid; export STEP and STL. The reference CAD
  is evaluator-only; the deliverable must be construction, never an import.'
