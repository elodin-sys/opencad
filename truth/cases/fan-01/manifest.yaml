id: fan-01
title: 'FAN-01 low-pressure axial fan in its short duct: rotor, duct and flow domain; total-to-static
  pressure rise on the characteristic'
kind: machine
truth_class: A
role: validation
source:
  citation: FAN-01 benchmark (Zenger, Junger, Kaltenbacher, Becker; Zenodo record 10787093 v4), Schoder
    and Czwielong 2022 arXiv:2211.12014
  urls:
  - https://zenodo.org/records/10787093
  - https://arxiv.org/abs/2211.12014
  accessed: '2026-09-25'
  revision: v4 (2024-03-06)
  license: CC-BY-4.0 (Zenodo); arXiv licence for the paper
intent: 'Analyse the FAN-01 axial fan from its supplied CAD in the rig frame: the rotor turning on a revolute
  joint about its axis (+y through x = -400, z = 1515) inside the stationary duct with its inlet nozzle
  and diffuser, with the shaft and the downstream hub disc turning with the rotor. Build the stationary
  flow boundary the experiment has (the chamber wall the duct passes through, the hub closure the rotor
  ring mounts on) as derived solids, and the flow region as a derived fluid body: a settling region on
  the chamber side upstream of the nozzle, the duct, and a discharge region on the ambient side downstream
  of the diffuser, bounded by an inlet cap on the chamber side and an outlet cap on the ambient side.
  Name the inlet, outlet, rotating walls and stationary walls as boundaries. Declare the operating points
  named in the checks (volumetric flow in m3/s, 1486 rpm) and air, and predict the total-to-static pressure
  rise and the rotor torque with a steady OpenFOAM MRF analysis (a mesh-refinement pair at the design
  flow).'
