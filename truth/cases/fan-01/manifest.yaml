notes:
- Development point q1403 (design flow); q1804 and q0994 (stall-onset saddle) are held out.
- The supplied CAD's duct bore across the rotor band is 250 mm (outer 252), a 2.5 mm tip gap as the design
  table states. The duct and shaft were repaired before this arm was run (qualification.yaml).
