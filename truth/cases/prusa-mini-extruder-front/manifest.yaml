id: prusa-mini-extruder-front
title: 'Original Prusa MINI extruder front housing: functional mating part with keyhole bore stack, screw
  holes, heat-set traps, filament path and hotend clamp channel'
truth_class: B
role: validation
source:
  citation: Prusa Research, Original Prusa MINI / MINI+ printed parts, STEP/PRINTED PARTS/MINI-extruder-front.stp
    (GitHub prusa3d/Original-Prusa-MINI, master)
  urls:
  - https://github.com/prusa3d/Original-Prusa-MINI/tree/master/STEP/PRINTED%20PARTS
  - https://raw.githubusercontent.com/prusa3d/Original-Prusa-MINI/master/STEP/PRINTED%20PARTS/MINI-extruder-front.stp
  accessed: '2026-09-17'
  revision: master as of 2026-09-17
  license: GNU GPL v3.0 (repository LICENSE); used as an internal benchmark reference
intent: 'Reconstruct the Original Prusa MINI extruder front housing (MINI-extruder-front) as editable,
  parameterized KCL from the attached renders, section drawings and dimension sheet. Frame: x across the
  plate (-26.5 to 26.5), y through the thickness with the back mating face at y = 0 and the front face
  at y = 14, z vertical from the bottom face z = -30 to the top lug at z = 33.72. Assembly-governing geometry
  must be exact: the keyhole central opening (Ø22.5 x 3 recess, Ø16 bore, Ø26 x 6 counterbore on the axis
  x = -2, z = 0; Ø12 x 3 recess, Ø16 bore and Ø14 counterbore on x = -2, z = 16.4), every Ø3.4 through
  hole with its Ø6.5 / Ø3.5 counterbore or heat-set trap, the Ø4 filament holes, the hotend clamp channel
  bores along z at x ~ 25.6, and the mating planes (y = 0, y = 14, z = -30, x = -26.5). Declare each hole
  as an acceptance cylinder and the mating planes as interfaces with checks. The fan-duct lobe, top-lug
  fillet and embossed text are cosmetic (optional features). One solid; export STEP and STL. The reference
  CAD is evaluator-only; the deliverable must be construction, never an import.'
