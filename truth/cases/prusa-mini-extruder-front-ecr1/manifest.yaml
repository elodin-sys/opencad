id: prusa-mini-extruder-front-ecr1
title: Prusa MINI extruder front after ECR-1 (heat-set traps Ø6.5 x 9.8 -> Ø5.0 x 6.0) with every other
  interface preserved
truth_class: C
role: validation
source:
  citation: Prusa Research, Original Prusa MINI / MINI+ printed parts, STEP/PRINTED PARTS/MINI-extruder-front.stp
    (GitHub prusa3d/Original-Prusa-MINI, master); ECR-1 nominal derived from the request (class C)
  urls:
  - https://github.com/prusa3d/Original-Prusa-MINI/tree/master/STEP/PRINTED%20PARTS
  - https://raw.githubusercontent.com/prusa3d/Original-Prusa-MINI/master/STEP/PRINTED%20PARTS/MINI-extruder-front.stp
  accessed: '2026-09-17'
  revision: master as of 2026-09-17
  license: GNU GPL v3.0 (repository LICENSE); used as an internal benchmark reference
intent: 'Score the design after the ECR-1 change request: the two traps carry the new size, every other
  hole axis, depth and mating plane is unchanged.'
inputs:
- path: inputs/ecr-1-request.md
  kind: text
  sha256: 53735700795879ffdcc2826ed99be5fd98e211cc88d3168eda1b64b3ad4a3c79
  note: feasible change request
- path: inputs/ecr-2-infeasible-request.md
  kind: text
  sha256: 6388b7e01cb24783027ebc70aa0ee5b0a7926178e570f7ca5b9a7ca23b5b5536
  note: deliberately infeasible request; must be refused
truth:
- path: truth/MINI-extruder-front.stp
  kind: cad
  sha256: 8146b4dc6e543acf365034561bcce7124ca653e2c0a3dd33a486617501c814d7
  units: mm
  note: pre-change reference for the preserved interfaces
