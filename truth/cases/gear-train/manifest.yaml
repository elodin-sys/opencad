id: gear-train
title: 'Spur-gear train as an assembly: pinion, wheel and carrier drafted and modelled as separate parts,
  placed on revolute joints, driven through the 2:1 mesh'
kind: machine
truth_class: C
role: validation
source:
  citation: 'Machine version of the gear-pair case: same specification and the same independently generated
    reference geometry (scripts/derive_gear_truth.py)'
  urls: []
  accessed: '2026-09-17'
  revision: spec v1
  license: this repository
intent: 'Build the spur-gear pair and carrier plate of the attached specification as a machine of three
  separately designed parts: a 20-tooth pinion, a 40-tooth wheel and the 110 x 50 x 5 carrier plate, each
  drafted and modelled in its own frame (each gear with its axis along +z through its own origin and its
  bottom face at z = 0; the carrier in the specification''s frame). Place the gears on revolute joints
  on the carrier at the two specified axes, phased exactly as the specification states so the pair meshes;
  the pinion is the motor-driven joint and the wheel follows through a gear transmission. Declare a motion
  sweep of one pinion pitch and the gear mesh check. Predict the transmission ratio from the geometry.'
