id: nottingham-bearing
title: 'University of Nottingham highly loaded half-journal bearing: shaft, 180-degree bush and oil film;
  film pressure, heating and operating film'
kind: machine
truth_class: A
role: validation
source:
  citation: Layton J. et al. (2026) Experimental Investigation of a Highly Loaded Half-Journal Bearing,
    Lubricants 14(2):76; dataset Zenodo 10.5281/zenodo.18375341
  urls:
  - https://doi.org/10.3390/lubricants14020076
  - https://zenodo.org/records/18375341
  accessed: '2026-09-25'
  revision: dataset v1 (2026-01-26)
  license: CC-BY-4.0
intent: 'Reconstruct the half-journal bearing test section of the attached packet as a machine: the EN24T
  shaft (100.0 mm journal) turning on a revolute joint in the stationary 180-degree bush (100.2 mm bore,
  75 mm long), with the oil film between them as a derived fluid body at rest (concentric). Case frame:
  the bearing axis is +z with the bush spanning z = 0..75 mm; bottom dead centre (BDC) points toward -y
  (the bush below the shaft); the shaft turns positively about +z so its surface at BDC moves toward +x
  (inlet edge of the arc at -x, outlet edge at +x). Declare the operating conditions named in the checks
  (speed in rpm, load in kN) and the lubricant, and predict the film pressure at the tappings, the minimum
  operating film and its angle, and the heating ratio with the reduced Reynolds film analysis.'
