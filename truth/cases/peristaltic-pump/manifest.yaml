performance:
- id: flowRate
  quantity: flow_rate
  unit: mL/min
  case: rotor108
  evidence: A
  value: 1.62
  uncertainty: 0.08
  z_max: 2.0
  source: 'paper text: at about 108 rpm the pump achieves 1.62 mL/min with the 3 mm OD / 1 mm ID tubing
    (mass balance, three trials)'
  note: 'uncertainty: the figure''s one-standard-deviation bars are not stated numerically; 5 % assumed
    and logged'
- id: driveRatio
  quantity: transmission_ratio
  unit: ''
  evidence: C
  value: 0.25
  tolerance: 1.0e-09
  source: 'paper: 4:1 gearbox; the published gears count 12 -> 24/12 -> 24 teeth (two external meshes,
    the sense is kept)'
  note: rotor turns per motor turn, measured from the tooth counts of the placed gears
notes:
- The 1.59 mm tubing configuration is a different physical machine (other stator) and is not scored here.
- 'An ideal positive-displacement model is expected to over-predict: the paper''s flow is what the tube
  actually delivers.'
