id: peristaltic-pump
title: 'Behrens et al. 2020 open-source peristaltic pump: printed pump head and 4:1 gearbox assembled,
  rollers on the tube, delivered flow'
kind: machine
truth_class: A
role: validation
source:
  citation: Behrens, Fuller, Swist et al., Open-source, 3D-printed Peristaltic Pumps for Small Volume
    Point-of-Care Liquid Handling, Sci Rep 10, 1543 (2020)
  urls:
  - https://www.nature.com/articles/s41598-020-58246-6
  - https://media.springernature.com/original/springer-static/esm/art%3A10.1038%2Fs41598-020-58246-6/MediaObjects/41598_2020_58246_MOESM2_ESM.zip
  accessed: '2026-09-25'
  revision: Dataset 1
  license: CC BY 4.0
intent: 'Assemble the open-source peristaltic pump of the attached packet from its published printed parts
  (analysis mode: the part files are the reference geometry, placed as purchased bodies with the scale
  their units need): the gearbox base as the datum, a purchased stepper motor, the 12-tooth motor gear,
  the stacked gear and the output gear on their shafts, the rotor driven by the output gear, three purchased
  ball-bearing rollers on the rotor pins, the 3 mm stator with its lid and clamp, and the 3 mm OD / 1
  mm ID silicone tube as a modelled part lying in the stator track. Declare the gear transmissions from
  the motor to the rotor, a motion sweep that passes every roller over the tube, and the peristaltic displacement
  analysis at the packet''s test speed; predict the delivered flow and the motor-to-rotor drive ratio.'
