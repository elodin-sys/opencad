id: fda-pump
title: 'FDA benchmark centrifugal blood pump (Interlaboratory Study 2): assembly, sealed flow domain and
  pressure rise per operating condition'
kind: machine
truth_class: A
role: validation
source:
  citation: FDA/OSEL-DAM CFD and Blood Damage Benchmarks, Blood Pump (Malinauskas et al. 2017 ASAIO J
    63:150; Hariharan et al. 2018 CVET 9:623; Ponnaluri et al. 2022 ASAIO J 69:e1)
  urls:
  - https://github.com/FDA/OSEL-DAM-CFD-and-Blood-Damage-Benchmarks
  - https://doi.org/10.1007/s13239-018-00378-y
  accessed: '2026-09-25'
  revision: ca35ecc44137fa6bd0d735190eb836ea0dc0d547
  license: FDA public-domain benchmark data; papers cited, not redistributed
intent: Analyse the FDA benchmark blood pump from its supplied CAD. Place the housing chamber model (the
  inner surface of the chamber and tubing) and the rotor in their supplied relative position, scaled from
  the CAD's 100-um units to millimetres; the rotor turns about its axis on a revolute joint with one blade
  90 degrees to the outlet (the CAD orientation). Build the physical housing wall as a derived solid around
  the chamber and the sealed flow region (chamber minus rotor) as a derived fluid body; name the inlet
  (the curved inlet tube's open end), the outlet (the outlet tube's open end), the rotor surfaces and
  the housing walls as boundaries. Declare the six operating conditions of the packet (C1-C6, flow in
  L/min and rotor speed in rpm) and the blood-analog fluid. Predict the static pressure rise from inlet
  to outlet at every condition with a steady OpenFOAM MRF analysis (a mesh-refinement pair at C5 only,
  one mesh level elsewhere), and give the reduced Euler-head estimate at every condition under separate
  observable ids for comparison. Nonclinical engineering use only.
