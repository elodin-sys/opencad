notes:
- The 9:1 ratio is downstream height to step height; the upstream height is 8H by construction of a step
  in a channel whose exit height is 9H.
- Domain lengths are the NASA computational choice (x/H = -105 to +50), not the physical tunnel; the contract
  must state them as explicit parameters.
