id: nasa-backstep-driver-seegmiller
title: 'Driver-Seegmiller backward-facing step: flow-passage (air volume) solid, parallel-roof case, NASA
  WIND computational domain'
truth_class: C
role: validation
source:
  citation: 'NASA Glenn Research Center, WIND-US validation archive, Backstep Study #1 (D. A. Yoder);
    Driver & Seegmiller, AIAA Journal 23(2), 1985, 163-171'
  urls:
  - https://www.grc.nasa.gov/WWW/wind/valid/backstep/backstep01/backstep01.html
  accessed: '2026-09-15'
  revision: page last updated 2021-02-10
  license: US Government work (NASA)
intent: 'Model the air volume (flow passage) of the Driver-Seegmiller backward-facing-step channel for
  the parallel-roof (0 degree divergence) case described in the attached NASA validation page, as ONE
  solid suitable for CFD meshing. Use the documented ratios and the step height H = 0.5 in = 12.7 mm:
  step height to tunnel exit (downstream) height 1:9, step height to tunnel width 1:12, so the upstream
  channel height is the downstream height minus H. Cover exactly the documented computational domain x/H
  = -105 to +50. Frame: +x streamwise with x = 0 at the step face (upstream is negative x), +y spanwise
  across the tunnel width with y = 0 at one side wall, +z vertical with z = 0 at the downstream floor
  (the upstream floor therefore sits at z = H). Expose H, the width, the two channel heights, the roof
  angle, and the upstream/downstream domain lengths as named parameters, and name the flow-boundary faces
  (inlet, outlet, roof, upstream floor, step face, downstream floor, side walls) in the contract so the
  mesher can find them. The measured reattachment location is a downstream validation target, not a geometry
  input; do not tune anything to it.'
inputs:
- path: inputs/nasa-backstep-study01.md
  kind: text
  sha256: 2aca80462b8cd0fd2554c59a156e6a1149921d26b51fbe763e393f3a065e05b2
  note: NASA page text (figures omitted)
