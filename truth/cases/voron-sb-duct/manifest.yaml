id: voron-sb-duct
title: 'Voron Stealthburner printhead front (Rapido V2): two part-cooling ducts, hotend cavity, fan opening;
  interior connectivity, passage volumes, sections and wall minimum'
truth_class: B
role: validation
source:
  citation: VoronDesign, Voron-Stealthburner, CAD/Printheads/Stealthburner_Printhead_Rapido_V2.step (front
    body, solid 0)
  urls:
  - https://github.com/VoronDesign/Voron-Stealthburner/tree/main/CAD
  - https://raw.githubusercontent.com/VoronDesign/Voron-Stealthburner/main/CAD/Printheads/Stealthburner_Printhead_Rapido_V2.step
  accessed: '2026-09-17'
  revision: main as of 2026-09-17 (release 1.0, 2024-07-04)
  license: GNU GPL v3.0
intent: 'Reconstruct the Voron Stealthburner printhead front housing (Rapido V2 variant) as editable,
  parameterized KCL from the attached renders, section drawings and dimension sheet, in the reference
  frame (x symmetric about 0, back mating face y = 0 with the part extending to y = -27.4, z from 2.37
  at the nozzle end to 61.5 at the top). The interior matters most: two mirrored closed part-cooling ducts
  from the top fan inlets down to the forked nozzle outlets (about 8 x 19 mm channels with ~1 mm walls,
  never connected to each other), the hotend cavity (about 26 x 35 mm, open to the back and the nozzle
  end) with the round hotend-fan opening on the front, and the screw holes. Declare the duct probe points
  as void probes, the sections as acceptance sections, the ducts as passages and the wall minimum as a
  thickness check. Cosmetic styling, text and grille are optional. One solid; export STEP and STL. Reference
  CAD is evaluator-only.'
