# Deliberately wrong housings the scorer must reject (`python -m opencad.truth mutate bearing-housing --source truth`).
mutants:
- id: mounting_hole_shifted
  op: shift_hole
  near:
  - 38.25
  - 0.0
  - 5.5
  radius: 5.0
  offset:
  - 1.0
  - 0.0
  - 0.0
  expect_caught_by:
  - mounting_hole_right
  note: the +x mounting hole 1 mm off its spacing
- id: mounting_hole_missing
  op: fill_box
  min:
  - 33.0
  - -5.5
  - 0.0
  max:
  - 43.5
  - 5.5
  - 11.0
  expect_caught_by:
  - mounting_hole_right
  - section_flange_z5p5
  - openings_void
  note: the +x mounting hole never cut
- id: counterbore_missing
  op: fill_box
  min:
  - -16.5
  - -16.5
  - 12.0
  max:
  - 16.5
  - 16.5
  - 26.0
  expect_caught_by:
  - section_boss_z15
  - counterbore_floor
  - openings_void
  note: the counterbore largely filled (the bore alone remains)
- id: no_draft
  source: truth/housing-no-draft.step
  op: translate
  offset:
  - 0.0
  - 0.0
  - 0.0
  expect_caught_by:
  - section_boss_z15
  - section_boss_z24
  - draft_flat_pp
  note: the same construction without the 4 deg taper
- id: scaled_1p1
  op: scale
  factor: 1.1
  about:
  - 0.0
  - 0.0
  - 0.0
  expect_caught_by:
  - bbox_size
  - volume
  note: right shape, wrong size
