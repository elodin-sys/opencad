id: bearing-housing
title: 'Cast bearing housing (oval flanged unit): 4 deg drafted flange and boss, r = 1 rounds, Ø47 x 14
  counterbore over a Ø14 bore, two Ø10 mounting holes; one solid (fast regression)'
truth_class: B
role: validation
source:
  citation: build123d example "Cast Bearing Unit" (examples/cast_bearing_unit.py), housing body only;
    reference generated and frozen by scripts/derive_bearing_housing_truth.py with build123d 0.12.0
  urls:
  - https://build123d.readthedocs.io/en/latest/examples_1.html#cast-bearing-unit
  - https://github.com/gumyr/build123d/blob/cdaf1caa4c72436ebfe0907e1fb05e246d568cbc/examples/cast_bearing_unit.py
  accessed: '2026-09-22'
  revision: gumyr/build123d@cdaf1caa4c72436ebfe0907e1fb05e246d568cbc (2025-05-25)
  license: Apache-2.0 (Copyright 2025 Gumyr)
intent: 'Design the cast bearing housing exactly as specified in the attached specification: one connected
  solid in millimetres, datum plane the flange bottom (z = 0), bore axis the z axis. Flange = convex hull
  of a Ø57 circle at the origin and two Ø22 lobes at (+-38.25, 0), 11 thick; boss Ø57 to z = 26; every
  side face drafted inward 4 deg about z = 0; every edge of the drafted body rounded r = 1 before any
  hole is cut; Ø47 x 14 counterbore from the boss top over a Ø14 through bore; two Ø10 through holes at
  (+-38.25, 0). Declare the bbox, volume, the listed sections and faces, the four drafted flats as planes,
  every hole and bore as a cylinder with its depth, solid and void probes, and edit tests on the mounting-hole
  diameter and the through-bore diameter (no edits or sweeps on the drafted outline).'
