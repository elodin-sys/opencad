# Deliberately wrong bases the scorer must reject (`python -m opencad.truth mutate enclosure-base --source truth`).
mutants:
- id: wall_thinned_2mm
  op: cut_box
  min:
  - 46.999
  - -65.0
  - 3.0
  max:
  - 48.0
  - 65.0
  - 47.1
  expect_caught_by:
  - min_wall
  - volume
  - section_mid_z25
  note: the +x side wall 2 mm thick over its straight run
- id: bore_through_floor
  op: cut_box
  min:
  - 37.0
  - 62.0
  - -0.1
  max:
  - 39.0
  - 64.0
  - 3.1
  expect_caught_by:
  - material_solid
  - section_floor_z1p5
  - bore_floor_pp
  note: the +x +y post bore opened through the floor
- id: cavity_filled
  op: fill_box
  min:
  - -40.0
  - -60.0
  - 3.0
  max:
  - 40.0
  - 60.0
  - 46.0
  expect_caught_by:
  - openings_void
  - volume
  - cavity_floor
  note: most of the cavity left solid
- id: bore_shifted
  op: shift_hole
  near:
  - 38.0
  - 63.0
  - 25.0
  radius: 2.0
  offset:
  - 1.5
  - 0.0
  - 0.0
  expect_caught_by:
  - bore_pp
  note: a post bore 1.5 mm off its post axis
- id: built_50_tall
  source: truth/base-50-tall.step
  op: translate
  offset:
  - 0.0
  - 0.0
  - 0.0
  expect_caught_by:
  - bbox_size
  - rim
  note: the base built to the 50 mm enclosure height instead of the 47 mm split
- id: scaled_1p1
  op: scale
  factor: 1.1
  about:
  - 0.0
  - 0.0
  - 0.0
  expect_caught_by:
  - bbox_size
  - volume
  note: right shape, wrong size
