id: enclosure-base
title: 'Enclosure base (CadQuery parametric enclosure, lower body): open 100 x 150 x 47 box, 3 mm walls
  and floor, four hollow Ø10/Ø4 screw posts with blind bores; one solid (fast regression)'
truth_class: B
role: validation
source:
  citation: CadQuery documentation example "A Parametric Enclosure", base body only (published default
    parameters, split 4 mm below the top, lower body selected by position); reference generated and frozen
    by scripts/derive_enclosure_base_truth.py with CadQuery 2.8.0
  urls:
  - https://cadquery.readthedocs.io/en/latest/examples.html#a-parametric-enclosure
  - https://github.com/CadQuery/cadquery/blob/17846d631e26e8deee0fee43bd6daa1c5c5dbee2/doc/examples.rst
  accessed: '2026-09-22'
  revision: CadQuery/cadquery@17846d631e26e8deee0fee43bd6daa1c5c5dbee2 (2023-10-22)
  license: Apache-2.0 (CadQuery)
intent: 'Design the enclosure base exactly as specified in the attached specification: one connected solid
  in millimetres, datum plane the bottom face (z = 0), origin at the footprint centre. Outer 100 x 150
  with r = 10 vertical corners and an r = 2 bottom edge round, 47 tall with a flat sharp rim; cavity 94
  x 144 with r = 7 corners from the 3 mm floor (z = 3) to the open top; four free-standing Ø10 screw posts
  at (+-38, +-63) from the floor to z = 47 with Ø4 bores that stop at the floor. Declare the bbox, volume,
  the listed sections and faces, every post and bore as a cylinder with its extent, solid and void probes,
  a wall-thickness check (p05 >= 2.9), and edit tests on the outer width (wall thickness and 12 mm post
  inset preserved) and the post bore diameter.'
