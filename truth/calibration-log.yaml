# Cases are never edited to pass; the tools are. Entries are appended, never rewritten.
entries:
  - date: "2026-09-15"
    case: nasa-backstep-driver-seegmiller
    attempt: 1
    observed: >-
      Scorecard PASS 15/15 on the first attempt (contract drafted by Codex in one round, blockout
      1 iteration, no gate retry). Pipeline gate edit_robustness FAILED 0/3: the model locked the
      derived parameters with `assert(tunnelWidth, isEqualTo = 12 * stepHeight, tolerance = 0.001mm)`
      (and the same for both domain lengths), so every single-parameter edit test aborted with an
      assert failure.
    change: >-
      codex.KCL_RULES now forbids equality asserts between contract parameters (sanity guards only);
      initialize.draft_brief now steers edit tests toward independent parameters and defines an
      edit test on a derived parameter as a formula override. The failing model was corrected on its
      own thread and re-verified from the verify stage (see attempts.yaml).
    reason: "editability is a scorecard item; a hard equality lock makes the KCL non-parametric in the contract's terms"
    files: [src/opencad/codex.py, src/opencad/initialize.py]
