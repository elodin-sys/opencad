  - {path: sources/carrier.step, kind: cad, role: authoritative, sha256: 722359a37582ddd48f6408bcd018eca6d3010b33d1c6658e20d6371c3a48916e, units: mm, revision: sn0002, note: "Aleph carrier board KiCad board-assembly export, every component included"}
  - {path: sources/orin-nano-module.stp, kind: cad, role: authoritative, sha256: cfb7faafc64cfbc85fbfadcb932e971cb452b4c38573e4f0db4a2a7e0d2ff7dc, units: mm, note: "NVIDIA Jetson Orin NX/Nano module (Creo export GROGU_BOARD_MEMORY)"}
  - {path: sources/README.txt, kind: text, role: authoritative, sha256: cee986a2965a7ae13b06508882b4537560c3e2b40b773ace0f48d36eb3b19ea6, note: module model DRAM height matches the tallest device over the modules' life}
  - {path: sources/assembled.png, kind: image, role: illustrative, sha256: a3e377d0b30e3f399e399a2d6872dfecc8daf164b8b26437fc00b73fb34b3e6d, note: photo of the assembled stack}
  - {path: sources/orin-fan.jpg, kind: image, role: illustrative, sha256: a8626d6bbfb0cfc80af74c42f1ce5c157d233e610eaf5075a00487d0f749c0bf, note: "module with heatsink-and-fan, front view; heatsink footprint and fan size scale"}
  - {path: sources/orin-fan-2.jpg, kind: image, role: illustrative, sha256: 8ea2e7804e2ced44436a1d25c80800069f3e840bde2dc6ae296bc82ffce2fc24, note: heatsink-and-fan alone}
  - {path: sources/orin-fan-brackets.webp, kind: image, role: illustrative, sha256: 28ce624d58d2c497a82f0c5f50d4f8c904e63c5dada1cf06fe373a97ad1f7745, note: heatsink with its X spring bracket and four shoulder screws}
  - {path: sources/orin-fan-profile.avif, kind: image, role: illustrative, sha256: 2247285bf72f81d879b33d0d5cd570c6258e74219b4c33e569cb7db5151a6b0d, note: original of orin-fan-profile.png (not readable by image readers)}
  - {path: sources/orin-fan-profile.png, kind: image, role: illustrative, sha256: f29b908bedca8250bb2790f1cbeac16fdd15329135b1adbf5dcb185c7d19641f, note: "module with heatsink-and-fan, perspective"}
open_questions:
  - "Heatsink-and-fan size has no CAD: 61.0 x 40.0 x 15.0 (above the SoC lid) and the D38.5 fan intake are photo estimates (+-2, +-2, +-3, +-1.5). Its top (z = 38.52) is the stack's top, so a caliper measurement or NVIDIA's thermal-solution drawing should replace them."
  - "Heatsink screw thread and depth (modelled D2.5 x 5 blind) and the X spring bracket under the module are not measured; the bracket and the four shoulder screws are not modelled."
  - "Board stack height 10.0 comes from the Samtec ERM5/ERF5 05.0 + 05.0 lead styles, not from a standoff drawing; confirm the standoff length and diameter (modelled D5.0 round, photo estimate)."
  - "The four knurled thumbscrews on the carrier's corner holes and the feet under the base board (visible in assembled.png) have no source dimensions and are not modelled; they add height above the carrier corners and set the lowest point of the stack (now z = -1.97, the deepest base bottom part)."
  - "The fan cable and its connector (to the carrier's Molex 53398-0471 header, presumably) are flexible and not modelled."
  - "The module's keep-out shells (top-side parts to 5.08 above its PCB, under the heatsink; bottom-side parts to 1.4 below it) are left out; the heatsink block therefore does not carry the pockets the real heatsink needs over them."
release_status: reconstruction
