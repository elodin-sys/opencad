  flanks and rounded tips; no pressure angle, pitch diameter, addendum/dedendum factors or cutter is stated. gearModule 0.569
  mm is only a tooth-count threshold.
- What are the 68 tooth-flank planes omitted from the dimension sheet as below the area threshold (4 listed at 2.45 mm2)?
  The 36 tip fillets and the y=2 section constrain the envelope, but individual omitted flanks are not named.
- The stated bbox size [20.483, 4.0, 20.483] is 0.001 mm short of max-min = [20.484, 4.0, 20.484] from the stated min/max
  ±10.242. Envelope uses the stated min/max; tipOuterRadius = 10.242 matches those bounds. Which rounding is authoritative?
- Is the Ø19 partial cylinder the true root/dedendum face, or a construction/envelope cylinder interrupted by the teeth? The
  sheet lists it as pin Ø19, length 3, full 360 = no.
- Does the Ø3.1 hole remain a 1 mm cylinder in the floor only, or should a modeller treat the hex socket plus bore as one
  through passage of mixed section? The sheet lists only the cylindrical 1 mm portion.
- What material, density and manufacturing process are intended? Unspecified; material, density_kg_m3 and process remain null.
  Volume and centre of mass are geometric (unit density), not a mass claim.
- How should evaluator-only surface deviation against the held-out reference CAD be reported? No reference mesh is in this
  bundle; acceptance.deviation is null.
