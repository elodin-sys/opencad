schema_version: 1
name: fusion-16418-recon
intent: 'Reconstruct the mechanical part shown in the attached renders, sections and dimension sheet as editable, parameterized
  KCL in the part''s own frame (bbox min [-10.242, 0.0, -10.242], size [20.483, 4.0, 20.483] mm). Declare every hole, boss
  and shaft as an acceptance cylinder and every planar face level as a named face; one solid; export STEP and STL. Held-out:
  the pipeline is frozen, the reference CAD is evaluator-only.'
units:
  length: mm
  angle: deg
material: null
density_kg_m3: null
process: null
release_status: reconstruction
frame:
  origin: Intersection of the gear / hex / bore axis with the circular face at y = 0. This is [0,0,0] in the dimension sheet's
    native frame (bbox centred in x and z, sitting on y = 0).
  axes:
    x: '+x is the sheet +x: from the axis toward the +x envelope (tooth tip at x = +10.242). In front.png, +x is to the right.
      A hex flat is perpendicular to +x at x = +3.463 (pocket) and x = +4.332 (boss).'
    y: +y is the sheet +y, from the circular face toward the hexagonal boss. Disc occupies y = 0..3; boss cap is y = 4. In
      top.png, +y is up.
    z: +z is the sheet +z, completing a right-handed frame (x cross y = z). In front.png, +z is up. The hex is pointy-top
      in this view (vertices on ±z).
  datums:
  - name: A
    description: Circular face at y = 0, outward normal −y. Primary seating face opposite the hex boss.
  - name: B
    description: 'Common axis of the Ø3.1 bore, the hex socket and the tooth pattern: x = z = 0, directed +y.'
  - name: C
    description: 'Hex clocking: pointy-top hex with flats parallel to the YZ plane (across-flats along x). Tooth 0 has its
      tip-fillet axis on +x.'
envelope:
  min: [-10.242, 0.0, -10.242]
  max: [10.242, 4.0, 10.242]
  tolerance: 0.05
parameters:
- name: envelopeMinX
  value: -10.242
  unit: mm
  provenance: stated
  tolerance: 0.01
  source: 'sources/dimension-sheet.md — Envelope and mass properties: bbox min [-10.242, 0.0, -10.242]'
  description: Minimum x of the axis-aligned envelope; a tooth tip fillet reaches this station.
- name: envelopeMinY
  value: 0.0
  unit: mm
  provenance: stated
  tolerance: 0.01
  source: 'sources/dimension-sheet.md — Envelope and mass properties: bbox min y = 0.0; axis-aligned face y = 0'
  description: Circular face opposite the hex boss (datum A).
- name: envelopeMinZ
  value: -10.242
  unit: mm
  provenance: stated
  tolerance: 0.01
  source: 'sources/dimension-sheet.md — Envelope and mass properties: bbox min [-10.242, 0.0, -10.242]'
  description: Minimum z of the axis-aligned envelope.
- name: envelopeSizeX
  value: 20.483
  unit: mm
  provenance: stated
  tolerance: 0.01
  source: 'sources/dimension-sheet.md — Envelope and mass properties: size [20.483, 4.0, 20.483]'
  description: Stated x extent. 2*10.242 = 20.484; the 0.001 mm rounding is in open_questions.
- name: envelopeSizeY
  value: 4.0
  unit: mm
  provenance: stated
  tolerance: 0.01
  source: 'sources/dimension-sheet.md — Envelope and mass properties: size y = 4.0; face y = 4'
  description: Overall height from the circular face to the hex-boss cap. Edit grows the boss in +y.
  edit_test:
    delta: 1.0
    expect:
      volume_delta: 23.38
      direction: increase
      tolerance_rel: 0.02
      bbox_delta: [0.0, 1.0, 0.0]
    sweep:
      values: [3.5, 4.0, 5.0]
    infeasible_deltas: [-4.0]
- name: envelopeSizeZ
  value: 20.483
  unit: mm
  provenance: stated
  tolerance: 0.01
  source: 'sources/dimension-sheet.md — Envelope and mass properties: size [20.483, 4.0, 20.483]'
  description: Stated z extent; same 0.001 mm rounding as envelopeSizeX.
- name: discThickness
  value: 3.0
  unit: mm
  provenance: stated
  tolerance: 0.01
  source: sources/dimension-sheet.md — face +y at y = 3; pin Ø19 and Ø0.2 extent 0 .. 3
  description: Toothed disc occupies y = envelopeMinY .. envelopeMinY+discThickness.
- name: hexFloorY
  value: 1.0
  unit: mm
  provenance: stated
  tolerance: 0.01
  source: sources/dimension-sheet.md — axis-aligned face +y at y = 1, area 34.02
  description: Floor of the hexagonal socket. Edit lowers this floor into the disc.
  edit_test:
    delta: -0.2
    expect:
      volume_delta: -6.804
      direction: decrease
      tolerance_rel: 0.02
      bbox_delta: [0.0, 0.0, 0.0]
    sweep:
      values: [0.6, 1.0, 1.4]
    infeasible_deltas: [-1.2, 3.1]
- name: hexPocketFlat
  value: 3.463
  unit: mm
  provenance: stated
  tolerance: 0.01
  source: sources/dimension-sheet.md — axis-aligned faces x = ±3.463, area 12 each
  description: Inner hex across-flats half-width (pointy-top hex, flats parallel to YZ).
- name: hexBossFlat
  value: 4.332
  unit: mm
  provenance: stated
  tolerance: 0.01
  source: sources/dimension-sheet.md — axis-aligned faces x = ±4.332, area 5 each
  description: Outer hex-boss across-flats half-width.
- name: hexPocketVertex
  value: 4.0
  unit: mm
  provenance: stated
  tolerance: 0.02
  source: 'sources/dimension-sheet.md — inclined planes: points (0.003, 3, 4.0) and (-0.003, 3, -4.0)'
  description: Inner hex vertex radius (pointy-top). Plane-table x offsets of 0.003 mm are extractor noise.
- name: hexBossVertex
  value: 5.0
  unit: mm
  provenance: stated
  tolerance: 0.02
  source: 'sources/dimension-sheet.md — inclined planes: points (0.003, 3, 5.0) and (-0.003, 3, -5.0)'
  description: Outer hex-boss vertex radius (pointy-top).
- name: boreDiameter
  value: 3.1
  unit: mm
  provenance: stated
  tolerance: 0.02
  source: 'sources/dimension-sheet.md — cylindrical features: hole Ø3.1; counts hole Ø3.1: 1'
  description: Through-hole in the 1 mm floor under the hex socket.
- name: boreLength
  value: 1.0
  unit: mm
  provenance: stated
  tolerance: 0.02
  source: sources/dimension-sheet.md — hole Ø3.1 extent 0 .. 1 from [0,0,0], length 1
  description: Axial length of the cylindrical bore; equals hexFloorY at the stated values.
- name: rootDiameter
  value: 19.0
  unit: mm
  provenance: stated
  tolerance: 0.02
  source: 'sources/dimension-sheet.md — cylindrical features: pin Ø19, partial, length 3; counts pin Ø19.0: 1'
  description: Dedendum cylinder of the tooth spaces, y = 0 .. 3.
- name: tipFilletDiameter
  value: 0.2
  unit: mm
  provenance: stated
  tolerance: 0.02
  source: 'sources/dimension-sheet.md — 36 pins Ø0.2, partial, length 3; counts pin Ø0.2: 36'
  description: Rounded tip of each tooth.
- name: tipCircleRadius
  value: 10.142
  unit: mm
  provenance: stated
  tolerance: 0.02
  source: sources/dimension-sheet.md — Ø0.2 pin axes, e.g. [10.142, 0, 0] and [0, 0, ±10.142]
  description: Circle through the 36 tip-fillet axes.
- name: toothCount
  value: 36
  unit: ''
  provenance: stated
  tolerance: 1.0e-06
  source: 'sources/dimension-sheet.md — counts pin Ø0.2: 36; front.png and section-y2.png tooth count'
  description: Integer tooth count; one tip fillet per tooth.
- name: toothPhase
  value: 0.0
  unit: deg
  provenance: stated
  tolerance: 0.05
  source: sources/dimension-sheet.md — tip pin at [10.142, 1.5, 0.0]; front.png tooth on +x and +z
  description: Tip-fillet centre angle of tooth 0, from +x toward +z about +y.
- name: hubHeight
  value: 1.0
  unit: mm
  provenance: derived
  tolerance: 0.01
  formula: envelopeSizeY - discThickness
  description: Hex-boss height above the disc top.
- name: hexPocketDepth
  value: 3.0
  unit: mm
  provenance: derived
  tolerance: 0.01
  formula: envelopeSizeY - hexFloorY
  description: Hex socket from the floor through the boss cap.
- name: hexPocketAcross
  value: 6.926
  unit: mm
  provenance: derived
  tolerance: 0.02
  formula: 2 * hexPocketFlat
  description: Inner hex across-flats.
- name: hexBossAcross
  value: 8.664
  unit: mm
  provenance: derived
  tolerance: 0.02
  formula: 2 * hexBossFlat
  description: Outer hex across-flats.
- name: boreRadius
  value: 1.55
  unit: mm
  provenance: derived
  tolerance: 0.01
  formula: boreDiameter / 2
  description: Bore radius.
- name: rootRadius
  value: 9.5
  unit: mm
  provenance: derived
  tolerance: 0.01
  formula: rootDiameter / 2
  description: Dedendum radius.
- name: tipFilletRadius
  value: 0.1
  unit: mm
  provenance: derived
  tolerance: 0.01
  formula: tipFilletDiameter / 2
  description: Tooth-tip fillet radius.
- name: tipOuterRadius
  value: 10.242
  unit: mm
  provenance: derived
  tolerance: 0.02
  formula: tipCircleRadius + tipFilletRadius
  description: Addendum radius; equals |envelope min/max| on x and z.
- name: toothPitchDeg
  value: 10.0
  unit: deg
  provenance: derived
  tolerance: 0.01
  formula: 360 / toothCount
  description: Angular pitch. Sheet tip axes lie on this grid within 0.004 deg.
- name: gearModule
  value: 0.569
  unit: mm
  provenance: inferred
  tolerance: 0.05
  rationale: No module, pitch diameter or pressure angle is stated. 2*tipOuterRadius/toothCount = 0.569 mm is only the inspector
    tooth-count threshold (tipRadius - 0.6*module stays on the tooth body, above the Ø19 root). It is not a claim that the
    teeth are standard involute of this module.
  description: Counting-aid module for acceptance.gears; tooth form remains an open question.
features:
- id: toothedDisc
  kind: extrude
  description: 36-tooth disc from y=0 to y=3, outer envelope tipOuterRadius, root cylinder Ø19.
  parameters:
  - discThickness
  - envelopeMinY
  - rootDiameter
  - tipCircleRadius
  - tipFilletDiameter
  - toothCount
  - toothPhase
  - envelopeSizeX
  - envelopeSizeZ
  count: 36
  verify:
  - method: bbox
  - method: solid
    points:
    - [6.0, 1.5, 0.0]
  - method: section
    section: y2
  - method: face
    face: discBottom
  - method: face
    face: discTop
  - method: cylinder
    cylinder: rootCylinder
  - method: dimension
    dimension: spanX
  - method: dimension
    dimension: spanZ
- id: hexBoss
  kind: boss
  description: Pointy-top hexagonal boss on the disc, y=3..4, vertex radius 5, flats at x=±4.332.
  parameters:
  - hexBossFlat
  - hexBossVertex
  - hexBossAcross
  - hubHeight
  - discThickness
  - envelopeSizeY
  verify:
  - method: face
    face: hexBossTop
  - method: face
    face: hexBossLeft
  - method: face
    face: hexBossRight
  - method: plane
    plane: hexBoss60
  - method: plane
    plane: hexBoss120
  - method: plane
    plane: hexBoss240
  - method: plane
    plane: hexBoss300
  - method: solid
    points:
    - [3.9, 3.5, 0.0]
  - method: dimension
    dimension: hexBossAcrossFlats
  - method: dimension
    dimension: overallHeight
- id: hexPocket
  kind: pocket
  description: Pointy-top hexagonal socket from y=1 through y=4, vertex radius 4, flats at x=±3.463.
  parameters:
  - hexPocketFlat
  - hexPocketVertex
  - hexPocketAcross
  - hexFloorY
  - hexPocketDepth
  - envelopeSizeY
  verify:
  - method: face
    face: hexFloor
  - method: face
    face: hexPocketLeft
  - method: face
    face: hexPocketRight
  - method: plane
    plane: hexPocket60
  - method: plane
    plane: hexPocket120
  - method: plane
    plane: hexPocket240
  - method: plane
    plane: hexPocket300
  - method: void
    points:
    - [0.0, 2.5, 0.0]
  - method: section
    section: y2
  - method: count
    section: y2
    count: 1
  - method: dimension
    dimension: hexPocketAcrossFlats
- id: centerBore
  kind: hole
  description: Ø3.1 hole through the 1 mm floor on the part axis, connecting the hex socket to the circular face.
  parameters:
  - boreDiameter
  - boreLength
  - boreRadius
  - hexFloorY
  verify:
  - method: cylinder
    cylinder: boreHole
  - method: void
    points:
    - [0.0, 0.5, 0.0]
  - method: section
    section: x0
  - method: section
    section: z0
- id: tipFillets
  kind: pattern
  count: 36
  description: One Ø0.2 tip-fillet cylinder per tooth, axes on tipCircleRadius at k*toothPitchDeg from +x, y=0..3.
  parameters:
  - tipFilletDiameter
  - tipFilletRadius
  - tipCircleRadius
  - toothCount
  - toothPhase
  - toothPitchDeg
  - discThickness
  verify:
  - method: cylinder
    cylinder: tipFillet0
  - method: cylinder
    cylinder: tipFillet9
  - method: cylinder
    cylinder: tipFillet18
  - method: cylinder
    cylinder: tipFillet27
- id: toothFlanksListed
  kind: other
  optional: true
  description: Four tooth-flank planes above the dimension-sheet area threshold (2.45 mm2). The other 68 flanks were omitted
    from the sheet.
  parameters:
  - toothCount
  - discThickness
  verify:
  - method: plane
    plane: toothFlankA
  - method: plane
    plane: toothFlankB
  - method: plane
    plane: toothFlankC
  - method: plane
    plane: toothFlankD
interfaces:
- name: axisAndCircularSeat
  description: Part axis and the y=0 circular face remain the reconstruction frame when hub height or hex-floor depth changes.
  must_not_change: true
  checks:
  - discBottom
  - boreHole
  - spanX
  - spanZ
- name: hexDrive
  description: Hex socket and boss across-flats and diagonal walls stay put under the two edit tests.
  must_not_change: true
  checks:
  - hexPocketLeft
  - hexPocketRight
  - hexBossLeft
  - hexBossRight
  - hexPocketAcrossFlats
  - hexBossAcrossFlats
  - hexPocket60
  - hexPocket120
  - hexPocket240
  - hexPocket300
  - hexBoss60
  - hexBoss120
  - hexBoss240
  - hexBoss300
- name: toothPattern
  description: 36-tooth mid-disc section topology and named root/tip cylinders survive the height and floor edits.
  must_not_change: true
  checks:
  - y2
  - teeth
  - rootCylinder
  - tipFillet0
  - tipFillet9
  - tipFillet18
  - tipFillet27
acceptance:
  bbox_tolerance: 0.05
  volume:
    expected: 827.65
    tolerance: 2.0
    provenance: stated
    note: 'sources/dimension-sheet.md Envelope and mass properties: volume 827.65 mm3 (measured on the reference in its native
      frame).'
  surface_area:
    expected: 963.43
    tolerance: 5.0
    provenance: stated
    note: 'sources/dimension-sheet.md Envelope and mass properties: surface area 963.43 mm2; 161 faces (88 planar).'
  center_of_mass:
    expected: [0.0, 1.515, 0.0]
    tolerance: 0.05
    provenance: stated
    note: 'sources/dimension-sheet.md Envelope and mass properties: centre of mass [0.0, 1.515, 0.0]. Geometric centroid at
      unit density; no material is specified.'
  solid_count: 1
  sections:
  - id: x0
    plane: x
    at: 0.0
    expect:
      area: 44.36
      area_tolerance_rel: 0.02
      loops: 2
      holes: 0
    description: 'Two islands (sheet: centroids (1.48, ±6.52), bbox 4 x 8.69). Cuts hex vertices and the ±z teeth.'
  - id: y2
    plane: y
    at: 2.0
    expect:
      area: 256.75
      area_tolerance_rel: 0.01
      loops: 1
      holes: 1
    description: Toothed outline minus the hex socket. Tooth count is acceptance.gears, not loop count. Image caption 256.74
      mm2.
  - id: z0
    plane: z
    at: 0.0
    expect:
      area: 46.23
      area_tolerance_rel: 0.02
      loops: 2
      holes: 0
    description: 'Two islands (sheet: centroids (±6.38, 1.49), bbox 8.69 x 4). Cuts hex flats and the ±x teeth.'
  faces:
  - name: hexBossLeft
    plane: x
    at: -4.332
    normal: '-'
    area: 5.0
    area_tolerance_rel: 0.02
    tolerance: 0.02
    center: [3.5, 0.0]
    mode: one
  - name: hexPocketLeft
    plane: x
    at: -3.463
    normal: +
    area: 12.0
    area_tolerance_rel: 0.02
    tolerance: 0.02
    center: [2.5, 0.0]
    mode: one
  - name: hexPocketRight
    plane: x
    at: 3.463
    normal: '-'
    area: 12.0
    area_tolerance_rel: 0.02
    tolerance: 0.02
    center: [2.5, 0.0]
    mode: one
  - name: hexBossRight
    plane: x
    at: 4.332
    normal: +
    area: 5.0
    area_tolerance_rel: 0.02
    tolerance: 0.02
    center: [3.5, 0.0]
    mode: one
  - name: discBottom
    plane: y
    at: 0.0
    normal: '-'
    area: 290.77
    area_tolerance_rel: 0.01
    tolerance: 0.02
    center: [0.0, 0.0]
    mode: one
  - name: hexFloor
    plane: y
    at: 1.0
    normal: +
    area: 34.02
    area_tolerance_rel: 0.01
    tolerance: 0.02
    center: [0.0, 0.0]
    mode: one
  - name: discTop
    plane: y
    at: 3.0
    normal: +
    area: 233.37
    area_tolerance_rel: 0.01
    tolerance: 0.02
    center: [0.0, 0.0]
    mode: one
  - name: hexBossTop
    plane: y
    at: 4.0
    normal: +
    area: 23.38
    area_tolerance_rel: 0.01
    tolerance: 0.02
    center: [0.0, 0.0]
    mode: one
  cylinders:
  - name: boreHole
    point: [0.0, 0.5, 0.0]
    direction: [0.0, 1.0, 0.0]
    kind: hole
    diameter: 3.1
    radius_tolerance: 0.02
    axis_tolerance: 0.02
    length: 1.0
    length_tolerance: 0.02
    t_range: [-0.5, 0.5]
    description: Ø3.1 floor bore; extent y=0..1 from [0,0,0].
  - name: rootCylinder
    point: [0.0, 1.5, 0.0]
    direction: [0.0, 1.0, 0.0]
    kind: pin
    diameter: 19.0
    radius_tolerance: 0.02
    axis_tolerance: 0.02
    length: 3.0
    length_tolerance: 0.02
    t_range: [-1.5, 1.5]
    description: Partial Ø19 dedendum cylinder, y=0..3.
  - name: tipFillet0
