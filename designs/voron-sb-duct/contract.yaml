  kind: cut
  description: Optional top P-RPDV2 marking and two curved front arrows/recesses. Text font, relief depth and stroke
    width are not specified.
  parameters: []
  verify:
  - method: bbox
    note: Marking appearance has no hard acceptance value.
  optional: true
- id: cosmeticFanGrille
  kind: rib
  description: 'Central hub REQUIRED, vanes optional. The fan opening carries a solid central hub, about 16 mm wide (x -8..8)
    and 15 mm tall (z ~36..51, centred a little above the bore axis), running the full depth of the opening from the front
    face to the bore floor at y = -19.2; it is drawn in the y=-20 section and the front/isometric views. The scored sections
    z=45 (566 mm2, 8 % band: the hub is ~130 mm2 of it) and y=-20 pass through the hub, so a part without it cannot meet
    them; the description calls the grille cosmetic, this contract does not. The four swept vanes joining the hub to the
    rim are optional; with or without them the round front opening and both part-cooling ducts stay as drawn.'
  parameters: []
  verify:
  - method: section
    section: sec_z45
    note: The hub is a third material island at z=45 between the two side regions; the area band includes it.
  - method: solid
    points:
