# Reconstruction intent and acceptance; all coordinates use the supplied native frame.
# Whole-part volume/surface/COM are diagnostic in brief.md, not exterior-style gates.
schema_version: 1
name: voron-sb-duct
intent: 'Reconstruct the Voron Stealthburner printhead front housing (Rapido V2 variant) as editable, parameterized
  KCL from the attached renders, section drawings and dimension sheet, in the reference frame (x symmetric about
  0, back mating face y = 0 with the part extending to y = -27.4, z from 2.37 at the nozzle end to 61.5 at the top).
  The interior matters most: two mirrored closed part-cooling ducts from the top fan inlets down to the forked nozzle
  outlets (about 8 x 19 mm channels with ~1 mm walls, never connected to each other), the hotend cavity (about 26
  x 35 mm, open to the back and the nozzle end) with the round hotend-fan opening on the front, and the screw holes.
  Declare the duct probe points as void probes, the sections as acceptance sections, the ducts as passages and the
  wall minimum as a thickness check. Cosmetic styling, text and grille are optional. One solid; export STEP and
  STL. Reference CAD is evaluator-only.'
units:
  length: mm
  angle: deg
material: null
density_kg_m3: null
process: Printed housing; exact additive process and material unspecified.
release_status: reconstruction
frame:
  origin: Intersection of the toolhead center plane x=0 and the back mating plane y=0 with the reference z=0 plane.
    This lies in the open center, 2.367 mm below the lowest material. Do not move the bbox minimum to the origin.
  axes:
    x: Positive to the right in front.png; left/right duct routes straddle x=0. back.png uses horizontal -x.
    y: Positive out through the back mating face toward the mating toolhead. Housing material extends into negative
      y, from y=0 to the front at y=-27.4.
    z: Positive upward away from the nozzle end toward the top inlet rim; lowest material z=2.367 and top z=61.5.
  datums:
  - name: A
    description: Back mating patches on y=0, outward normal +y.
  - name: B
    description: Center reference plane x=0, halfway between envelope extrema x=-35.534 and +35.534; local hardware
      and mouth details are not all symmetric.
  - name: C
    description: Top inlet-rim plane z=61.5; reference z=0 is 61.5 mm below this plane, not on the part.
envelope:
  min:
  - -35.534
  - -27.4
  - 2.367
  max:
  - 35.534
  - 0
  - 61.5
  tolerance: 0.1
