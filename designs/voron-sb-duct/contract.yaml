open_questions:
- Q1. Which section source is correct at y=-5 (table 1726.99 mm2, 3 loops/6 holes; image 55.37 mm2, 5 regions) and
  z=20 (table 765.96 mm2; image 618.29 mm2)? The draft uses table areas, a disclosed 25% z=20 band, and leaves exact
  y=-5 loop/hole counts unpinned pending resolution.
- Q2. Does mirrored ducts mean exact mirrored top mouths as well as the principal routes and forks? The description
  suggests mirrored inlets, but top.png shows left x~-25..-10 and right x~5..18. The draft mirrors the core routes
  and probe stations while recording the visible asymmetric mouth transitions.
- Q3. What are the exact loft centerlines, section profiles, bend radii, fork-divider shape and port boundaries
  between the supplied stations? Interpolate the shown routes with the stated nominal walls; do not invent unseen
  hardware geometry.
- Q4. What are acceptable sealed air-volume ranges for each duct, and do the six proposed drawing-based plug boxes
  seal only the actual ports? No source gives per-duct volume limits; the passage checks report volume without a
  numeric band, and plug behavior needs validation against the eventual model.
- Q5. How should the approximate 26 x 35 mm hotend pocket at z~9..44 be reconciled with the larger fan transition
  and z=54 rear roof? No hotend hardware envelope, exact cavity depth or fit clearance is supplied; no rectangular
  hardware keep-out is assumed.
- Q6. What are the angular trim limits of the 20 partial cylindrical patches, the screw entry/chamfer profiles,
  and the lower mounting bores beyond the documented y=-7.5..0 segment? The axis/radius/length table is pinned,
  but full bores or full pins must not replace partial surfaces.
- Q7. Which material, density, printing process details, shrink allowance and fit tolerances are intended? Material
  and density remain unknown; all tolerances here are digital reconstruction comparisons, not manufacturing qualification.
- Q8. What upstream revision and cosmetic detail level should be retained? Source hashes pin this bundle, but no
  upstream commit, font, engraving depth, grille thickness or complete optional facet radii are provided; exterior
  mass properties remain diagnostic and hidden geometry is not scored.
