acceptance:
  bbox_tolerance: 0.1
  volume:
    expected: 3678.1
    tolerance_rel: 0.002
    provenance: derived
    note: |-
      Derived analytic nominal construction, using the inferred widths and measured wall centers. Angles in tan() are degrees.
      Aplan = overallWidth*(overallLength - noseLength/2).
      Q = gapWidth*(gapLowHeight + legMergeHeight)/2 (one gap area in xz).
      T = 2*singleTrackWidth + 2*doubleTrackWidth.
      V = Aplan*bodyHeight + tabCount*tabWidth*overallWidth*tabHeight - legCount*overallWidth*Q - l10CavityLength*l10CavityWidth*thinWallHeight + l10CavityLength*thinWallHeight*T = 3678.10 mm3.
      Center-of-mass formula (PointQuantity has no note field): C = sum(v_i*c_i)/V, with signed volumes and centroids of the pentagonal prism, 11 tab prisms, 12 negative gap prisms, negative cavity box, and four positive wall prisms as detailed in brief §5. First moments [Mx,My,Mz] = [135794.55, 9195.73, 24543.675] mm4; C=[36.919754765,2.500130502,6.672922161] mm.
      Reference comparison only: reference/reference.json measurements.volume=3679.060003280461 mm3 (suggested ±1%); its 0.960003 mm3 excess is explained by reference nominal track widths about 0.11/0.22 mm versus inferred 0.10/0.20 mm. Do not silently replace the contract widths with mesh dimensions.
  surface_area:
    expected: 3384.458441227157
    tolerance_rel: 0.002
    provenance: derived
    note: |-
      Derived total material boundary area, including the five sealed pockets. Aplan and Q are defined in acceptance.volume.note.
      Pplan=2*(overallLength-noseLength)+overallWidth+2*sqrt(noseLength^2+(overallWidth/2)^2).
      Sext=2*Aplan+Pplan*bodyHeight+2*tabCount*tabHeight*(overallWidth+tabWidth)+legCount*(overallWidth*(gapLowHeight+legMergeHeight+sqrt(gapWidth^2+(legMergeHeight-gapLowHeight)^2)-gapWidth)-2*Q)=3170.058441227157 mm2.
      qSum=l10CavityWidth-2*singleTrackWidth-2*doubleTrackWidth=3.4 mm.
      Svoid=2*((l10CavityLength+thinWallHeight)*qSum+(thinWallCount+1)*l10CavityLength*thinWallHeight)=214.4 mm2.
      Stotal=Sext+Svoid=3384.458441227157 mm2. The supplied reference mesh measures 3383.498437946426 mm2; reference track widths reduce the internal area by about 0.96 mm2.
  center_of_mass:
    expected:
    - 36.919754765
    - 2.500130502
    - 6.672922161
    tolerance: 0.25
    provenance: derived
  solid_count: 1
  sections:
  - id: feetBelowCavity
    plane: z
    at: 0.5
    expect:
      area: 248.75
      area_tolerance_rel: 0.01
      loops: 13
      holes: 0
    description: 'Derived: Aplan - legCount*gapWidth*overallWidth = 248.75 mm2. The end block and twelve separate
      feet give 13 outer loops; L10 is solid below its 1 mm cavity floor.'
  - id: feetAndThinWalls
    plane: z
    at: 3
    expect:
      area: 235.15
      area_tolerance_rel: 0.01
      loops: 13
      holes: 5
    description: 'Derived: 248.75 - l10CavityLength*(l10CavityWidth - 2*singleTrackWidth - 2*doubleTrackWidth).
      L10 is one ring-and-ribs region with five holes; total outer loops remain 13.'
  - id: overhangs
    plane: z
    at: 6
    expect:
      area: 308.75
      area_tolerance_rel: 0.01
      loops: 13
      holes: 0
    description: 'Derived: Aplan - legCount*overallWidth*(gapWidth - (6-gapLowHeight)/tan(overhangAngle)). At z=6
      each gap has narrowed from 2 mm to 1 mm toward its +x end.'
  - id: solidBridge
