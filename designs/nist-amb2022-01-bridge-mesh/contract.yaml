      above the 7 mm gap closure.'
  - id: topTabs
    plane: z
    at: 12.25
    expect:
      area: 55
      area_tolerance_rel: 0.01
      loops: 11
      holes: 0
    description: 'Derived: tabCount*tabWidth*overallWidth = 55 mm2. Eleven disconnected section islands, each 1
      by 5 mm, connected to the same body below.'
  - id: l10Transverse
    plane: x
    at: 30.5
    expect:
      area: 46.4
      area_tolerance_rel: 0.01
