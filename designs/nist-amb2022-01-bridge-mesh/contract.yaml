# PartContract for editable construction. Figure 3 controls all external dimensions.
# Digital tolerances are comparison thresholds, not manufacturing tolerances.
# Reference models are inspection-only. Required final outputs: one-solid KCL, STEP and STL.
schema_version: 1
name: nist-amb2022-01-bridge-mesh
intent: 'Reconstruct the NIST AMB2022-01 individual bridge artifact as editable, parameterized KCL from the attached
  NIST description excerpts and figures; Figure 3 is the dimensioned plan and elevation drawing and is authoritative
  for every external dimension. Frame: x along the 75 mm length with x = 0 at the pointed (45 degree tapered) end
  and x increasing toward the far end, y across the 5 mm width with y = 0 at one long side face, z vertical from
  the build plate (z = 0) upward. Model the tapered nose, the tall solid end block, the twelve legs with their 45
  degree overhangs merging into the solid bridge, the eleven 1 mm wide top tabs on a 7 mm pitch, and the hollow
  leg L10 with its 0.5 mm outer walls, 1 mm base, four 4 mm tall internal thin walls parallel to x, and flat ceiling,
  exactly as documented. Where the sources do not fix a dimension (the single- and double-track thin-wall widths),
  record it as an open question and use a clearly labelled inferred value with a wide tolerance rather than approximating
  silently. One solid; export STEP and STL. Reference geometry supplied by NIST is for inspection only: the deliverable
  must be editable construction, never an import.'
units:
  length: mm
  angle: deg
material: null
density_kg_m3: null
process: Laser powder bed fusion (LPBF); nominal individual as-built geometry before EDM separation or tab skim
  cutting
release_status: reconstruction
frame:
  origin: Intersection of the tip plane x=0, the plane of the lower long side in Figure 3 plan y=0, and the build
    plate z=0. This datum intersection lies outside material. The physical nose tip is (0,2.5,0) at the base. This
    reproduces the supplied reference ingest min-datum frame.
  axes:
    x: Along the 75 mm length from the pointed nose toward the square far end; rightward in Figure 3 and in the
      recoating arrow direction.
    y: Across the 5 mm width from the lower long side in Figure 3 plan toward its upper long side; y=0 and y=5 are
      those side planes.
    z: Vertically upward from the build plate z=0; body top z=12 and tab tops z=12.5.
  datums:
  - name: A_buildPlate
    description: Common plane z=0 of the tall end-block foot and the twelve numbered leg feet; outward material
      normal -z.
  - name: B_longSide
    description: Plane y=0 containing the lower long side in Figure 3 plan, for x from the nose shoulder to the
      far end; outward normal -y.
  - name: C_tipPlane
    description: Plane x=0 through the pointed nose edge, perpendicular to the length. Intersect A, B and C to reproduce
      the coordinate origin.
  - name: D_farEnd
    description: Square far-end plane x=75, outward normal +x; L1 and the last top tab end here.
envelope:
  min:
  - 0
  - 0
  - 0
  max:
  - 75
  - 5
  - 12.5
  tolerance: 0.1
parameters:
- name: overallLength
  value: 75
  unit: mm
  provenance: stated
  tolerance: 0.01
  description: Tip-to-far-end distance; Figure 3 dimension 75 controls.
  source: 'sources/nist-amb2022-01-description.md §2.1.3: "75 mm long"; Figure 3 top dimension.'
- name: overallWidth
  value: 5
  unit: mm
  provenance: stated
  tolerance: 0.01
  description: Distance from the lower long side in the plan to the upper long side.
  source: 'sources/nist-amb2022-01-description.md §2.1.3: "5 mm wide"; Figure 3 plan dimension 5.'
- name: bodyHeight
  value: 12
  unit: mm
  provenance: stated
  tolerance: 0.01
  description: Build plate to main bridge top, excluding the raised tabs. Tabs translate with this top.
  source: 'sources/nist-amb2022-01-description.md §2.1.3: "12 mm tall"; §Process facts: tabs begin at 12 mm; Figure
    3 elevation dimension 12.'
  edit_test:
    delta: 1
    expect:
      volume_delta: 368.75
      direction: increase
      tolerance_rel: 0.02
      bbox_delta:
      - 0
      - 0
      - 1
- name: noseAngle
  value: 45
  unit: deg
  provenance: stated
  tolerance: 0.1
  description: Each nose flank makes 45 degrees with x in plan; the included tip angle is 90 degrees.
  source: 'sources/nist-amb2022-01-description.md §2.1.3: "45° taper"; Figure 3 left plan angle.'
- name: noseLength
  value: 2.5
  unit: mm
  provenance: derived
  tolerance: 0.1
  description: Tip plane to full-width shoulder. Figure 3 explicitly labels this length 2.5.
  formula: overallWidth / (2 * tan(noseAngle))
- name: legCount
  value: 12
  unit: ''
  provenance: stated
  tolerance: 0.01
  description: Twelve numbered feet L1-L12, excluding the tall tapered end block.
  source: 'sources/nist-amb2022-01-description.md §1: "12 legs of varying size"; Figure 4 leg numbering.'
- name: largeLegWidth
  value: 5
  unit: mm
  provenance: measured
  tolerance: 0.1
  description: x width of L1, L4, L7 and hollow L10.
  source: sources/nist-figure3-drawing.png elevation, far-right 5 callout; pixel columns 2766 to 2936, about 170
    px.
- name: mediumLegWidth
  value: 2.5
  unit: mm
  provenance: measured
  tolerance: 0.1
  description: x width of L3, L6, L9 and L12.
  source: sources/nist-figure3-drawing.png elevation, 2.5 callout; pixel columns 2528 to 2613, about 85 px.
- name: smallLegWidth
  value: 0.5
  unit: mm
  provenance: measured
  tolerance: 0.1
  description: x width of L2, L5, L8 and L11; independent of the L10 outer-wall thickness.
  source: sources/nist-figure3-drawing.png elevation, 0.5 callout; pixel columns 2681 to 2698, about 17 px.
- name: gapWidth
  value: 2
  unit: mm
  provenance: measured
  tolerance: 0.1
  description: x width of each of the twelve open-bottom gaps.
  source: sources/nist-figure3-drawing.png elevation, bottom 2 callout; pixel columns 2698 to 2766, about 68 px.
- name: overhangAngle
  value: 45
  unit: deg
  provenance: stated
  tolerance: 0.1
  description: Roof of each open-bottom gap rises toward +x; angle measured from x in elevation.
  source: 'sources/nist-amb2022-01-description.md §2.1.3: "45° overhangs"; Figure 3 elevation angle.'
- name: legMergeHeight
  value: 7
  unit: mm
  provenance: stated
  tolerance: 0.01
  description: z at the high end of the gap roofs, above which the bridge is continuous.
  source: 'sources/nist-amb2022-01-description.md §2.3: "height of 7 mm", where the gaps between legs merge.'
- name: gapLowHeight
  value: 5
  unit: mm
  provenance: derived
  tolerance: 0.1
  description: z at the left/low end of every gap roof; corroborated by the Figure 3 right-hand 5 and 2 dimensions.
  formula: legMergeHeight - gapWidth * tan(overhangAngle)
- name: legGroupCount
  value: 4
  unit: ''
  provenance: derived
  tolerance: 0.01
  description: Four triplets, each ordered medium, small, large when walking in +x.
  formula: legCount / 3
- name: legGroupPitch
  value: 14
  unit: mm
  provenance: derived
  tolerance: 0.15
  description: Triplet length including three gaps; corroborated by Figure 3 bottom 14 dimension, columns 2460 to
    2936.
  formula: mediumLegWidth + smallLegWidth + largeLegWidth + 3 * gapWidth
- name: endBlockLength
  value: 19
  unit: mm
  provenance: derived
  tolerance: 0.15
  description: End-block foot extends from x=0 to this position, before the first gap. Figure 3 columns 382 to 1030
    corroborate about 19.03 mm.
  formula: overallLength - legGroupCount * legGroupPitch
- name: tabCount
  value: 11
  unit: ''
  provenance: stated
  tolerance: 0.01
  description: Eleven full-width raised metrology ridges.
  source: 'sources/nist-amb2022-01-description.md §2.3: "11 tabs on top"; §3.4: "11 ridges"; counted in Figure 3.'
- name: tabWidth
  value: 1
  unit: mm
  provenance: measured
  tolerance: 0.1
  description: x width of every top tab.
  source: sources/nist-figure3-drawing.png plan far-right 1 callout; columns 2901 to 2936, about 35 px.
- name: tabPitch
  value: 7
  unit: mm
  provenance: measured
  tolerance: 0.1
  description: Pitch between corresponding edges of consecutive tabs.
  source: sources/nist-figure3-drawing.png plan far-right 7 callout; columns 2698 to 2936, about 238 px.
- name: tabHeight
  value: 0.5
  unit: mm
  provenance: measured
  tolerance: 0.1
  description: Tab rise above bodyHeight; this makes the total height 12.5 mm.
  source: sources/nist-figure3-drawing.png elevation left 0.5 callout; tab crests near row 1069, main top near row
    1085.
  edit_test:
    delta: 0.25
    expect:
      volume_delta: 13.75
      direction: increase
      tolerance_rel: 0.02
      bbox_delta:
      - 0
      - 0
      - 0.25
- name: firstTabX
  value: 4
  unit: mm
  provenance: derived
  tolerance: 0.15
  description: Start of tab 1 counted from the nose. The final tab ends at overallLength.
  formula: overallLength - tabWidth - (tabCount - 1) * tabPitch
- name: l10StartX
  value: 28
  unit: mm
  provenance: derived
  tolerance: 0.15
  description: Left boundary of hollow L10, the large foot of the first triplet after the end block.
  formula: endBlockLength + mediumLegWidth + smallLegWidth + 3 * gapWidth
- name: l10OuterWallThickness
  value: 0.5
  unit: mm
  provenance: stated
  tolerance: 0.1
  description: Nominal thickness of all four L10 outer walls; source says approximately. Retain square external
    L10 footprint.
  source: 'sources/nist-amb2022-01-description.md §2.1.3: "outer walls ... approximately 0.5 mm thick".'
- name: l10BaseThickness
  value: 1
  unit: mm
  provenance: stated
  tolerance: 0.01
  description: Solid base below every L10 pocket; cavity floors are at this z.
  source: 'sources/nist-amb2022-01-description.md §2.1.3: "solid base that is 1 mm thick"; Figure 3 1.0 callout.'
- name: thinWallHeight
  value: 4
  unit: mm
  provenance: stated
  tolerance: 0.01
  description: Height of four internal walls and five adjacent void pockets, measured above the solid base.
  source: 'sources/nist-amb2022-01-description.md §2.1.3: "walls are built 4 mm high before a flat-bottomed ceiling";
    Figure 3 4.0 callout.'
- name: l10CavityLength
  value: 4
  unit: mm
  provenance: derived
  tolerance: 0.2
  description: Clear x length between L10 outer walls; matches the Figure 3 horizontal 4 callout.
  formula: largeLegWidth - 2 * l10OuterWallThickness
- name: l10CavityWidth
  value: 4
  unit: mm
  provenance: derived
  tolerance: 0.2
  description: Clear y width before installing internal thin walls.
  formula: overallWidth - 2 * l10OuterWallThickness
- name: l10CavityStartX
  value: 28.5
  unit: mm
  provenance: derived
  tolerance: 0.15
  description: Left end of all five void pockets and all four internal wall spans.
  formula: l10StartX + l10OuterWallThickness
- name: l10CeilingZ
  value: 5
  unit: mm
  provenance: derived
  tolerance: 0.02
  description: Flat downward-facing cavity ceiling; material continues into the overhang and bridge above it.
  formula: l10BaseThickness + thinWallHeight
- name: thinWallCount
  value: 4
  unit: ''
  provenance: stated
  tolerance: 0.01
  description: 'Four distinct physical walls: single, double, single, double in increasing y; two walls of each
    width.'
  source: 'sources/nist-amb2022-01-description.md §2.1.3: "four thin-wall structures", two single-track and two
    double-track; Figure 4 labels.'
- name: singleTrackWidth
  value: 0.1
  unit: mm
  provenance: inferred
  tolerance: 0.08
  description: Provisional physical thickness of each single-track wall; not an as-built measurement.
  rationale: The supplied description gives only a laser spot diameter on the order of 0.1 mm. Use 0.10 mm as a
    necessary editable starting value, with a wide ±0.08 mm digital band. Neither laser spot size nor raster stroke
    thickness fixes the fused-wall width. The inspection mesh uses about 0.11 mm, which is corroboration of scale
    only. Open question OQ1 remains.
  edit_test:
    delta: 0.05
    expect:
      volume_delta: 1.6
      direction: increase
      tolerance_rel: 0.02
      bbox_delta:
      - 0
      - 0
      - 0
- name: doubleTrackWidth
  value: 0.2
  unit: mm
  provenance: inferred
  tolerance: 0.15
  description: Provisional physical thickness of each double-track wall; independent of singleTrackWidth for editing.
  rationale: Use 0.20 mm as a necessary starting value, twice the nominal 0.10 mm spot scale, with a wide ±0.15
    mm band. Track overlap and melt-pool width are unspecified, so this is not an enforced 2:1 relationship. The
    inspection mesh uses about 0.22 mm. Open question OQ1 remains.
- name: wall1CenterY
  value: 1.25
  unit: mm
  provenance: measured
  tolerance: 0.2
  description: Center of internal wall 1 along y, measured from the lower long-side datum; single track. Graphical
    placement remains qualified by OQ2.
  source: 'sources/nist-figure4-legs-thinwalls.png 3900x1771 raster: single line centered at row 1357; y = overallWidth/2
    + (1130.25 - row)/180.4, rounded to 0.05 mm; see brief §4.'
- name: wall2CenterY
  value: 2
  unit: mm
  provenance: measured
  tolerance: 0.2
  description: Center of internal wall 2 along y, measured from the lower long-side datum; double track. Graphical
    placement remains qualified by OQ2.
  source: 'sources/nist-figure4-legs-thinwalls.png 3900x1771 raster: double lines centered at rows 1211 and 1232
    (mean 1221.5); y = overallWidth/2 + (1130.25 - row)/180.4, rounded to 0.05 mm; see brief §4.'
- name: wall3CenterY
  value: 2.85
  unit: mm
  provenance: measured
  tolerance: 0.2
  description: Center of internal wall 3 along y, measured from the lower long-side datum; single track. Graphical
    placement remains qualified by OQ2.
  source: 'sources/nist-figure4-legs-thinwalls.png 3900x1771 raster: single line centered at row 1068; y = overallWidth/2
    + (1130.25 - row)/180.4, rounded to 0.05 mm; see brief §4.'
- name: wall4CenterY
  value: 3.6
  unit: mm
  provenance: measured
  tolerance: 0.2
  description: Center of internal wall 4 along y, measured from the lower long-side datum; double track. Graphical
    placement remains qualified by OQ2.
  source: 'sources/nist-figure4-legs-thinwalls.png 3900x1771 raster: double lines centered at rows 922 and 944 (mean
    933); y = overallWidth/2 + (1130.25 - row)/180.4, rounded to 0.05 mm; see brief §4.'
features:
- id: taperedNose
  kind: profile
  description: 'Full-height pentagonal nose in plan: tip (0,overallWidth/2), shoulders (noseLength,0) and (noseLength,overallWidth).
    Extrude to bodyHeight. The taper is in xy, with vertical flank faces.'
  parameters:
  - overallLength
  - overallWidth
  - bodyHeight
  - noseAngle
  - noseLength
  verify:
  - method: bbox
  - method: solid
    points:
    - - 0.5
      - 2.5
      - 6
    - - 2
      - 2.5
      - 11
    note: ''
  - method: void
    points:
    - - 1
      - 0.5
      - 6
    - - 1
      - 4.5
      - 6
    note: Points outside the two 45 degree plan flanks.
  - method: section
    section: solidBridge
  optional: false
- id: tallSolidEndBlock
  kind: extrude
  description: The tapered end block has a continuous solid foot x=0..endBlockLength, followed by the first rising
    roof. It is additional to the twelve numbered legs.
  parameters:
  - overallWidth
  - bodyHeight
  - noseLength
  - endBlockLength
  verify:
  - method: solid
    points:
    - - 10
      - 2.5
      - 0.5
    - - 10
      - 2.5
      - 11.5
    - - 18.75
      - 2.5
      - 4.75
    note: ''
  - method: face
    face: buildPlateEndBlock
  - method: section
    section: feetBelowCavity
  optional: false
- id: twelveLegs
  kind: pattern
  description: Four triplets of medium, small, large feet in +x. L12 is closest to the tall end block and L1 is
    at x=70..75. Every foot spans y=0..overallWidth. Only L10 is hollow above its base. Exact intervals and the
    twelve gaps are tabulated in the brief.
  parameters:
  - legCount
  - legGroupCount
  - legGroupPitch
  - endBlockLength
  - mediumLegWidth
  - smallLegWidth
  - largeLegWidth
  - gapWidth
  - overallWidth
  - legMergeHeight
  verify:
