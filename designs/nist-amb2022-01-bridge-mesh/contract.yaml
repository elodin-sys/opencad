      - 0.25
      - 3
    - - 67.75
      - 0.25
      - 3
    - - 72.5
      - 0.25
      - 3
    note: One interior probe per numbered foot, including a side wall of hollow L10.
  - method: face
    face: buildPlateL1
  - method: face
    face: buildPlateL2
  - method: face
    face: buildPlateL3
  - method: face
    face: buildPlateL4
