open_questions:
  - >-
    Fillet radii at the hub-to-pocket and pocket-to-flange corners are visible in
    section-x0.png and section-z-0.png but not stated. filletRadius is inferred 3 mm
    with tolerance 1.5 mm; inner vs outer radii are not resolved. Feature pocketFillets
    is optional.
  - >-
    Pocket outer diameter is not in the cylinder table. pocketDiameter 81.174 mm is
    derived from the 4156.33 mm2 y=3/y=12 faces as an annulus around the hub. Unstated
    fillets shrink that planar area, so a sharp-corner pocket may be slightly larger.
  - >-
    Hub Ø36 is not listed among the sheet cylinders (only the 763.41 mm2 end-face areas).
    It is a derived construction parameter, not an acceptance cylinder, so the inspector
    will not score a hub pin axis unless a later revision adds one.
  - >-
    The sheet gives four Ø10 holes with axial extent y = 4 .. 15 (length 11), but
    front.png, iso.png and iso-below.png show four corner openings on both faces.
    Acceptance cylinders follow the sheet. Whether y = 0 is a 4 mm blind skin or a
    cylinder-extraction artifact is unresolved; no solid probe was placed in the
    y = 0 .. 4 boss cores.
  - >-
    Envelope size x is listed as 126.701 mm while min/max ±63.351 imply 126.702 mm.
    render-notes.md mesh width is 126.682 mm. Contract uses the sheet min/max with
    envelope.tolerance 0.05.
  - >-
    Section image captions (y = 7.5 area 12002.30, z = 0 area 1042.53) differ from the
    sheet (11999.89 and 1041.45). Sheet values are authoritative.
  - >-
    faceY0Flange area 5188.92 vs faceY15Flange 5892.64 (difference 703.72 mm2) is stated
    but unexplained. Both values are recorded; no extra cut on y = 0 was invented.
  - >-
    Centre of mass y = 7.554 vs mid-thickness 7.5 is stated. Consistent with a slight
    +y mass bias (larger +y flange area, one-sided Ø10 extents) but no separate
    asymmetric feature was identified.
  - Material, density and process are unknown; mass claims are off-limits.
  - >-
    Reference lists 27 faces, 8 planar levels (smaller faces omitted). Remaining faces
    are cylindrical or fillet; no additional named planar levels.
  - >-
    No reference mesh is in this bundle (held-out evaluator CAD). acceptance.deviation
    is unset.
