open_questions:
  - "Material, density and process are not stated; mass claims are out of scope."
  - "The exposed shaft cylinder is reported from y = 9.708 to 88 (length 78.292 mm). That start is the R4/Ø5 tangent (y = 6 + sqrt(16 - 1.5^2)). Model the shaft as a cylinder unioned through the head out to y = yMin + overallLength so the tangent appears; do not treat 9.708 as a construction stop that is asserted equal to overallLength, because overallLength is an edit-test parameter."
  - "Iso and top views look circular because R4 on a 10 mm square leaves only 2 mm flats. The eight planar faces and four partial Ø8 pins in the dimension sheet fix a rounded square, not a Ø10 cylinder."
  - "Surface area 3802.07 mm2 is taken from the sheet; a closed-form including the shaft/fillet cheeks was not reconstructed to the last mm2 (analytic envelope without the blend is ~3815 mm2)."
