open_questions:
  - >-
    The dimension sheet lists one Ø2 hole of length 100 mm (extent x = -50..50), but
    section-z1.5.png shows only two ~5 mm edge notches and the x = ±45 faces of area
    π confirm blind ends. Are the two short bores the intended geometry (contract
    assumption), or is the sheet's single through-cylinder correct?
  - >-
    The through-slot is an ellipse in the top and z = 1.5 views (continuously curved,
    tips on x = ±35). No document names the conic. Is it a true ellipse, a stadium
    (straight sides plus semicircles), or another oval? Semi-axes 35 × 14 mm are
    measured/derived, not quoted.
  - >-
    Sheet volume 25187.47 mm³ and z = 1.5 area 8391.82 mm² differ by a few tenths of
    a percent from the image titles (8393.50 mm²) and from an analytic 35×14 ellipse
    (~25205 mm³). Which figure is the reconstruction target if they disagree?
  - >-
    What material, density and manufacturing process apply? None is stated; all remain
    null and no mass is claimed.
  - >-
    The sheet reports 18 faces (10 planar). Eight non-planar faces are not itemised
    beyond the four cylinders (five if the two edge bores are separate) and the slot
    wall. Are there additional blends or splits on the slot?
