parameters:
- name: sideScrewXNear
  value: 50.0
  unit: mm
  provenance: stated
  tolerance: 0.01
  source: 'designs/rpi5-enclosure/ecr/ecr3/request.md: "two per side at x = 50 and
    x = 75 (board frame)"'
  description: 'ECR-3: x of the near lid screw on each long side; axis (50, -4.5)
    and (50, 60.5), mid-depth of the 8 mm wall+boss band.'
- name: sideScrewXFar
  value: 75.0
  unit: mm
  provenance: stated
  tolerance: 0.01
  source: 'designs/rpi5-enclosure/ecr/ecr3/request.md: "two per side at x = 50 and
    x = 75 (board frame)"'
  description: 'ECR-3: x of the far lid screw on each long side; axis (75, -4.5) and
    (75, 60.5).'
- name: sideLidHoleDiameter
  value: 3.2
  unit: mm
  provenance: stated
  tolerance: 0.01
  source: 'designs/rpi5-enclosure/ecr/ecr3/request.md: "a Ø3.2 clearance hole through
    the lid flange"'
  description: 'ECR-3: the four lid clearance holes on the long sides, coaxial with
    the side-boss pilots (replaces the corner holes and lidHoleDiameter).'
- name: lidHoleDiameter
  _remove: true
- name: cornerPostWidth
  description: 'ECR-3: the 8 mm square corner feet remain in the floor plate only
    (the posts above the floor top are removed); the same value is the x-width of
    the four side bosses and lid flanges and their outer offset from the cavity (y
    = -8.5 and 64.5).'
- name: pilotDiameter
  description: Diameter of all four standoff pilots and, after ECR-3, of the four
    side-boss pilots (blind, pilotDepth from the rim).
- name: headroom
  edit_test:
    delta: 5
    expect:
      volume_delta: 3291.2
      direction: increase
      tolerance_rel: 0.02
      bbox_delta:
      - 0
      - 0
      - 5
    sweep:
      min: 15
      max: 35
      steps: 10
    infeasible_deltas:
    - -21
- name: standoffHeight
  edit_test:
    delta: 1
    expect:
      volume_delta: 1009.402822
      direction: increase
      tolerance_rel: 0.02
      bbox_delta:
      - 0
      - 0
      - 1
