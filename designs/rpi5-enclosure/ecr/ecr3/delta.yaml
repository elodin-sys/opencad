features:
- id: corner_post_fasteners
  _remove: true
- id: base_shell
  description: 'Rectangular cavity [-0.5,85.5] x [-0.5,56.5], straight 2.4 mm walls
    and 2.4 mm floor. ECR-3: the square corner posts exist only as 8 x 8 feet in the
    floor plate (z <= -standoffHeight); four side bosses 8 wide in x, centred on x
    = 50 and x = 75, fill y = -8.5..-2.9 and y = 58.9..64.5 from the floor exterior
    to the rim. Floor top is -standoffHeight; footprint O is defined in brief section
    5.'
- id: lid
  description: Separate flat 4 mm plate over the wall footprint [-2.9,87.9] x [-2.9,58.9]
    plus the four side flanges over the bosses (no corner lugs), below face at pcbThickness+headroom,
    four Ø3.2 through holes on the axes (50, -4.5), (75, -4.5), (50, 60.5), (75, 60.5).
    Apply source plug cutters to the lid at every headroom; they are inactive at nominal
    20 and form USB-A edge reliefs at 15.
  parameters:
  - headroom
  - pcbThickness
  - lidThickness
  - cornerPostWidth
  - sideScrewXNear
  - sideScrewXFar
  - sideLidHoleDiameter
- id: side_fasteners
  kind: hole
  count: 4
  description: 'Four lid screws on the long sides (y = 0 side and y = 56 side) at
    x = 50 and x = 75: Ø3.2 clearance through the lid flange, Ø2.5 x >= 5 blind pilot
    from the rim into the side boss, axes (50, -4.5), (75, -4.5), (50, 60.5), (75,
    60.5) (mid-depth of the wall+boss band), outside the board and its edge band;
    verified by the region-filtered cylinder counts side_screw_*/side_pilot_* and
    the void/solid probes.'
  parameters:
  - sideScrewXNear
  - sideScrewXFar
  - sideLidHoleDiameter
  - pilotDiameter
  - pilotDepth
  - cornerPostWidth
  - lidThickness
  - headroom
  verify:
  - method: void
    points:
    - - 50.0
      - -4.5
      - 19.05
    - - 75.0
      - -4.5
      - 19.05
    - - 50.0
      - 60.5
      - 19.05
    - - 75.0
      - 60.5
      - 19.05
    note: mid-depth of the four side-boss pilots
  - method: void
    points:
    - - 50.0
      - -4.5
      - 23.6
    - - 75.0
      - -4.5
      - 23.6
    - - 50.0
      - 60.5
      - 23.6
    - - 75.0
      - 60.5
      - 23.6
    note: mid-thickness of the four lid clearance holes
  - method: solid
    points:
    - - 50.0
      - -7.0
      - 10.0
    - - 75.0
      - -7.0
      - 10.0
    - - 50.0
      - 63.0
      - 10.0
    - - 75.0
      - 63.0
      - 10.0
    note: side-boss material at mid-height
  - method: section
    section: lid_section
  optional: false
