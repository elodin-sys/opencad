- id: hdmi1_plug_opening
  kind: cut
  description: Support-free open-top wall notch for hdmi1_plug. Lower and side limits match the source box; opening
    extends upward to the moving rim. Subtract the original plug box from the lid as well so the USB-A apertures
    survive the headroom=15 case.
  parameters:
  - hdmi1X
  - wallThickness
  - headroom
  verify:
  - method: face
