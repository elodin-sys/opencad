schema_version: 1
name: rpi5-enclosure
intent: Design a two-piece FFF-printed enclosure (base and removable lid, two separate solids in one STEP) for a
  Raspberry Pi 5 to the attached requirements document, in the board frame it defines (x along 85, y along 56, PCB
  bottom at z = 0). The board must fit with 0.5 mm edge clearance and 20 mm headroom above the PCB; four standoffs
  meet the PCB bottom at the Ø2.7 mounting holes (3.5,3.5) (61.5,3.5) (3.5,52.5) (61.5,52.5) with Ø2.5 x 5 pilot
  holes; every listed cable-plug envelope (USB-C, 2x micro-HDMI on y = 0; 2x USB-A stacks and RJ45 on x = 85; micro-SD
  under x = 0) passes through its wall opening; the lid closes on the base rim with zero interference and is held
  by four Ø3 through holes into Ø2.5 corner-post pilots; walls and floor >= 2 mm (5th percentile of inward ray casts;
  the Ø6.2 standoff bosses' 1.85 mm annuli are the accepted exception). Declare the base and lid as acceptance solids
  by a contained point, the keep-outs and plug envelopes as acceptance hardware with no-interference clearances,
  the standoff faces and pilot holes as faces and cylinders pinned by interfaces, and the wall minimum as a p05
  thickness check. Headroom, wall thickness and standoff height are top-level parameters; the headroom parameter
  gets a 10-value regeneration sweep (15..35, every value must build) and one infeasible negative value guarded
  by an assert.
units:
  length: mm
  angle: deg
material: null
density_kg_m3: null
process: FFF printing; no supports; overhangs <=45 deg; base prints on its floor exterior and lid inverted on its
  ceiling exterior.
release_status: prototype
frame:
  origin: Intersection of the extended PCB x=0 and y=0 straight edges at the board corner nearest USB-C (lower-left
    in the drawing plan), on the PCB bottom z=0; use the virtual sharp corner, not a rounded outline point.
  axes:
    x: Along the 85 mm board edge from the USB-C-side virtual corner toward the USB-A/RJ45 edge at x=85.
    y: Along the 56 mm board edge from the USB-C/micro-HDMI edge y=0 toward the GPIO-header edge y=56 (upward on
      the plan).
    z: 'Right-handed normal out of the component side: PCB bottom z=0, PCB top z=1.6; bottom-side components have
      negative z.'
  datums:
  - name: A
    description: PCB bottom plane z=0, reproduced by the four annular standoff seats.
  - name: B
    description: Virtual PCB edge plane x=0, the micro-SD side; x mounting columns are 3.5 and 61.5 from this plane.
  - name: C
    description: Virtual PCB edge plane y=0, USB-C/micro-HDMI side; mounting rows are 3.5 and 52.5 from this plane.
  - name: D
    description: Nominal base rim z=21.55 and parallel lid underside z=21.6; both translate with headroom and retain
      their 0.05 mm gap.
envelope:
  min:
  - -8.5
  - -8.5
  - -7.4
  max:
  - 93.5
  - 64.5
  - 25.6
  tolerance: 0.1
parameters:
- name: boardLength
  value: 85
  unit: mm
  provenance: stated
  tolerance: 0.01
  source: 'sources/rpi5-enclosure-requirements.md: Board frame: "85 mm board edge"'
  description: PCB extent along +x.
- name: boardWidth
  value: 56
  unit: mm
  provenance: stated
  tolerance: 0.01
  source: 'sources/rpi5-enclosure-requirements.md: Board frame: "56 mm edge"'
  description: PCB extent along +y.
- name: pcbThickness
  value: 1.6
  unit: mm
  provenance: stated
  tolerance: 0.01
  source: 'sources/rpi5-enclosure-requirements.md: Board frame: "PCB top at z = 1.6"'
  description: PCB top elevation above its bottom datum.
- name: mountX
  value: 3.5
  unit: mm
  provenance: stated
  tolerance: 0.01
  source: 'sources/rpi5-enclosure-requirements.md: Board frame: mounting-hole coordinate list'
  description: Near mounting-hole column x.
- name: mountY
  value: 3.5
  unit: mm
  provenance: stated
  tolerance: 0.01
  source: 'sources/rpi5-enclosure-requirements.md: Board frame: mounting-hole coordinate list'
  description: Near mounting-hole row y.
- name: mountPitchX
  value: 58
  unit: mm
  provenance: stated
  tolerance: 0.01
  source: 'sources/rpi5-enclosure-requirements.md: Board frame: "58 x 49 centres"'
  description: Mounting-hole column separation.
- name: mountPitchY
  value: 49
  unit: mm
  provenance: stated
  tolerance: 0.01
  source: 'sources/rpi5-enclosure-requirements.md: Board frame: "58 x 49 centres"'
  description: Mounting-hole row separation.
- name: boardMountDiameter
  value: 2.7
  unit: mm
  provenance: stated
  tolerance: 0.01
  source: 'sources/rpi5-enclosure-requirements.md: Board frame: "Mounting holes Ø2.7 (M2.5)"'
  description: Board mounting-hole diameter; board is evaluator hardware, not a deliverable solid.
- name: underBoardDepth
  value: 3
  unit: mm
  provenance: stated
  tolerance: 0.01
  source: 'sources/rpi5-enclosure-requirements.md: Board frame: "reach z = -3.0"'
  description: Bottom-component extent below z=0, expressed as a positive depth.
- name: componentFreeRadius
  value: 3.1
  unit: mm
  provenance: stated
  tolerance: 0.01
  source: 'sources/rpi5-enclosure-requirements.md: Board frame: "within 3.1 mm of each hole centre"'
  description: Radius excluded from the bottom-component keep-out around each mounting axis.
- name: edgeClearance
  value: 0.5
  unit: mm
  provenance: stated
  tolerance: 0.01
  source: 'sources/rpi5-enclosure-requirements.md: Enclosure requirement 3: "Leave >= 0.5 mm"'
  description: Minimum PCB-edge clearance; sets the rectangular cavity footprint.
- name: headroom
  value: 20
  unit: mm
  provenance: stated
  tolerance: 0.01
  source: 'sources/rpi5-enclosure-requirements.md: Board frame: "20.0 mm of clear height above the PCB top"; requirement
    9'
  description: Lid underside elevation is pcbThickness + headroom; nominal fit is checked only at 20.
  edit_test:
    delta: 5
    expect:
      volume_delta: 3291.2
      direction: increase
      tolerance_rel: 0.02
      bbox_delta:
      - 0
      - 0
      - 5
    sweep:
      min: 15
      max: 35
      steps: 10
    infeasible_deltas:
    - -21
- name: wallThickness
  value: 2.4
  unit: mm
  provenance: inferred
  tolerance: 0.2
  rationale: 'Q1/Q4: choose 2.4 mm to leave a 0.4 mm modeling/printing margin over the 2.0 mm shell minimum; nozzle
    and polymer are unspecified. Grow outer walls away from the fixed cavity.'
  description: Common floor and straight-wall thickness, greater than the stated 2 mm minimum.
- name: standoffHeight
  value: 5
  unit: mm
  provenance: inferred
  tolerance: 0.5
  rationale: 'Q1: 5 mm permits the required 5 mm blind pilots to end at the floor top, clears components to z=-3
    by 2 mm, and with a 2.4 mm floor contains the mandated base selector at z=-6.'
  description: Height from the interior floor at -standoffHeight to the fixed PCB datum z=0.
  edit_test:
    delta: 1
    expect:
      volume_delta: 1009.402822
      direction: increase
      tolerance_rel: 0.02
      bbox_delta:
      - 0
      - 0
      - 1
- name: standoffDiameter
  value: 6.2
  unit: mm
  provenance: stated
  tolerance: 0.01
  source: 'sources/rpi5-enclosure-requirements.md: Requirement 7: "a boss capped at Ø6.2 around a Ø2.5 pilot leaves
    a 1.85 mm annulus"; user intent specifies Ø6.2 bosses'
  description: Four cylindrical standoff bosses; 1.85 mm radial annulus around each 2.5 mm pilot.
- name: pilotDiameter
  value: 2.5
  unit: mm
  provenance: stated
  tolerance: 0.01
  source: 'sources/rpi5-enclosure-requirements.md: Enclosure requirements 2 and 6: "Ø2.5"'
  description: Diameter of all four standoff pilots and, after ECR-3, of the four side-boss pilots (blind, pilotDepth
    from the rim).
- name: pilotDepth
  value: 5
  unit: mm
  provenance: stated
  tolerance: 0.01
  source: 'sources/rpi5-enclosure-requirements.md: Requirements 2 and 6: ">= 5 mm deep"; user intent specifies "Ø2.5
    x 5"'
  description: Exact nominal blind-pilot depth; satisfies the source lower bound of 5 mm.
- name: lidThickness
  value: 4
  unit: mm
  provenance: inferred
  tolerance: 0.25
  rationale: 'Q1: a 4 mm flat lid places the fixed selector 1 mm below its top and leaves 2 mm above the USB-A relief
    at the minimum headroom of 15 mm.'
  description: Flat lid thickness; nominal z range 21.6..25.6 contains the mandated lid selector at z=24.6.
- name: cornerPostWidth
  value: 8
  unit: mm
  provenance: inferred
  tolerance: 0.5
  rationale: 'Q1: 8 mm square posts leave 2.75 mm to a centered 2.5 mm pilot and 2.5 mm to a 3 mm lid hole. Their
    inner corner is the cavity corner, and their overlap with the main wall is wallThickness squared.'
  description: 'ECR-3: the 8 mm square corner feet remain in the floor plate only (the posts above the floor top
    are removed); the same value is the x-width of the four side bosses and lid flanges and their outer offset from
    the cavity (y = -8.5 and 64.5).'
- name: closureGap
  value: 0.05
  unit: mm
  provenance: inferred
  tolerance: 0.02
  rationale: 'Q2: a 0.05 mm modeled separation keeps two removable solids with no fused or overlapping material,
    within the required maximum closest gap of 0.1 mm.'
  description: 'Nominal axial air gap: base rim is pcbThickness + headroom - closureGap.'
- name: usbCx
  value: 11.2
  unit: mm
  provenance: stated
  tolerance: 0.01
  source: 'sources/rpi5-enclosure-requirements.md: Board frame: connector locations and requirement 4 plug boxes'
  description: USB-C x center on y=0.
- name: hdmi0X
  value: 25.8
  unit: mm
  provenance: stated
  tolerance: 0.01
  source: 'sources/rpi5-enclosure-requirements.md: Board frame: connector locations and requirement 4 plug boxes'
  description: First micro-HDMI x center on y=0.
- name: hdmi1X
  value: 39.2
  unit: mm
  provenance: stated
  tolerance: 0.01
  source: 'sources/rpi5-enclosure-requirements.md: Board frame: connector locations and requirement 4 plug boxes'
  description: Second micro-HDMI x center on y=0.
- name: usbAUpperY
  value: 47
  unit: mm
  provenance: stated
  tolerance: 0.01
  source: 'sources/rpi5-enclosure-requirements.md: Board frame: connector locations and requirement 4 plug boxes'
  description: Upper stacked USB-A pair y center on x=85.
- name: usbALowerY
  value: 29.1
  unit: mm
  provenance: stated
  tolerance: 0.01
  source: 'sources/rpi5-enclosure-requirements.md: Board frame: connector locations and requirement 4 plug boxes'
  description: Lower stacked USB-A pair y center on x=85.
- name: rj45Y
  value: 10.2
  unit: mm
  provenance: stated
  tolerance: 0.01
  source: 'sources/rpi5-enclosure-requirements.md: Board frame: connector locations and requirement 4 plug boxes'
  description: RJ45 y center on x=85.
- name: sdYMin
  value: 22
  unit: mm
  provenance: stated
  tolerance: 0.01
  source: 'sources/rpi5-enclosure-requirements.md: Board frame: connector locations and requirement 4 plug boxes'
  description: Micro-SD access minimum y.
- name: sdYMax
  value: 34
  unit: mm
  provenance: stated
  tolerance: 0.01
  source: 'sources/rpi5-enclosure-requirements.md: Board frame: connector locations and requirement 4 plug boxes'
  description: Micro-SD access maximum y.
- name: sideScrewXNear
  value: 50.0
  unit: mm
  provenance: stated
  tolerance: 0.01
  source: 'designs/rpi5-enclosure/ecr/ecr3/request.md: "two per side at x = 50 and x = 75 (board frame)"'
  description: 'ECR-3: x of the near lid screw on each long side; axis (50, -4.5) and (50, 60.5), mid-depth of the
    8 mm wall+boss band.'
- name: sideScrewXFar
  value: 75.0
  unit: mm
  provenance: stated
  tolerance: 0.01
  source: 'designs/rpi5-enclosure/ecr/ecr3/request.md: "two per side at x = 50 and x = 75 (board frame)"'
  description: 'ECR-3: x of the far lid screw on each long side; axis (75, -4.5) and (75, 60.5).'
- name: sideLidHoleDiameter
  value: 3.2
  unit: mm
  provenance: stated
  tolerance: 0.01
  source: 'designs/rpi5-enclosure/ecr/ecr3/request.md: "a Ø3.2 clearance hole through the lid flange"'
  description: 'ECR-3: the four lid clearance holes on the long sides, coaxial with the side-boss pilots (replaces
    the corner holes and lidHoleDiameter).'
features:
- id: base_shell
  kind: shell
  description: 'Rectangular cavity [-0.5,85.5] x [-0.5,56.5], straight 2.4 mm walls and 2.4 mm floor. ECR-3: the
    square corner posts exist only as 8 x 8 feet in the floor plate (z <= -standoffHeight); four side bosses 8 wide
    in x, centred on x = 50 and x = 75, fill y = -8.5..-2.9 and y = 58.9..64.5 from the floor exterior to the rim.
    Floor top is -standoffHeight; footprint O is defined in brief section 5.'
  parameters:
  - boardLength
  - boardWidth
  - edgeClearance
  - wallThickness
  - standoffHeight
  - headroom
  - pcbThickness
  - cornerPostWidth
  - closureGap
  verify:
  - method: bbox
  - method: section
    section: floor_section
  - method: section
    section: pcb_level_section
  - method: face
    face: floor_exterior
  - method: face
    face: floor_interior
  - method: dimension
    dimension: floor_thickness
- id: board_keepouts
  kind: cavity
  description: All PCB, lower-component and top-component hardware envelopes clear the enclosure; the expanded edge
    envelope guarantees 0.5 mm lateral clearance.
  parameters:
  - boardLength
  - boardWidth
  - pcbThickness
  - underBoardDepth
  - componentFreeRadius
  - edgeClearance
  - headroom
  verify:
  - method: section
    section: pcb_level_section
  - method: void
    points:
    - - 42.5
      - 28
      - 0.8
    - - 42.5
      - 28
      - -1.5
    - - 42.5
      - 28
      - 10
- id: standoff_bosses
  kind: boss
  count: 4
  description: Four 6.2 mm bosses anchored in the floor and ending at z=0; exactly inside the component-free rings.
  parameters:
  - mountX
  - mountY
  - mountPitchX
  - mountPitchY
  - standoffDiameter
  - standoffHeight
  verify:
  - method: cylinder
    cylinder: standoff_1_boss
  - method: cylinder
    cylinder: standoff_2_boss
  - method: cylinder
    cylinder: standoff_3_boss
  - method: cylinder
    cylinder: standoff_4_boss
  - method: section
    section: standoff_section
  - method: count
    section: standoff_section
    count: 5
    note: Five material regions = shell + four annular bosses; section.holes=4.
- id: pcb_seats_and_pilots
  kind: hole
  count: 4
  description: Four separately named annular PCB seats at z=0, with fixed mounting axes and 2.5 x 5 blind pilots.
    Do not model the 2.7 mm PCB holes as extra enclosure holes.
  parameters:
  - mountX
  - mountY
  - mountPitchX
  - mountPitchY
  - boardMountDiameter
  - standoffDiameter
  - pilotDiameter
  - pilotDepth
  verify:
  - method: face
    face: standoff_1_seat
  - method: cylinder
    cylinder: standoff_1_pilot
  - method: dimension
    dimension: standoff_1_pilot_depth
  - method: face
    face: standoff_2_seat
  - method: cylinder
    cylinder: standoff_2_pilot
  - method: dimension
    dimension: standoff_2_pilot_depth
  - method: face
    face: standoff_3_seat
  - method: cylinder
    cylinder: standoff_3_pilot
  - method: dimension
    dimension: standoff_3_pilot_depth
  - method: face
    face: standoff_4_seat
  - method: cylinder
    cylinder: standoff_4_pilot
  - method: dimension
    dimension: standoff_4_pilot_depth
- id: lid
  kind: extrude
  description: Separate flat 4 mm plate over the wall footprint [-2.9,87.9] x [-2.9,58.9] plus the four side flanges
    over the bosses (no corner lugs), below face at pcbThickness+headroom, four Ø3.2 through holes on the axes (50,
    -4.5), (75, -4.5), (50, 60.5), (75, 60.5). Apply source plug cutters to the lid at every headroom; they are
    inactive at nominal 20 and form USB-A edge reliefs at 15.
  parameters:
  - headroom
  - pcbThickness
  - lidThickness
  - cornerPostWidth
  - sideScrewXNear
  - sideScrewXFar
  - sideLidHoleDiameter
  verify:
  - method: section
    section: lid_section
  - method: face
    face: lid_underside
  - method: face
    face: lid_exterior
  - method: dimension
    dimension: lid_thickness
  - method: solid
    points:
    - - 42.5
      - 28
      - 24.6
- id: removable_closure
  kind: other
  description: Two separate solids; base rim and lid underside separated by closureGap=0.05 mm; independent clearance
    check caps closest gap at 0.1 mm and forbids interference.
  parameters:
  - headroom
  - closureGap
  verify:
  - method: face
    face: base_rim
  - method: face
    face: lid_underside
  - method: dimension
    dimension: rim_lid_gap
- id: fff_print_orientation
  kind: other
  description: 'Support-free construction: base extrusions and open-to-rim notches have vertical sides; print on
    the floor exterior. Lid prints upside down on the flat exterior. No bridges or overhang roofs on the base. Shell
    p05 must be >=2 mm; the 1.85 mm boss annuli are the explicit exception.'
  parameters:
  - wallThickness
  - lidThickness
  verify:
  - method: face
    face: floor_exterior
  - method: face
    face: lid_exterior
  - method: section
    section: all_ports_section
- id: usb_c_plug_opening
  kind: cut
  description: Support-free open-top wall notch for usb_c_plug. Lower and side limits match the source box; opening
    extends upward to the moving rim. Subtract the original plug box from the lid as well so the USB-A apertures
    survive the headroom=15 case.
  parameters:
  - usbCx
  - wallThickness
  - headroom
  verify:
  - method: face
    face: usb_c_plug_sill
  - method: dimension
    dimension: usb_c_plug_width
  - method: void
    points:
    - &id001
      - 11.2
      - -1.7
      - 5.1
- id: hdmi0_plug_opening
  kind: cut
  description: Support-free open-top wall notch for hdmi0_plug. Lower and side limits match the source box; opening
    extends upward to the moving rim. Subtract the original plug box from the lid as well so the USB-A apertures
    survive the headroom=15 case.
  parameters:
  - hdmi0X
  - wallThickness
  - headroom
  verify:
  - method: face
    face: hdmi0_plug_sill
  - method: dimension
