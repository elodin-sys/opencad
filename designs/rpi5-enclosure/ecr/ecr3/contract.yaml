open_questions:
- 'Q1: Are the inferred 2.4 mm walls/floor, 5 mm standoff height, 4 mm lid, and 8 mm square external corner posts
  acceptable? They select a concrete 102 x 73 x 33 mm enclosure; no external size or corner-post coordinates are
  specified by the sources.'
- 'Q2: Are open-top cable notches, closed above by the removable lid, and a nominal 0.05 mm rim gap acceptable?
  The sources specify plug clearance and a maximum closure gap, but do not specify closed-window styling, a locating
  lip, sealing, or ingress protection.'
- 'Q3: What cable-plug and board manufacturing allowances should be added after physical fit inspection? The supplied
  drawing explicitly calls its dimensions approximate; the contract preserves the supplied plug boxes and adds no
  unrequested plug margin.'
- 'Q4: Which FFF polymer, nozzle/layer settings, screw specification and screw lengths will be used? Material/density
  and printer compensation are unspecified; the required 2.5 mm pilots, 3 mm lid holes and support-free geometry
  still need print and assembly confirmation.'
