- id: side_fasteners
  kind: hole
  count: 4
  description: 'Four lid screws on the long sides (y = 0 side and y = 56 side) at x = 50 and x = 75: Ø3.2 clearance
    through the lid flange, Ø2.5 x >= 5 blind pilot from the rim into the side boss, axes (50, -4.5), (75, -4.5),
    (50, 60.5), (75, 60.5) (mid-depth of the wall+boss band), outside the board and its edge band; verified by the
    region-filtered cylinder counts side_screw_*/side_pilot_* and the void/solid probes.'
