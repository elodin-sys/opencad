- id: usb_a_upper_plug_opening
  kind: cut
  description: Support-free open-top wall notch for usb_a_upper_plug. Lower and side limits match the source box;
    opening extends upward to the moving rim. Subtract the original plug box from the lid as well so the USB-A apertures
    survive the headroom=15 case.
  parameters:
  - usbAUpperY
  - wallThickness
  - headroom
  verify:
  - method: face
    face: usb_a_upper_plug_sill
  - method: dimension
    dimension: usb_a_upper_plug_width
  - method: void
    points:
    - &id004
      - 86.7
      - 47.0
      - 10.100000000000001
- id: usb_a_lower_plug_opening
  kind: cut
  description: Support-free open-top wall notch for usb_a_lower_plug. Lower and side limits match the source box;
    opening extends upward to the moving rim. Subtract the original plug box from the lid as well so the USB-A apertures
    survive the headroom=15 case.
  parameters:
  - usbALowerY
  - wallThickness
  - headroom
  verify:
  - method: face
    face: usb_a_lower_plug_sill
  - method: dimension
    dimension: usb_a_lower_plug_width
  - method: void
