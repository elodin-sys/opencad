  kind: cut
  description: Support-free open-top wall notch for usb_a_upper_plug. Lower and side limits match the source box;
    opening extends upward to the moving rim. Subtract the original plug box from the lid as well so the USB-A apertures
    survive the headroom=15 case.
  parameters:
