interfaces:
- name: pcb_mount_1
  description: Keep mounting axis (3.5, 3.5), seat z=0, and the 2.5 x 5 blind pilot fixed across headroom and standoff-height
    edits. Pilot engagement is pinned by the individual cylinder length and axial range; separate face-to-face depth
    dimensions are nominal acceptance checks.
  checks:
  - standoff_1_seat
  - standoff_1_pilot
- name: pcb_mount_2
  description: Keep mounting axis (61.5, 3.5), seat z=0, and the 2.5 x 5 blind pilot fixed across headroom and standoff-height
    edits. Pilot engagement is pinned by the individual cylinder length and axial range; separate face-to-face depth
    dimensions are nominal acceptance checks.
  checks:
  - standoff_2_seat
  - standoff_2_pilot
- name: pcb_mount_3
  description: Keep mounting axis (3.5, 52.5), seat z=0, and the 2.5 x 5 blind pilot fixed across headroom and standoff-height
    edits. Pilot engagement is pinned by the individual cylinder length and axial range; separate face-to-face depth
    dimensions are nominal acceptance checks.
  checks:
  - standoff_3_seat
  - standoff_3_pilot
- name: pcb_mount_4
  description: Keep mounting axis (61.5, 52.5), seat z=0, and the 2.5 x 5 blind pilot fixed across headroom and
    standoff-height edits. Pilot engagement is pinned by the individual cylinder length and axial range; separate
    face-to-face depth dimensions are nominal acceptance checks.
  checks:
  - standoff_4_seat
  - standoff_4_pilot
- name: lid_fastener_1
  description: Coaxial lid clearance and corner-post pilot at (-4.5, -4.5), outside PCB; diameter and depth fixed,
    axial translation with headroom allowed. Individual cylinder lengths pin pilot depth and lid through length;
    dimensions referencing the moving absolute rim plane are nominal checks only.
  checks:
  - corner_1_pilot
  - corner_1_lid_hole
- name: lid_fastener_2
  description: Coaxial lid clearance and corner-post pilot at (89.5, -4.5), outside PCB; diameter and depth fixed,
    axial translation with headroom allowed. Individual cylinder lengths pin pilot depth and lid through length;
    dimensions referencing the moving absolute rim plane are nominal checks only.
  checks:
  - corner_2_pilot
  - corner_2_lid_hole
- name: lid_fastener_3
  description: Coaxial lid clearance and corner-post pilot at (-4.5, 60.5), outside PCB; diameter and depth fixed,
    axial translation with headroom allowed. Individual cylinder lengths pin pilot depth and lid through length;
    dimensions referencing the moving absolute rim plane are nominal checks only.
  checks:
  - corner_3_pilot
  - corner_3_lid_hole
- name: lid_fastener_4
  description: Coaxial lid clearance and corner-post pilot at (89.5, 60.5), outside PCB; diameter and depth fixed,
    axial translation with headroom allowed. Individual cylinder lengths pin pilot depth and lid through length;
    dimensions referencing the moving absolute rim plane are nominal checks only.
  checks:
  - corner_4_pilot
