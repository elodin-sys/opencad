open_questions:
- Q1. The task summary says 34 cylindrical features, but the supplied table enumerates 35 (12 holes and 23 pins/bosses).
  Is 34 a counting error? This contract requires all 35 located cylinders.
- 'Q2. The prose mentions lateral bosses, a hexagon and a lens; A-A, the inclined-plane table and z=-5 outline instead
  support eight blind cavities: two circles, two squares, two diamonds and two straight-edged rhombi. Are the alternative
  terms descriptive only? These eight cavities reproduce the supplied volume, area and COM; no extra unsupported
  boss or curved lens is added.'
- Q3. The small lateral diamond has no explicit diagonal or depth callout. Are its 3 mm diagonals and 3 mm depth
  nominal? They are measured from A-A and the section, use ±0.3 mm parameter tolerances, and agree with the aggregate
  table properties.
- 'Q4. Exact-face sections disagree: at z=1 the table gives 1138 mm2/35 loops but the image gives 1124.79/34; at
  z=5 they give 599.24/19 versus 498.76/18; at z=-5 they give 9502.23/2 versus 9402.44/1. Confirm the intended coplanar-section
  convention if those exact stations are needed. Acceptance uses non-coplanar z=0.5,1.5,3.5,4.5,5.5,6.5,-5.5 instead.'
- Q5. Numeric GD&T values, material, density, manufacturing process, surface finish and edge-break requirements
  are not supplied. What values apply for fabrication? The drawing xx boxes remain unspecified; this contract uses
  digital reconstruction tolerances and makes no mass or manufacturability claim.
