# Native reconstruction intent and independent geometric acceptance; units mm and deg.
schema_version: 1
name: nist-am-test-artifact
intent: 'Reconstruct the NIST Additive Manufacturing Test Artifact (Moylan et al. 2014, Fig. 8) as editable, parameterized
  KCL from the attached drawing, paper excerpts, renders, section drawings and dimension sheet. Frame: origin at
  the centre of the top surface, z = 0 on the top surface with +z toward the pin tips (the base extends to z = -10,
  features to z = +7), the Ø10 centre hole on the z axis, +x toward the Ø4 hole at x = +60; the four rows of Ø4
  pins (20, 30, 40, 50) and the four Ø4 holes (60) lie on the +-x and +-y axes; the diamond base is a 100 mm square
  rotated 45 deg (corners on the axes at 70.71). Model every feature at its stated size and position: centre hole
  and two concentric central cylinders, 16 pins and 4 holes, both L-shaped staircases with 1 mm steps and 10 mm
  treads, the 1-in-25 ramp with 2.5 mm landings, the lateral cavities and bosses on one side, the five fine pins
  and five fine holes (Ø2 to Ø0.25, 2 mm tall/deep) and the fine rectangular bosses and slots. Small features are
  scored individually: a correct base cannot compensate for a missing pin. One solid; export STEP and STL. The reference
  CAD is evaluator-only; the deliverable must be construction, never an import.'
units:
  length: mm
  angle: deg
material: null
density_kg_m3: null
process: null
release_status: reconstruction
frame:
  origin: Intersection of the Ø10 centre-hole axis with datum A, the original flat top surface of the diamond base.
    This point is [0,0,0], even though the hole removes material there.
  axes:
    x: In datum A, from the centre-hole axis toward the right-hand Ø4 through hole at [60,0,0] in top.png.
    y: In datum A, toward the Ø4 through hole at [0,60,0], upward in top.png; x cross y gives +z.
    z: Normal to datum A toward the pin tips; top surface z=0, base bottom z=-10, tallest original features z=7.
  datums:
  - name: A
    description: Primary unraised top surface of the base, z=0, outward normal +z.
  - name: B
    description: 'Secondary Ø10 centre bore: its z axis fixes x=y=0. This functional datum follows the published
      prose, independently of drawing letter placement.'
  - name: C
    description: Tertiary Ø4 through-hole axis at x=+60,y=0; direction from B toward C fixes +x.
  - name: stairPlanes
    description: Positive staircase near edges x=-12,y=+12; negative staircase near edges x=-12,y=-12. Named acceptance
      faces specify the remaining levels.
  - name: diagonalCoordinates
    description: u=(x+y)/sqrt(2), v=(x-y)/sqrt(2). NE side u=+50; NW lateral side v=-50. Ramp uses r=v with u=0.
      Lateral profiles use t=u and inward depth along increasing q=v; their centres have z=-5. These are scalar
      coordinate definitions, not a second right-handed frame.
envelope:
  min:
  - -70.71067811865474
  - -70.71067811865474
  - -10
  max:
  - 70.71067811865474
  - 70.71067811865474
  - 7
  tolerance: 0.03
parameters:
- name: baseSide
  value: 100
  unit: mm
  provenance: stated
  tolerance: 0.01
  description: Edge length before rotating about z.
  source: 'sources/nist-am-artifact-description.md; datum frame: "100 mm square"'
- name: baseRotation
  value: 45
  unit: deg
  provenance: stated
  tolerance: 0.02
  description: Diamond rotation; all diagonal directions use this angle.
  source: 'sources/nist-am-artifact-description.md; datum frame: "rotated 45 deg about z"'
- name: baseThickness
  value: 10
  unit: mm
  provenance: stated
  tolerance: 0.01
  description: Top is fixed at z=0; edit moves the bottom and extends only through holes.
  source: 'sources/nist-am-artifact-description.md §7.1; sources/drawing-01.png B-B: 10'
  edit_test:
    delta: 1
    expect:
      volume_delta: 9871.194701202818
      direction: increase
      tolerance_rel: 0.005
      bbox_delta:
      - 0
      - 0
      - 1
- name: baseHalfDiagonal
  value: 70.71067811865474
  unit: mm
  provenance: derived
  tolerance: 0.02
  description: Corner distance along each global axis.
  formula: baseSide / sqrt(2)
- name: mainPinDiameter
