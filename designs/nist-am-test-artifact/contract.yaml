features:
- id: diamondBase
  kind: extrude
  description: 100 mm square rotated 45 degrees, top at z=0, bottom z=-10; one final connected solid. Construct
    native geometry and export STEP and STL.
  parameters:
  - baseSide
  - baseRotation
  - baseThickness
  - baseHalfDiagonal
  count: 1
  verify:
  - method: face
    face: datumTop
  - method: face
    face: baseBottom
  - method: dimension
    dimension: spanX
  - method: dimension
    dimension: spanY
  - method: dimension
    dimension: totalHeight
  - method: dimension
    dimension: baseThicknessCheck
  - method: solid
    points:
    - - 0
      - 15
      - -9
    - - 10
      - -40
      - -8
    - - -50
      - -5
      - -5
    note: ''
  - method: bbox
  optional: false
- id: sideSouthWest
  kind: wall
  description: Named diamond side; NW carries the eight lateral openings.
  parameters:
  - baseSide
  - baseThickness
  - baseRotation
  count: 1
  verify:
  - method: plane
    plane: sideSouthWest
  optional: false
- id: sideSouthEast
  kind: wall
