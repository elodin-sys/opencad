schema_version: 1
name: gear-pair
intent: 'Design the spur-gear pair and carrier plate exactly as specified in the attached specification: module
  2, pressure angle 20 deg, zero profile shift, 20-tooth pinion (bore Ø6) at the origin and 40-tooth wheel (bore
  Ø8) at (60, 0), face width 8 (z 0..8), 0.10 mm total circular backlash, pinion tooth centred on +x and the wheel
  phased half a pitch so the pair meshes; carrier 110 x 50 x 5 under the gears with clearance holes on the axes.
  Three separate solids in one KCL file; the pair must turn through a full pitch without interference. Declare
  the three solids by contained points, the bores as cylinders, and the gears'' tooth counts and mesh as acceptance
  items.'
units:
  length: mm
  angle: deg
material: null
density_kg_m3: null
process: null
release_status: reconstruction
frame:
  origin: 'Intersection of the pinion axis and the common carrier-top / gear-bottom plane: (0,0,0).'
  axes:
    x: +x follows the line of centers from the pinion axis (0,0) toward the wheel axis (60,0).
    y: +y is perpendicular to +x in the carrier top plane, chosen so x cross y = +z; viewed from +z with +x to
      the right, +y is up.
    z: +z is upward along both gear axes, from the carrier into the gears; carrier occupies z=-5..0 and gears
      z=0..8.
  datums:
  - name: A
    description: Carrier top at z=0, coincident with both separate gear bottom faces; establishes axial seating.
  - name: B
    description: Pinion bore and its coaxial carrier-hole axis x=y=0, directed along +z; establishes the origin
      on A.
  - name: C
    description: Plane y=0 through both gear axes, with +x directed from datum B to the wheel; sets clocking.
      Pinion tooth center is +x, wheel tooth centers begin at +4.5 deg.
envelope:
  min:
  - -25
  - -41.921745526
  - -5
  max:
  - 101.921745526
  - 41.921745526
  - 8
  tolerance: 0.05
parameters:
- name: gearModule
  value: 2
  unit: mm
  provenance: stated
  tolerance: 0.01
  source: 'sources/gear-pair-spec.md — table Module: "2 mm"'
  description: Common transverse module of both spur gears.
- name: pressureAngle
  value: 20
  unit: deg
  provenance: stated
  tolerance: 0.01
  source: 'sources/gear-pair-spec.md — table Pressure angle: "20 deg"'
  description: Common involute pressure angle at the pitch circles.
- name: profileShift
  value: 0
  unit: ''
  provenance: stated
  tolerance: 1.0e-06
  source: 'sources/gear-pair-spec.md — table Profile shift: "0 (both gears)"'
  description: Common dimensionless profile-shift coefficient.
- name: pinionTeeth
  value: 20
  unit: ''
  provenance: stated
  tolerance: 1.0e-06
  source: 'sources/gear-pair-spec.md — table Pinion: "20 teeth, bore Ø6, axis at (0, 0) parallel to z"'
  description: Integer pinion tooth count.
- name: wheelTeeth
  value: 40
  unit: ''
  provenance: stated
  tolerance: 1.0e-06
  source: 'sources/gear-pair-spec.md — table Wheel: "40 teeth, bore Ø8, axis at (60, 0) parallel to z"'
  description: Integer wheel tooth count.
- name: pinionBoreDiameter
  value: 6
  unit: mm
  provenance: stated
  tolerance: 0.01
  source: 'sources/gear-pair-spec.md — table Pinion: "bore Ø6"; Carrier plate: "with Ø6 and Ø8 clearance holes
    on the two gear axes"'
  description: Shared diameter of pinion bore and its carrier hole; no extra fit allowance.
- name: wheelBoreDiameter
  value: 8
  unit: mm
  provenance: stated
  tolerance: 0.01
  source: 'sources/gear-pair-spec.md — table Wheel: "bore Ø8"; Carrier plate: "with Ø6 and Ø8 clearance holes
    on the two gear axes"'
  description: Shared diameter of wheel bore and its carrier hole; no extra fit allowance.
- name: centerDistance
  value: 60
  unit: mm
  provenance: stated
  tolerance: 0.01
  source: 'sources/gear-pair-spec.md — table Centre distance: "60 mm (= (20 + 40) x 2 / 2)"'
  description: Wheel x coordinate is pinionAxisX + centerDistance; nominal pitch radii sum to 60.
- name: gearFaceWidth
  value: 8
  unit: mm
  provenance: stated
  tolerance: 0.01
  source: 'sources/gear-pair-spec.md — table Face width: "8 mm, both gears from z = 0 to z = 8"'
  description: Both gears extrude upward from gearBaseZ; keep lower datum and carrier fixed.
  edit_test:
    delta: 2
    expect:
      volume_delta: 12233.933119816
      direction: increase
      tolerance_rel: 0.02
      bbox_delta:
      - 0
      - 0
      - 2
    sweep:
      values:
      - 6
      - 8
      - 10
    infeasible_deltas:
    - -8
- name: addendumFactor
  value: 1
  unit: ''
  provenance: stated
  tolerance: 1.0e-06
  source: 'sources/gear-pair-spec.md — table Addendum / dedendum: "1.0 m / 1.25 m"'
  description: Tip radius is pitch radius + gearModule*(addendumFactor + profileShift).
- name: dedendumFactor
  value: 1.25
  unit: ''
  provenance: stated
  tolerance: 1.0e-06
  source: 'sources/gear-pair-spec.md — table Addendum / dedendum: "1.0 m / 1.25 m"'
  description: Root radius is pitch radius - gearModule*(dedendumFactor - profileShift).
- name: totalBacklash
  value: 0.1
  unit: mm
  provenance: stated
  tolerance: 0.001
  source: 'sources/gear-pair-spec.md — table Circular backlash: "0.10 mm total: thin each tooth by 0.05 mm at
    its pitch circle"'
  description: 'Split equally: each gear tooth loses totalBacklash/2 of circular pitch thickness.'
  edit_test:
    delta: 0.05
    expect:
      volume_delta: -53.55
      direction: decrease
      tolerance_rel: 0.02
      bbox_delta:
      - -0.00080288
      - -0.00160576
      - 0
    sweep:
      values:
      - 0.08
      - 0.1
      - 0.15
    infeasible_deltas:
    - 6.5
- name: pinionPhase
  value: 0
  unit: deg
  provenance: stated
  tolerance: 0.01
  source: 'sources/gear-pair-spec.md — table Tooth phase: "pinion has a tooth centred on +x"'
  description: Tooth-center angle measured counterclockwise from +x, viewed from +z.
- name: pinionAxisX
  value: 0
  unit: mm
  provenance: stated
  tolerance: 0.01
  source: 'sources/gear-pair-spec.md — table Pinion: "axis at (0, 0) parallel to z"'
