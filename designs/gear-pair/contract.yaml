interfaces:
- name: carrierSeatingDatum
  description: Carrier seating plane and plan dimensions remain fixed when gear face width or backlash changes.
  must_not_change: true
  checks:
  - carrierTop
  - carrierLength
  - carrierWidth
- name: pinionAxisAndSeat
  description: Pinion alignment is pinned by the Ø6 carrier cylinder axis and pinion bottom-face centroid at (0,0);
    axial gear length may follow gearFaceWidth.
  must_not_change: true
  checks:
  - carrierPinionHole
  - pinionBottom
- name: wheelAxisAndSeat
  description: Wheel alignment is pinned by the Ø8 carrier cylinder axis and wheel bottom-face centroid at (60,0);
    axial gear length may follow gearFaceWidth.
  must_not_change: true
  checks:
  - carrierWheelHole
  - wheelBottom
- name: gearSectionTopology
  description: At z=4 the assembly retains two gear regions and two bores through the declared face-width and
    backlash sweeps; small analytic area changes remain inside the section band.
  must_not_change: true
  checks:
  - gearMidsection
acceptance:
  bbox_tolerance: 0.05
  volume:
    expected: 76043.033397564
    tolerance_rel: 0.01
    provenance: derived
    note: Analytic radial-root construction estimate, not a reference-model measurement. For each gear, Rp=m*N/2,
      Rb=Rp*cos(alpha), Ra=Rp+m, Rf=Rp-1.25*m, h0=(pi*m/2-totalBacklash/2)/(2*Rp)+tan(alpha)-alpha, T=sqrt((Ra/Rb)^2-1),
      F(T)=T^3/3-((1+T^2)*atan(T)-T)/2, A=pi*Rf^2+N*(h0*(Ra^2-Rf^2)-2*Rb^2*F(T))-pi*D^2/4. Angles in these formulas
      are radians. Sharp radial root-to-base extensions and circular tip/root arcs provide the provisional estimate;
      the unspecified root transition is recorded in open_questions. Total V=gearFaceWidth*(A_pinion+A_wheel)+carrierThickness*(carrierLength*carrierWidth-pi*(pinionBoreDiameter^2+wheelBoreDiameter^2)/4).
  surface_area:
    expected: 31468.596211209
    tolerance_rel: 0.03
    provenance: derived
    note: Analytic radial-root construction estimate, not a reference-model measurement. For each gear, Rp=m*N/2,
      Rb=Rp*cos(alpha), Ra=Rp+m, Rf=Rp-1.25*m, h0=(pi*m/2-totalBacklash/2)/(2*Rp)+tan(alpha)-alpha, T=sqrt((Ra/Rb)^2-1),
      F(T)=T^3/3-((1+T^2)*atan(T)-T)/2, A=pi*Rf^2+N*(h0*(Ra^2-Rf^2)-2*Rb^2*F(T))-pi*D^2/4. Angles in these formulas
      are radians. Sharp radial root-to-base extensions and circular tip/root arcs provide the provisional estimate;
      the unspecified root transition is recorded in open_questions. Gear outer perimeter P=N*(2*(Rb-Rf)+Rb*T^2+2*Ra*(h0-T+atan(T))+Rf*(2*pi/N-2*h0)).
      Gear surface=2*A+gearFaceWidth*(P+pi*D). Carrier surface=2*A_carrier+carrierThickness*(2*(carrierLength+carrierWidth)+pi*(pinionBoreDiameter+wheelBoreDiameter)).
      Sum all three bodies; touching faces are counted once per body, not removed as if fused.
  center_of_mass:
    expected:
    - 41.729506395
    - 0
    - 1.682924417
    tolerance: 0.15
    provenance: derived
    note: Geometric centroid with uniform unit density, not a material/mass claim. Vp=9547.100925818, Vw=39388.631553445,
      Vc=27107.300918301 mm3 using the radial-root estimate above. Carrier xc=(110*50*30-pi*3^2*0-pi*4^2*60)/(110*50-pi*(3^2+4^2))=29.878310559
      mm. COM=((Vp*0+Vw*60+Vc*xc)/(Vp+Vw+Vc),0,((Vp+Vw)*4+Vc*(-2.5))/(Vp+Vw+Vc)).
  solid_count: 3
  sections:
