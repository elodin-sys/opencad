      area: 6116.966559908
      area_tolerance_rel: 0.02
      loops: 2
      holes: 2
    description: Two disjoint annular toothed regions; each has one central bore. Area uses the analytic radial-root
      estimate. Tooth counts are checked separately in acceptance.gears; loops do not count teeth.
  - id: carrierMidsection
    plane: z
    at: -2.5
    expect:
      area: 5421.46018366
      area_tolerance_rel: 0.002
      loops: 1
      holes: 2
    description: One rectangular plate region with two through-hole loops; area=110*50-pi*(3^2+4^2).
