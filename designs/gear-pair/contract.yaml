open_questions:
- 'Which below-base-circle root transition is intended: radial extension, generated trochoid, or a specified fillet?
  The root radii are stated, but the transition is not; gear volume, area, and surface estimates provisionally
  use sharp radial extensions, with no invented fillet radius.'
- What material, density, manufacturing process, and production fit tolerances are intended? These are unspecified;
  material, density_kg_m3, and process remain null, and the stated Ø6/Ø8 carrier holes receive no added clearance
  allowance.
- How will the evaluator-only involute p95 <= 0.10 mm requirement be reported? No reference geometry is supplied
  and PartContract has no reference-free per-gear profile-deviation field; analytic probes cannot establish that
  percentile, so acceptance.deviation remains null.
- What evidence will certify zero interference between the sampled sweep poses? The required continuous full-pitch
  motion is retained, but the available inspector uses discrete poses with local refinement and a fixed 0.001
  mm3 Boolean tolerance.
