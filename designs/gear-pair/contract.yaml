- name: wheelAxisY
  value: 0
  unit: mm
  provenance: stated
  tolerance: 0.01
  source: 'sources/gear-pair-spec.md — table Wheel: "axis at (60, 0) parallel to z"'
  description: Wheel shaft axis y position in the stated source frame.
- name: gearBaseZ
  value: 0
  unit: mm
  provenance: stated
  tolerance: 0.01
  source: 'sources/gear-pair-spec.md — table Face width: "from z = 0 to z = 8"; Frame: "gear bottoms at z = 0,
    carrier top at z = 0"'
  description: Shared carrier-top / gear-bottom datum; carrier extends downward.
- name: carrierLength
  value: 110
  unit: mm
  provenance: stated
  tolerance: 0.01
  source: 'sources/gear-pair-spec.md — table Carrier plate: "110 x 50 x 5 mm"'
  description: Plate extent along +x from carrierMinX.
- name: carrierWidth
  value: 50
  unit: mm
  provenance: stated
  tolerance: 0.01
  source: 'sources/gear-pair-spec.md — table Carrier plate: "110 x 50 x 5 mm"'
  description: Plate extent along +y from carrierMinY.
- name: carrierThickness
  value: 5
  unit: mm
  provenance: stated
  tolerance: 0.01
  source: 'sources/gear-pair-spec.md — table Carrier plate: "110 x 50 x 5 mm"'
  description: Plate thickness below gearBaseZ.
- name: carrierMinX
  value: -25
  unit: mm
  provenance: stated
  tolerance: 0.01
  source: 'sources/gear-pair-spec.md — table Carrier plate: "corner at (-25, -25, -5) to (85, 25, 0)"'
  description: Plate minimum x; wheel intentionally overhangs the plate.
- name: carrierMinY
  value: -25
  unit: mm
  provenance: stated
  tolerance: 0.01
  source: 'sources/gear-pair-spec.md — table Carrier plate: "corner at (-25, -25, -5) to (85, 25, 0)"'
  description: Plate minimum y.
- name: wheelPhase
  value: 4.5
  unit: deg
  provenance: derived
  tolerance: 0.01
  formula: 180 / wheelTeeth
  description: Half a wheel pitch from a tooth center on +x; 180/wheelTeeth deg equals pi/wheelTeeth rad. With
    40 teeth, a tooth space is centered on -x toward the pinion.
