schema_version: 1
name: prusa-mini-extruder-front
intent: 'Reconstruct the Original Prusa MINI extruder front housing (MINI-extruder-front) as editable, parameterized
  KCL from the attached renders, section drawings and dimension sheet. Frame: x across the plate (-26.5 to 26.5),
  y through the thickness with the back mating face at y = 0 and the front face at y = 14, z vertical from the
  bottom face z = -30 to the top lug at z = 33.72. Assembly-governing geometry must be exact: the keyhole central
  opening (Ø22.5 x 3 recess, Ø16 bore, Ø26 x 6 counterbore on the axis x = -2, z = 0; Ø12 x 3 recess, Ø16 bore
  and Ø14 counterbore on x = -2, z = 16.4), every Ø3.4 through hole with its Ø6.5 / Ø3.5 counterbore or heat-set
  trap, the Ø4 filament holes, the hotend clamp channel bores along z at x ~ 25.6, and the mating planes (y =
  0, y = 14, z = -30, x = -26.5). Declare each hole as an acceptance cylinder and the mating planes as interfaces
  with checks. The fan-duct lobe, top-lug fillet and embossed text are cosmetic (optional features). One solid;
  export STEP and STL. The reference CAD is evaluator-only; the deliverable must be construction, never an import.'
units:
  length: mm
  angle: deg
material: null
density_kg_m3: null
process: 3D printing; material and print settings unspecified
release_status: reconstruction
frame:
  origin: The point [0,0,0] is on the y=0 mating plane, halfway between the x envelope limits and 30 mm above
    the z=-30 bottom plane. It lies in the central opening, not necessarily in material. The lower opening axis
    meets y=0 at [-2,0,0].
  axes:
    x: Across the plate toward the half-clamp; left locating side x=-26.5, right envelope x=26.5. front.png plots
      +x right; back.png plots -x right.
    y: Through thickness from the back mating datum y=0 to front datum y=14. Screw and keyhole axes run parallel
      to +y. Camera filenames do not rename these datums.
    z: Upward from bottom z=-30 to highest lug/web z=33.72; main top ledge z=28.
  datums:
  - name: A
    description: Back mating plane y=0, outward [0,-1,0].
  - name: B
    description: Front plane y=14, outward [0,1,0], 14 mm from A.
  - name: C
    description: Bottom plane z=-30, outward [0,0,-1].
  - name: D
    description: Left locating plane x=-26.5, outward [-1,0,0].
envelope:
  min: [-26.5, 0, -30]
  max: [26.5, 14, 33.72]
  tolerance: 0.03
parameters:
- name: plateWidth
  value: 53
  unit: mm
  provenance: stated
  tolerance: 0.02
  description: Overall x span.
  source: sources/prusa-extruder-front-description.md; '53 x 14 x 63.72 mm'
- name: plateThickness
  value: 14
  unit: mm
  provenance: stated
  tolerance: 0.02
  description: Nominal separation of y=0 and y=14; do not replace with bbox artifact 14.001.
  source: sources/prusa-extruder-front-description.md; 'front face at y = 14'
