open_questions: ['Q1 — Keyhole conflict: prose places Ø26 at z=0 and Ø14 at z=16.4 and implies a lower Ø16 cylinder;
    the dimension table and sections reverse those counterbores and show a lower taper. Which is intended? Draft
    checks provisionally follow the table and sections; intent is preserved verbatim.', 'Q2 — View naming: front.png
    shows the y=0 hex-pocket/marking side, although the frame calls y=14 the front. Are these camera labels only?
    This draft uses numerical coordinates and the requested datum definitions.', 'Q3 — Topology: the table gives
    three outer loops at x=-18.5, while the section drawing says two regions. Which is authoritative? Draft acceptance
    uses the table''s 662.84 mm2 and three loops; the drawing says 662.94 mm2 and two regions.', 'Q4 — Construction:
    exact angular trims and connecting blends of the partial clamp surfaces are not tabulated. Can further drawings
    resolve them? All 40 cylinders and functional planes are specified; surrounding blends remain underdetermined,
    and the pivot-mouth Ø3.9 is only raster measured.', 'Q5 — Diagnostics: quoted volume 29833.56 mm3, area 11557.87
    mm2 and centroid [-0.703,6.989,-2.703] mm lack a complete analytic exterior. Should they ever become mandatory
    gates? They remain nonbinding; schema 1 cannot label these acceptance quantities diagnostic-only, so their
    fields are null.', 'Q6 — Cosmetics: exact fan-lobe outline, lug fillet radius and R1/arrow outlines are unspecified;
    embossed versus recessed is also unclear. May they remain omitted or approximate? Shared envelope and functional
    checks still apply.', 'Q7 — Manufacturing: material, density, print settings and physical fit tolerances are
    unspecified; trap hardware is called both nut and heat-set hardware. Which material and fasteners/inserts
    are intended? Only documented geometry and digital tolerances are specified.', 'Q8 — Thickness: the table
    bbox reaches y=14.001 but the face and renders give 14.000. Is the extra 0.001 intentional? This draft retains
    the requested y=14 datum with a 0.03 mm envelope tolerance.']
