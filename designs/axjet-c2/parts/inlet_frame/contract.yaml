  - path: sources/axjet_design_and_implementation_guide.md
    kind: text
    role: authoritative
    sha256: c40b531fa23522311faeef914583f07ccabf09f123bd24fbb9fe16b467501490
    units: mm
    note: "AXJET-220 design and implementation guide; sections 2.4, 3.2, 4.4, 8.1, 9, 11, 14.1 define the inlet frame"

open_questions:
  - "Changed (revision 1, reviewer notes): the rear flange is OD 224 with 8 x D5.5 (M5 clearance) on PCD 212, one on +x (was OD 212 with 8 x D6.4 on PCD 206). Reason: the stated holes broke 0.2 mm out of the OD 212 rim and reached r 99.8 inside the r 100 wall, so no M6 head or nut could seat; an M5 head or nut at r 106 clears the wall and the rim by about 1.5 mm (case_r1 matches)."
  - "Changed (revision 1, reviewer notes): the struts are symmetric NACA 0020-type sections, 30 mm axial chord, 6 mm maximum thickness (was 12 mm). Reason: the guide's '12 % section' and '12 mm max thickness' disagree (12 mm is 40 % of 30 mm), and 12 mm struts block about 16 % of the annulus and shed bluff wakes 40 mm ahead of rotor_1."
  - "Changed (revision 1, reviewer notes): the front flange carries 8 x D5.5 through holes on PCD 216 (was 8 x M5 tapped, modelled D4.2); the M5 screws go in from behind the flange into tapped blind holes in the bellmouth. Reason: the bellmouth's solid lip covered the flange front face, so screws could not be fitted from the front."
  - "Changed (revision 1, reviewer notes): nothing of the frame may lie inside r 30 behind z -35 (was r 22), so the spinning stack nut (r 28, z -18 ... -8) clears it; the geometry already met this (the hub ring ends at z -35 and the fairing's inner cone is at r >= 32.8 behind it), so only the keep-out hardware and clearance changed."
  - "The +x strut carries the oil-mist, starter and instrumentation lines, but no passage is dimensioned; it stays solid in the model (revision 1 confirms)."
  - "Tapped holes are modelled at ISO tap-drill diameters (M3 as D2.5 x 6 blind); threads are not modelled."
  - "Nose-cone screws: PCD 56, the 45 deg clocking and the 6 mm depth are inferred; the nose cone's 2 mm wall (r 30 ... 32) needs lugs to reach r 28. Confirm with the nose_cone design."
  - "The D40 front wall bore is inferred; the nose nut (z -95 ... -75) must pass through it, and its OD is not stated."
  - "Seal sleeve wall (3 mm, OD 103) is inferred; a sleeve of any practical wall merges into the fairing cone between z -21 and about -16.8, so the literal 'web ahead of z -19' would need a wall under 0.8 mm. The merged length is taken as the web. Confirm the sleeve OD and the web."
  - "The fairing's 3 mm is read as normal shell thickness (4.29 mm radially); a radial reading would make the inner cone meet the D97 bore at z -20.96 instead of -19.69."
  - "Bearing retention is not defined: the bore is open to the rear at z -35 (the bearing must enter from the rear past the D40 front wall), and the 3 mm gap between the front wall (z -75) and the bearing face (z -72) and the rear retainer are not specified."
  - "The guide's r 95.8 at the flange face is 0.05 mm above the ellipse value 95.752; the ellipse governs."
  - "No fillets are stated at the strut roots and tips, the flange roots or the fairing junction; sharp junctions are modelled."
