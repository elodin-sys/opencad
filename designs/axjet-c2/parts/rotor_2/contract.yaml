open_questions:
  - "Changed (revision 1, reviewer notes): the disc rear face z 20 (assembly 62) bears on the new integral drum D46 shoulder (assembly z 62 ... 68, r 20 ... 23) instead of the stack nut, which moved to the front of the stack (assembly z -18 ... -8). Reason: the ID 39 nut could not pass the D40 drum to reach a thread behind rotor_2, and the old shoulder at z -14 blocked loading the blisks from either end. Geometry and acceptance values are unchanged; the face, interface and dimension descriptions now name the shoulder (the face keeps its name nutFace)."
  - "The intent asks for a disc 'in the proportions of rotor_1 (web 10 thick at the bore, 6 under the rim)', but the full-annulus front face (r 20 ... 57.5 at z -4), the rear face at z 20 inside the sleeve and the solid sleeve OD 126 x ID 60 leave no room for a web relief that is not an internal undercut; the contract models a solid disc section (1.015 kg, matching the stated 1.0 kg). A lightened web needs an interface change."
  - "Guide 4.3 gives the tip section 3.5 % of an 18 mm chord (0.63 mm), below the 0.8 mm tip minimum of 2.3 / 4.4; the contract raises the tip maximum thickness to 0.8 mm (4.4 % of chord). Confirm."
  - "The hub surface offers only 1 mm ahead of the LE (step at z -1) and none aft of the TE (step at z 13), so the r 1.5 root fillet cannot wrap the LE and TE without overhanging the steps; the contract lets it stop at the hub edges. Confirm."
  - "R2 tip relative Mach is 1.20; guide 4.3 calls for multiple-circular-arc tip profiles above M_rel 1.1, while the intent specifies circular-arc camber everywhere. The contract follows the intent."
  - "Blade sections are the 4.3 baseline; the controlled-vortex and swirl redistribution of 4.2 (analysis step 2) would change the metal angles and hub solidity."
  - "The OGV inner-band keep-out spans own z 16 ... 38 (OGV ring z 58 ... 80); the band's front end is not stated in the guide."
  - "Dowels (2 x D4), the balance-correction land on the rear face at r 45, and the 10 um drum interference are not modelled."
  - "Changed (revision 3, reviewer notes): feature blades states the hand (LE leads in the direction of rotation, +theta; concave pressure surface faces +theta; chord runs toward -theta from LE to TE; same hand as rotor_1; spool turns positively about +z) and adds hand probes: solid at [77.34, 3.039, 3.0] and [77.373, 2.026, 3.5], void at [77.34, -3.039, 3.0] and [77.373, -2.026, 3.5] (each at least 0.3 mm inside its region in theta and z; found by mirroring the built model, which keeps blade 0 on +x). Reason: the built rotor_2 was mirrored (mid-span area mean of n_z x n_theta -0.374 against rotor_1 +0.384); in mrfCold level 1 the axial velocity reversed inside rotor_2 (Uz -28.7 m/s at z 48), the swirl behind it reached 153-158 m/s (2.5 x the 63 m/s blade speed), the spool absorbed 6.35 N m (5.3 kW against about 1.3 kW) and the inlet sat 11.6 kPa above the outlet. The contract never stated the hand and its probes (passage-midline void, symmetric tip-cut count) could not tell it, so the mirrored model passed. No stated value changes."
