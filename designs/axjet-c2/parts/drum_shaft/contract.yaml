schema_version: 1
name: axjet-c2-drum_shaft
intent: >-
  Drum shaft (body drum_shaft of the axjet-c2 compressor module) of the AXJET-220 engine, a
  turned 17-4PH H1025 hollow shaft per section 8.1 and the section 14.1 parts table of
  sources/axjet_design_and_implementation_guide.md (authoritative). Own frame: axis +z through
  the origin, origin on the axis at the rotor_1 leading-edge plane (assembly z 0), x parallel to
  the assembly x; z -90 ... 262. Front: M20 x 1 LH nose-nut / starter-clutch thread z -90 ... -75
  (modelled as plain D20), D25 h5 front bearing journal z -75 ... -40 (modelled D25.0), step to
  a D36 neck at z -40 (bearing inner-race spacer abutment on the D25/D36 step). D36 neck
  z -40 ... -18 so the stack nut passes over it; M39 x 1.5 stack-nut thread z -18 ... -8
  (modelled as plain D39); D40 h6 seats (modelled D40.0) z -8 ... 62: rotor_1 z -8 ... 24, seal
  spacer z 24 ... 38, rotor_2 z 38 ... 62; integral D46 x 6 shoulder z 62 ... 68 whose front face
  z 62 is the rotor_2 rear stop; D40 drum z 68 ... 254. Rear flange D60 x 8 at z 254 ... 262 with
  6 x M5 tapped holes on PCD 50 and a D44 H7 x 2 recess in its rear face for the coupling-hub
  spigot. Bore D28 from z -30 through the flange (inferred start; the source's z -45 would cut
  through the D25 journal), 4 mm wall under the D36 neck. Revision 1 (reviewer notes): the rotor
  stack loads from the front against the z 62 shoulder and the stack nut clamps it at z -8.
units:
  length: mm
  angle: deg
material: "17-4PH H1025"
density_kg_m3: 7800
process: "turning, grinding of journals and seats, bore honed; flange holes drilled and tapped"
release_status: reconstruction

frame:
  origin: "on the spin axis at the rotor_1 leading-edge plane (assembly z 0); the thread-to-seat step is at z -8, the shoulder front face at z 62 and the flange rear face at z 262"
  axes:
    x: "parallel to the assembly x (engine up); bolt hole 1 of the flange pattern lies on +x"
    y: "completes a right-handed frame (parallel to the assembly y)"
    z: "along the spin axis, flow direction: nose thread at z -90, coupling flange at z 262"
  datums:
    - name: A
      description: "spin axis: the common axis of the D25 journal and the D40 rotor seats (the z axis); rotorSpin revolute joint axis +z through the origin"
    - name: B
      description: "shoulder front face z 62, normal -z: rotor_2 rear stop (the stack bears on it from the front)"
    - name: C
      description: "journal step face z -40 (D25/D36), normal -z: front bearing inner-race spacer abutment"
    - name: D
      description: "flange rear face z 262, normal +z: coupling-hub face (couplingOnDrum parent frame in the full engine)"
    - name: E
      description: "rigid mount stations: stackNutOnDrum z -18 on the D39 thread, rotor1OnDrum z 0, spacerOnDrum z 24 and rotor2OnDrum z 42 on the D40 seat (all on the axis, axis +z)"

envelope:
  min: [-30, -30, -90]
  max: [30, 30, 262]
  tolerance: 0.1

parameters:
  - name: shaftFrontZ
    value: -90
    unit: mm
    provenance: stated
    source: "guide section 8.1, drum shaft row: thread M20 x 1 (LH) z -90 ... -75"
    tolerance: 0.01
    description: "front end face of the nose thread"
  - name: journalFrontZ
    value: -75
    unit: mm
    provenance: stated
    source: "guide section 8.1: journal z -75 ... -40, thread z -90 ... -75"
    tolerance: 0.01
    description: "nose thread to journal step"
  - name: journalRearZ
    value: -40
    unit: mm
    provenance: stated
    source: "guide section 8.1: journal z -75 ... -40; revision 1 reviewer notes, change 1: the bearing spacer bears on the D25/D36 step at z -40"
    tolerance: 0.01
    description: "journal to neck step (bearing spacer abutment)"
  - name: shoulderFrontZ
    value: 62
    unit: mm
    provenance: stated
    source: "revision 1 reviewer notes, change 1 (approved; supersedes guide section 8.1 z -14 ... -8): integral shoulder D46 x 6 at z 62 ... 68"
    tolerance: 0.01
    description: "shoulder front face, rotor_2 rear stop (rotor_2 disc rear face z 62)"
  - name: shoulderRearZ
    value: 68
    unit: mm
    provenance: stated
    source: "revision 1 reviewer notes, change 1: shoulder at z 62 ... 68"
    tolerance: 0.01
    description: "shoulder rear face, start of the aft D40 drum"
  - name: nutThreadFrontZ
    value: -18
    unit: mm
    provenance: stated
    source: "revision 1 reviewer notes, change 1 (supersedes guide section 8.1 z 62 ... 72): M39 x 1.5 thread at z -18 ... -8"
    tolerance: 0.01
    description: "front end of the stack-nut thread (end of the D36 neck)"
  - name: nutThreadRearZ
    value: -8
    unit: mm
    provenance: stated
    source: "revision 1 reviewer notes, change 1: thread z -18 ... -8; rotor_1 disc front face z -8"
    tolerance: 0.01
    description: "rear end of the stack-nut thread, step up to the D40 seat (rotor_1 front face plane)"
  - name: flangeFrontZ
    value: 254
    unit: mm
    provenance: stated
    source: "guide section 8.1: flange D60 x 8 at z 254 ... 262"
    tolerance: 0.01
    description: "flange front face (end of the D40 drum)"
  - name: shaftRearZ
    value: 262
    unit: mm
    provenance: stated
    source: "guide section 8.1: flange at z 254 ... 262; section 14.1: coupling flange (z 262)"
    tolerance: 0.01
    description: "flange rear face, rear end of the shaft"
  - name: boreStartZ
    value: -30
    unit: mm
    provenance: inferred
    source: "user intent: bore D28 from z -30 through the flange"
    rationale: "the guide's tube runs from z -45, but a D28 bore there would cut through the D25 journal (ends at z -40) and split the shaft; the intent moves the blind end to z -30, leaving a 10 mm solid web behind the journal step"
    tolerance: 1.0
    description: "flat floor of the blind D28 bore"
    edit_test:
      delta: 10
      expect:
        volume_delta: 6157.5
        direction: increase
        bbox_delta: [0, 0, 0]
        tolerance_rel: 0.02
      sweep:
        values: [-35, -30, -20]
      infeasible_deltas: [-15]
  - name: noseThreadDia
    value: 20
    unit: mm
    provenance: stated
    source: "guide section 8.1: thread M20 x 1 (LH); intent: modelled as a plain D20"
    tolerance: 0.01
    description: "nose thread, nominal major diameter, no thread form"
  - name: journalDia
    value: 25
    unit: mm
    provenance: stated
    source: "guide section 8.1: D25 h5 journal; intent: modelled D25.0"
    tolerance: 0.01
    description: "front bearing journal"
  - name: drumDia
    value: 40
    unit: mm
    provenance: stated
    source: "guide section 8.1: tube D40 h6; intent: modelled D40.0"
    tolerance: 0.01
    description: "drum outer diameter (rotor_1, seal spacer and rotor_2 seats, aft drum)"
  - name: neckDia
    value: 36
    unit: mm
    provenance: stated
    source: "revision 1 reviewer notes, change 1: the drum is D36 between the front-bearing step (z -40) and the thread (z -18) so the nut passes over it"
    tolerance: 0.01
    description: "neck diameter z -40 ... -18 (4 mm wall over the D28 bore from z -30)"
  - name: shoulderDia
    value: 46
    unit: mm
    provenance: stated
    source: "guide section 8.1: shoulder D46 x 6; revision 1 moves it to z 62 ... 68"
    tolerance: 0.01
    description: "rotor_2 rear-stop shoulder"
  - name: nutThreadDia
    value: 39
    unit: mm
    provenance: stated
    source: "guide section 8.1: thread M39 x 1.5 (revision 1: at z -18 ... -8); intent: modelled as a plain D39"
    tolerance: 0.01
    description: "stack-nut thread, nominal major diameter, no thread form"
  - name: flangeDia
    value: 60
    unit: mm
    provenance: stated
    source: "guide section 8.1: flange D60 x 8"
    tolerance: 0.01
    description: "rear flange outer diameter"
  - name: boreDia
    value: 28
    unit: mm
    provenance: stated
    source: "guide section 8.1: tube D40 h6 x D28"
    tolerance: 0.01
    description: "drum bore"
    edit_test:
      delta: 2
      expect:
        volume_delta: -26420.8
        direction: decrease
        bbox_delta: [0, 0, 0]
        tolerance_rel: 0.02
      sweep:
        values: [24, 28, 32]
      infeasible_deltas: [12]
  - name: recessDia
    value: 44
    unit: mm
    provenance: stated
    source: "guide section 8.1: D44 H7 x 2 recess in the flange rear face"
    tolerance: 0.01
    description: "coupling-hub spigot recess diameter (modelled D44.0)"
  - name: recessDepth
    value: 2
    unit: mm
    provenance: stated
    source: "guide section 8.1: D44 H7 x 2 recess"
    tolerance: 0.01
    description: "recess depth from the flange rear face"
  - name: boltCircleDia
    value: 50
    unit: mm
    provenance: stated
    source: "guide section 8.1: 6 x M5 on PCD 50"
    tolerance: 0.01
    description: "flange bolt pitch circle"
  - name: boltCount
    value: 6
    unit: ""
    provenance: stated
    source: "guide section 8.1: 6 x M5 on PCD 50"
    tolerance: 0.01
    description: "number of tapped flange holes, equally spaced"
  - name: boltHoleDia
    value: 4.2
    unit: mm
    provenance: defaulted
    rationale: "M5 x 0.8 tapped holes modelled as their ISO 2306 tap-drill diameter (thread form is cosmetic); the source gives only the thread size"
    tolerance: 0.1
    description: "modelled diameter of the M5 tapped holes"
  - name: boltStartAngle
    value: 0
    unit: deg
    provenance: inferred
    rationale: "the source does not clock the pattern; the guide's flange patterns put one hole on +x (case-r1, comb-outer-case), so hole 1 is on +x and the rest follow every 60 deg"
    tolerance: 1.0
    description: "angle of bolt hole 1 from +x about +z"

features:
  - id: noseThread
    kind: revolve
    description: "M20 x 1 LH nose-nut and starter-clutch thread z -90 ... -75, modelled as a plain D20 cylinder; solid (the bore starts at z -30)"
    parameters: [shaftFrontZ, journalFrontZ, noseThreadDia]
    verify:
      - method: cylinder
        cylinder: noseThread
      - method: face
        face: frontEnd
      - method: section
        section: secNose
      - method: solid
        points: [[0, 0, -82.5]]
      - method: void
        points: [[0, 11.5, -82.5]]
  - id: frontJournal
    kind: revolve
    description: "D25 h5 front bearing journal z -75 ... -40 (modelled D25.0), solid"
    parameters: [journalFrontZ, journalRearZ, journalDia]
    verify:
      - method: cylinder
        cylinder: frontJournal
      - method: face
        face: threadStep
      - method: face
        face: journalStep
      - method: dimension
        dimension: journalSpan
      - method: section
        section: secJournal
      - method: solid
        points: [[0, 0, -57.5]]
      - method: void
        points: [[0, 16, -57.5]]
  - id: drum
    kind: revolve
    description: "D40 h6 drum (modelled D40.0) in two runs: the rotor/spacer seat z -8 ... 62 and z 68 ... 254 behind the shoulder"
    parameters: [nutThreadRearZ, shoulderFrontZ, shoulderRearZ, flangeFrontZ, drumDia]
    verify:
      - method: cylinder
        cylinder: drumSeat
      - method: cylinder
        cylinder: drumAft
      - method: dimension
        dimension: seatSpan
      - method: section
        section: secSeat
      - method: section
        section: secDrumAft
      - method: solid
        points: [[17, 0, 10], [0, 17, 160]]
  - id: neck
    kind: revolve
    description: "D36 neck z -40 ... -18 between the front-bearing step and the stack-nut thread, so the ID 39 nut passes over it; solid ahead of the bore floor (z -30), 4 mm wall over the bore behind it"
    parameters: [journalRearZ, nutThreadFrontZ, neckDia]
    verify:
      - method: cylinder
        cylinder: drumNeck
      - method: face
        face: journalStep
      - method: dimension
        dimension: neckSpan
      - method: section
        section: secWeb
      - method: section
        section: secNeck
      - method: solid
        points: [[16, 0, -24]]
      - method: void
        points: [[0, 19, -30]]
  - id: shoulder
    kind: revolve
    description: "D46 x 6 shoulder z 62 ... 68; its front face z 62 is the rotor_2 rear stop, inside the rotor_2 rear seal sleeve (ID 60)"
    parameters: [shoulderFrontZ, shoulderRearZ, shoulderDia]
    verify:
      - method: cylinder
        cylinder: shoulderRim
      - method: face
        face: shoulderStop
      - method: face
        face: shoulderRear
      - method: dimension
        dimension: shoulderSpan
      - method: section
        section: secShoulder
      - method: solid
        points: [[21.5, 0, 65]]
      - method: void
        points: [[21.5, 0, 72]]
  - id: nutThread
    kind: revolve
    description: "M39 x 1.5 stack-nut thread z -18 ... -8, modelled as a plain D39 band (1.5 mm radial step above the D36 neck at its front, 0.5 mm below the D40 seat at its rear)"
    parameters: [nutThreadFrontZ, nutThreadRearZ, nutThreadDia]
    verify:
      - method: cylinder
        cylinder: nutThread
      - method: face
        face: nutThreadFront
      - method: face
        face: seatStep
      - method: dimension
        dimension: nutThreadSpan
      - method: section
        section: secNutThread
      - method: solid
        points: [[16.75, 0, -13]]
      - method: void
        points: [[21.5, 0, -11]]
  - id: flange
    kind: revolve
    description: "D60 x 8 rear coupling flange z 254 ... 262"
    parameters: [flangeFrontZ, shaftRearZ, flangeDia]
    verify:
      - method: cylinder
        cylinder: flangeRim
      - method: face
        face: flangeFront
      - method: face
        face: flangeRear
      - method: dimension
        dimension: flangeSpan
      - method: dimension
        dimension: overallWidthX
      - method: bbox
      - method: solid
        points: [[0, 27, 257]]
  - id: couplingRecess
    kind: pocket
    description: "D44 H7 x 2 recess (modelled D44.0) in the flange rear face z 260 ... 262 for the coupling-hub spigot; the bore opens into its floor"
    parameters: [recessDia, recessDepth, shaftRearZ]
    verify:
      - method: cylinder
        cylinder: couplingRecess
      - method: face
        face: recessFloor
      - method: dimension
        dimension: recessSpan
      - method: section
        section: secRecess
  - id: boltHoles
    kind: pattern
    description: "6 x M5 tapped holes through the flange (z 254 ... 262) on PCD 50, modelled as D4.2 tap-drill through holes, hole 1 on +x, then every 60 deg"
    parameters: [boltCircleDia, boltCount, boltHoleDia, boltStartAngle, flangeFrontZ, shaftRearZ]
    count: 6
    verify:
      - method: cylinder
        cylinder: boltHole1
      - method: cylinder
        cylinder: boltHole2
      - method: cylinder
        cylinder: boltHole3
      - method: cylinder
        cylinder: boltHole4
      - method: cylinder
        cylinder: boltHole5
      - method: cylinder
        cylinder: boltHole6
      - method: section
        section: secFlange
      - method: void
        points: [[25, 0, 258], [12.5, 21.6506, 258], [-12.5, 21.6506, 258], [-25, 0, 258], [-12.5, -21.6506, 258], [12.5, -21.6506, 258]]
  - id: bore
    kind: hole
    description: "D28 blind bore from a flat floor at z -30 through the flange into the recess floor (z 260); z -40 ... -30 stays solid"
    parameters: [boreDia, boreStartZ, shaftRearZ]
    verify:
      - method: cylinder
        cylinder: bore
      - method: face
        face: boreFloor
      - method: section
        section: secWeb
      - method: section
        section: secSeat
      - method: solid
        points: [[0, 0, -35]]
      - method: void
        points: [[0, 0, -28], [0, 0, 100]]

interfaces:
  - name: spinAxis
    description: "rotorSpin revolute joint (parent case-r1): axis +z through the own-frame origin; carried by the coaxial D25 journal and D40 seat; no edit test moves either"
    must_not_change: true
    checks: [frontJournal, drumSeat]
  - name: rotorSeat
    description: "rigid mounts rotor1OnDrum (z 0), spacerOnDrum (z 24) and rotor2OnDrum (z 42) on the D40 seat z -8 ... 62; rotor_2 stops on the shoulder front face z 62 and the stack nut clamps rotor_1 at z -8; the rotor stack (32 + 14 + 24) fills the 70 mm seat"
    must_not_change: true
    checks: [drumSeat, shoulderStop, seatSpan]
  - name: frontBearing
    description: "front bearing pair on the D25 journal z -75 ... -40; the inner-race spacer bears on the D25/D36 step face z -40"
    must_not_change: true
    checks: [frontJournal, journalStep, journalSpan]
  - name: noseNut
    description: "nose nut and starter clutch cup on the M20 x 1 LH thread (modelled D20) z -90 ... -75"
    must_not_change: true
    checks: [noseThread, frontEnd]
  - name: stackNut
    description: "stackNutOnDrum rigid mount at z -18: the stack nut passes over the D36 neck and runs on the M39 x 1.5 thread (modelled D39) z -18 ... -8, its rear face clamping rotor_1 at z -8"
    must_not_change: true
    checks: [nutThread, nutThreadSpan, drumNeck]
  - name: couplingFlange
    description: "coupling-hub interface of the full engine: flange rear face z 262, D44 x 2 spigot recess and 6 tapped holes on PCD 50; the bore edits change none of these"
    must_not_change: true
    checks: [flangeRear, couplingRecess, boltHole1, boltHole2, boltHole3, boltHole4, boltHole5, boltHole6]

acceptance:
  volume:
    expected: 228247.9
    tolerance_rel: 0.002
    provenance: derived
    note: "outer stepped revolve pi*sum(r^2*L) = 410522.1 (r 10x15, 12.5x35, 18x22, 19.5x10, 20x70, 23x6, 20x186, 30x8) minus bore pi*14^2*292 (z -30 ... 262), recess annulus pi*(22^2-14^2)*2 and 6 holes 6*pi*2.1^2*8"
  surface_area:
    expected: 74668.4
    tolerance_rel: 0.005
    provenance: derived
    note: "outer cylinders 2*pi*sum(r*L) + annular step faces (z -75, -40, -18, -8, 62, 68) + end faces net of the 6 holes + bore wall 2*pi*14*290 + bore floor + recess wall 2*pi*22*2 + recess floor + 6 hole walls 2*pi*2.1*8"
  center_of_mass:
    expected: [0, 0, 99.928]
    tolerance: 0.1
    provenance: derived
    note: "x = y = 0 by the 6-fold hole pattern; z = sum(V_i*z_i)/V over the same solids and voids as the volume"
  solid_count: 1
  sections:
    - id: secNose
      plane: z
      at: -82.5
      expect:
        area: 314.159
        area_tolerance_rel: 0.005
        loops: 1
        holes: 0
      description: "solid D20 nose thread"
    - id: secJournal
      plane: z
      at: -57.5
      expect:
        area: 490.874
        area_tolerance_rel: 0.005
        loops: 1
        holes: 0
      description: "solid D25 journal"
    - id: secWeb
      plane: z
      at: -35
      expect:
        area: 1017.876
        area_tolerance_rel: 0.005
        loops: 1
        holes: 0
      description: "solid D36 web between the journal step (z -40) and the bore floor (z -30)"
    - id: secNeck
      plane: z
      at: -24
      expect:
        area: 402.124
        area_tolerance_rel: 0.005
        loops: 1
        holes: 1
