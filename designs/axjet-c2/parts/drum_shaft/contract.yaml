open_questions:
  - "Changed (revision 1, reviewer notes): the D46 x 6 shoulder moves from z -14 ... -8 to z 62 ... 68 (rotor_2 rear stop), the M39 x 1.5 thread (plain D39) moves from z 62 ... 72 to z -18 ... -8, and the drum between the front-bearing step and the thread becomes a D36 neck (z -40 ... -18; the spacer now bears on the D25/D36 step); stackNutOnDrum moves to z -18. Reason: with an integral shoulder at z -14 and the integral D60 flange, the D40-bore blisks and spacer could not be fitted from either end and the ID 39 nut could not pass the D40 drum to reach its thread; the stack now loads from the front against the z 62 shoulder. Volume, area, centre of mass, sections, faces, cylinders, spans, probes and the blockout band are recomputed."
  - "Bore start: the guide says the D28 tube runs from z -45, which would cut through the D25 journal (ends at z -40); the intent's z -30 (10 mm solid web behind the journal step) is inferred, not stated."
  - "Bore floor form (flat vs drill point) and the bore's exit through the flange are not stated; modelled as a flat floor at z -30 and a plain bore opening into the recess floor."
  - "M5 tapped holes: depth (through vs blind) and modelled diameter are not stated; modelled as D4.2 tap-drill holes through the 8 mm flange. Their edge lies 0.9 mm outside the D44 recess wall."
  - "Bolt-pattern clocking is not stated; hole 1 on +x (guide convention for flange patterns) must match the coupling hub of the full engine."
  - "Fits are modelled at nominal size (D25 h5, D40 h6, D44 H7 as 25.0, 40.0, 44.0); rotor bores D40 H6 with 10 um interference will show as coincident surfaces in the assembly."
  - "Threads (M20 x 1 LH, M39 x 1.5) are plain cylinders at the major diameter; thread run-outs, undercuts, edge chamfers and fillets at the steps are not given and are not modelled."
  - "Mass: the modelled shaft is 1.78 kg at 7800 kg/m3, above the guide's 1.6 kg budget for 'drum shaft, nuts, spacers' combined (section 12, an estimate)."
