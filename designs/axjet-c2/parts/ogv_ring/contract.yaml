open_questions:
  - "Changed (revision 1, reviewer notes): both flanges are OD 224 with 8 x D5.5 (M5 clearance) holes on PCD 212, one on +x, 45 deg pitch (was OD 212 with 8 x D6.4 on PCD 206). Reason: the stated holes broke 0.2 mm out of the OD 212 rim and reached r 99.8 inside the OD 200 body, so no M6 head or nut could seat; an M5 head or nut at r 106 clears the body and the rim by about 1.5 mm (as case_r1 and stator_1). Envelope, volume, surface area, centre of mass, the four flange sections, flange faces and rims, hole cylinders, the flange-span dimension, probes, the casingOd infeasible delta (now +26) and the blockout band are recomputed."
  - "Rear flange hole pattern and clocking (one on +x) are inferred to match the front; the diffuser joint is not yet designed."
  - "Labyrinth tooth geometry is inferred: grooves 1.0 mm deep (to r 64.5) over the sleeve span z 62 ... 70, two 1.0 mm teeth centred at z 64 and z 68 with tips at r 63.5. Only the tooth count, tip radius and the 0.5 mm radial gap are stated (section 8.1 lists 0.4 mm for the blisk-spigot seals; the intent's 0.5 mm is used)."
  - "Rotation sense is not stated: angles are positive in the direction of rotation (Appendix B); rotation is inferred right-handed about +z (from +x toward +y), so the vane leading edges point toward +theta."
  - "Vane clocking is not stated; the first vane's stacking line is inferred on +x."
  - "Hub, mean and tip section radii are not stated for the OGV: hub r 66.5 (flow surface at the leading edge), tip r 90.0, mean r 78.25; the hub section lies up to 0.9 mm below the rising band and is fused into it."
  - "Thickness distribution: NACA-65 per section 14 with a 0.25 mm LE radius and a 0.5 mm TE; the TE blend is not stated, so the vane volume carries +-2000 mm3 (total volume tolerance 3000 mm3)."
  - "Stacking: 'radial stacking' with the leading edge at z 61 is read as every section's LE at z 61 axially and the section centroids on one radial line tangentially."
  - "No vane root or tip fillets are stated (the blisks have r 1.5); junctions are left sharp."
  - "The casing front-face corner (r 90.25, z 58) lies about 3 mm from the rotor_2 tip trailing edge (r 90.0, z 55); if the assembly's rotor2ToOgv min_gap 4.0 is measured body to body it may fail on this corner rather than on the vanes (z 61)."
  - "No abradable recess is modelled: the guide applies the 0.5 mm abradable only over the rotors, and no rotor runs inside this ring."
  - "Baseline turning 53.8 deg -> 0 deg exceeds the guide's 40 deg per-row limit; the tandem pair and solidity-1.8 options of section 4.2 are not modelled (per the intent)."
