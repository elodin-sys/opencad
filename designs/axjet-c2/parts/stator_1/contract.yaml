open_questions:
  - "Changed (revision 1, reviewer notes): both flanges are OD 224 with 8 x D5.5 (M5 clearance) holes on PCD 212, one on +x, 45 deg pitch (was OD 212 with 8 x D6.4 on PCD 206). Reason: the stated holes broke 0.2 mm through the OD 212 rim and reached r 99.8 inside the OD 200 barrel, so no M6 head, nut or washer could seat; an M5 head or nut at r 106 clears the barrel and the rim by about 1.5 mm. Envelope, volume, surface area, centre of mass, flange sections and faces, hole and flange cylinders, probes and the blockout band are recomputed (matches case_r1 and ogv_ring)."
  - "Chord 15 at stagger 13.6 ... 19.5 deg gives an axial extent 14.14 ... 14.58 mm, so with the LE at z 22 the trailing edge sits at z 36.14 (hub) ... 36.58 (tip), past the nominal z 36 of guide 3.2; chord and LE were kept."
  - "The guide gives a 3 mm inner band thickness to r 58.0 but the labyrinth tooth height, width, pitch and positions are not stated; inferred 1.0 mm rectangular teeth at z 28 and z 34 on a r 59.0 land (front wall 2.0 mm)."
  - "Rotation direction is not stated; vane angles are applied positive about +z (the rotorSpin axis). If the rotor turns the other way the vanes must be mirrored."
  - "Vane clocking (vane 0 on +x) and the radial positions of the hub/mean/tip sections (r 61.0 / 75.5 / 90.0, the rotor-1 exit radii) are inferred."
  - "Section 8.1 gives 0.4 mm for the blisk-spigot labyrinths while 4.4 and the intent give 0.5 mm; 0.5 mm is used (the assembly clearance requires >= 0.4)."
