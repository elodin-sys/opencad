  bbox_tolerance: 0.5
  clearances:
    - {name: rotor1Tip, a: rotor_1, b: case_r1, min_gap: 0.2, description: rotor_1 tips to the case_r1 bore (0.25 cold)}
    - {name: rotor2Tip, a: rotor_2, b: stator_1, min_gap: 0.2, description: rotor_2 tips to the stator_1 bore (0.25 cold)}
    - {name: rotor1ToStator1, a: rotor_1, b: stator_1, min_gap: 3.9, description: "axial row gap, 4.0 nominal (rotor_1 hub trailing edge z 16 to the stator_1 inner band z 20); 0.1 left for modelling tolerance"}
    - {name: rotor1ToInletFrame, a: rotor_1, b: inlet_frame, min_gap: 0.3, description: "front labyrinth, 0.4 nominal; the fairing to rotor_1 face gap is 3"}
    - {name: spacerSeal, a: seal_spacer, b: stator_1, min_gap: 0.4, description: seal spacer to the stator_1 inner-band labyrinth (0.5 nominal)}
    - {name: sleeveSeal, a: rotor_2, b: ogv_ring, min_gap: 0.4, description: "rotor_2 rear sleeve to the OGV inner-band labyrinth (0.5 nominal); it also bounds the rotor_2 to OGV row gap, which is 4 mm at the hub and 6 mm blade to vane"}
    - {name: drumToInletFrame, a: drum_shaft, b: inlet_frame, min_gap: 1.0, description: "the spinning drum clears the hub bores (8 mm nominal at the D36 neck in the D52 seat, 10 mm behind z -35)"}
    - {name: stackNutToInletFrame, a: stack_nut, b: inlet_frame, min_gap: 1.0, description: "the spinning nut (r 28, z -18 ... -8) clears the inlet_frame, which keeps outside r 30 behind z -35 (revision 1)"}
    - {name: bellmouthSeat, a: bellmouth, b: inlet_frame, max_gap: 0.05, description: flange contact at z -72}
    - {name: inletFrameSeat, a: inlet_frame, b: case_r1, max_gap: 0.05, description: flange contact at z -18}
    - {name: stator1Seat, a: stator_1, b: case_r1, max_gap: 0.05, description: flange contact at z 18}
    - {name: ogvSeat, a: ogv_ring, b: stator_1, max_gap: 0.05, description: flange contact at z 58}
    - {name: noseSeat, a: nose_cone, b: inlet_frame, max_gap: 0.05, description: nose_cone rear face on the hub at z -80}
    - {name: starterSeat, a: starter, b: nose_cone, max_gap: 0.05, description: starter on the bulkhead at z -108}
    - {name: frontBearingSeat, a: bearing_front, b: inlet_frame, max_gap: 0.05, description: bearing OD in the D52 hub seat}
    - {name: frontBearingJournal, a: bearing_front, b: drum_shaft, max_gap: 0.05, description: bearing bore on the D25 journal}
    - {name: rotor1Seat, a: rotor_1, b: drum_shaft, max_gap: 0.05, description: rotor_1 bore on the drum}
    - {name: spacerSeat, a: seal_spacer, b: drum_shaft, max_gap: 0.05, description: seal_spacer bore on the drum}
    - {name: rotor2Seat, a: rotor_2, b: drum_shaft, max_gap: 0.05, description: rotor_2 bore on the drum}
    - {name: stackNutSeat, a: stack_nut, b: drum_shaft, max_gap: 0.05, description: stack nut on the D39 thread section at z -18 ... -8}
  motions:
    - {name: spin, drive: rotorSpin, range: [0.0, 12.41], steps: 12, interference_tolerance: 0.05, description: "one rotor_1 blade pitch (360/29 deg): every blade, seal and journal past its stationary neighbours"}
references:
  - {path: sources/axjet_design_and_implementation_guide.md, kind: text, role: authoritative, sha256: "c40b531fa23522311faeef914583f07ccabf09f123bd24fbb9fe16b467501490"}
open_questions:
  - "Changed (revision 1, reviewer notes): rotor stack loads from the front. The drum D46 x 6 shoulder moves from z -14 ... -8 to z 62 ... 68 (rotor_2 rear stop), the M39 thread (plain D39) moves to z -18 ... -8 behind a D36 neck z -40 ... -18, and the stack nut moves to z -18 ... -8 (joint stackNutOnDrum at drum z -18) clamping rotor_1; the inlet_frame keeps outside r 30 behind z -35 and the clearance stackNutToInletFrame (min 1.0) is added. Reason: with an integral shoulder at z -14 and the integral D60 flange the D40-bore blisks, the spacer and the ID 39 nut could not be fitted from either end."
  - "Changed (revision 1, reviewer notes): every compressor casing flange (case_r1, stator_1 and ogv_ring front and rear, inlet_frame rear) is OD 224 with 8 x D5.5 (M5 clearance) on PCD 212, one hole on +x. Reason: 8 x D6.4 on PCD 206 broke 0.2 mm out of the OD 212 rims and no M6 head or nut could seat between the ring wall and the rim."
  - "Changed (revision 1, reviewer notes): inlet struts are symmetric NACA 0020-type sections, 30 mm axial chord, 6 mm maximum thickness. Reason: the guide's 12 % section and 12 mm thickness disagree (12 mm is 40 % of 30 mm), and 12 mm struts block about 16 % of the annulus 40 mm ahead of rotor_1."
  - "Changed (revision 1, reviewer notes): the bellmouth lip is a 6 mm quarter-round centred at (z -89, r 125), tangent to the ellipse at (z -95, r 125) and to the r 131 outer skin, so the part spans z -95 ... -72; the bellmouth carries 8 x M5 tapped blind holes (D4.2 x 10) from its rear face and the inlet_frame front flange 8 x D5.5 through holes on PCD 216, screws inserted from behind. Reason: the stated 3 mm lip left a 90 deg crease against the ellipse's radial tangent, and the solid lip covered the flange so the screws could not be fitted from the front."
  - "Drum bore: section 8.1 starts the D28 bore at z -45, which would cut through the D25 journal (to z -40); the bore starts at z -30 (inferred)."
  - "The section 14.1 clearance rotor2ToOgv (min_gap 4.0) cannot hold body to body because the rotor_2 rear sleeve runs 0.5 mm inside the OGV inner band; it is replaced by sleeveSeal (min 0.4) plus the part dimensions (rotor_2 hub trailing edge z 55, OGV band front face z 59, vanes from z 61)."
  - "rotor1ToStator1 is exactly 4.0 by the stated geometry (rotor_1 rim to z 16, stator_1 inner band from z 20); min_gap is 3.9 to leave 0.1 for modelling tolerance."
  - "Abradable liners over both rotors are modelled as part of case_r1 and stator_1 (finished bore D180.5) rather than as open 0.5 mm recesses, so the 0.25 mm cold tip clearance is what the clearances and the CFD see."
  - "Rotation sense is not stated; the spool turns positively about +z and the blade angles are positive in that direction."
  - "Inferred interface details: casing flange thickness 6, OGV rear flange as the other casing flanges, OGV inner band front face z 59, rotor_2 front hub extension from z 41, inlet_frame front wall bore D40, seal-sleeve web ahead of z -19, nose_cone and starter screw patterns, stack_nut notches, bellmouth outer-skin profile."
  - "Stage-1 stator labyrinth gap: 0.5 mm (section 4.4) versus 0.4 mm (section 8.1 seals); 0.5 nominal with min_gap 0.4."
  - "OGV vanes: z 61 ... 76 (15 mm) exceeds the 14 mm chord; the leading edge is at z 61 and chord with stagger set the trailing edge."
  - "Cold-case flow: 0.418 kg/s at 1.204 kg/m3 is 20,830 L/min; the stated 20,900 L/min is used."
  - "The envelope includes the derived plenum skin rigPlenum (r 155, z -225) and the air plenum (r 150, z -220); the part bodies alone span [-131, -131, -165] ... [131, 131, 262]."
  - "Changed (amendment 1, evaluator evidence): derived solid bodies rigPlenum (r 150 ... 155 over z -225 ... -95 plus the rear wall z -95 ... -90 over r 125 ... 155), rigExit (r 90.25 ... 95 over z 80 ... 95) and rigExitPlug (r 20 ... 67.5 over z 80 ... 95) are added as stationary rig hardware built in the assembly source, each on a rigid joint to case_r1 in the assembly frame (rigPlenumFixed, rigExitFixed, rigExitPlugFixed). Reason: domains.json fluids.air reported sealed false, leaks_to [x-, x+, y-, y+], derived volume 19.87e6 mm3 against 12.0e6 and p99 87.6 mm against the source's air body, because no wall bounded the r 150 plenum radially or the exit annulus between the OGV rear face (z 80) and the outlet cap (z 90), inside and outside."
  - "Changed (amendment 1, evaluator evidence): fluid volume air walls are now [bellmouth, inlet_frame, nose_cone, case_r1, stator_1, ogv_ring, bearing_front, starter, rigPlenum, rigExit, rigExitPlug] and minus [rotor_1, seal_spacer, rotor_2, drum_shaft, stack_nut]; caps and seed unchanged. Reason: with only the rig skins added the sealed region held 1.42e6 mm3 more than the source's air body (p99 39 mm), since bearing_front, starter and stack_nut were in neither list and read as air, joining the nose cavity and hub interior to the gas path through the 0.4-0.5 mm labyrinths."
  - "Changed (amendment 1, evaluator evidence): air volume expected 12.17e6 mm3, tolerance 5 %, provenance derived (was 12.0e6, 20 %, the section 14.1 estimate). Reason: the probe with the new walls and minus bodies gives one sealed piece of 12.17e6 mm3 = gas path 11.86e6 + 0.32e6 of seal pockets and labyrinth cavities; the closed nose cavity and the drum bore drop out as separate pieces."
  - "Changed (amendment 1, evaluator evidence): body air is the whole wetted region those walls and minus bodies bound, built by the evaluator's recipe (padded box minus one fused tool, clipped at the caps, the seed piece), so source and evaluator agree. The CFD mesh (6 mm cells, 0.75 mm at walls) does not enter the 0.4-0.5 mm labyrinths, so the meshed domain stays the gas path plus the open pockets; mrfCold settings, regions and ladder are unchanged."
  - "Changed (amendment 1, evaluator evidence): boundaries rotor1Free (role other, body rotor_1, select rest) and the rotating walls spacerWall, drumWall and nutWall (touching seal_spacer, drum_shaft, stack_nut) are added; casingWall stays the rest. Reason: domains.json boundaries.rotor_1 had 3299 faces unassigned (only rotor1Bore named), failing boundaries_complete, and the spool faces now in the air body need rotating-wall labels."
  - "Changed (amendment 1, evaluator evidence): envelope grows from [-150, -150, -220] ... [150, 150, 262] to [-155, -155, -225] ... [155, 155, 262] to include rigPlenum."
  - "The rig bodies' material is not stated; they are boundaries for the fluid domain only and carry no mass properties. rigExitPlug runs line-to-line on the spinning D40 drum; it is axisymmetric there, so the spin sweep is expected to see no interference beyond the 0.05 tolerance (not yet measured; no clearance pair is added for it or for the rig seats, which the amendment does not request)."
  - "Starter mass and density are not stated (catalog envelope only); inlet turbulence intensity is not stated (adapter default 5 %)."
  - "mrfCold ladder: the guide's [1.0, {0.8, tips 1}, {0.64, tips 1}] mixes a global and a regional step; the tip regions are on all three levels so each step refines everywhere, as the guide intends."
  - "Body names use underscores (case_r1, rotor_1, ...) because names must be identifiers; the design leaves follow (axjet-c2-case_r1, ...)."
