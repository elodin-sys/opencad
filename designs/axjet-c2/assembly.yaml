operating_cases:
  - id: cold
    values: {speedRpm: 8000.0, flowLMin: 20900.0}
    units: {speedRpm: rpm, flowLMin: L/min}
    split: development
    source: sources/axjet_design_and_implementation_guide.md section 14.1
    description: "cold MRF sanity case: 0.418 kg/s at 1.204 kg/m3 (2.30 kg/s x 8/44); air 1.204 kg/m3, 1.813e-5 Pa s"
  - id: design
    values: {speedRpm: 44000.0}
    units: {speedRpm: rpm}
    split: held_out
    source: sources/axjet_design_and_implementation_guide.md sections 1 and 14.1
    description: "design point, 2.30 kg/s, OPR 2.33; structural cases only, no fluid simulation"
observables:
  - id: dpCold
    quantity: pressure_rise
    unit: Pa
    simulation: mrfCold
    case: cold
    averaging: steady
    description: >-
      static pressure, outlet cap (z 90) minus inlet cap (z -220) patch averages. Meanline expectation about 2.9 kPa
      static-to-static (3.2 kPa total-to-total scaled by (8/44)^2): class X, an estimate and not a reference, so no band.
  - id: torqueCold
    quantity: torque
    unit: N m
    simulation: mrfCold
    case: cold
    averaging: steady
    description: driving torque the spool absorbs; estimate about 1.5 N m (215 kW x (8/44)^3 at 838 rad/s), not a band
  - id: rotor1TipGrowth
    quantity: max_displacement
    unit: mm
    simulation: rotor1Stress
    case: design
    body: rotor_1
    averaging: maximum
    max: 0.2
    description: rotor_1 centrifugal displacement at 44,000 rpm; section 14.1 limit 0.20 mm (expect 0.10 to 0.15)
  - id: rotor1Mode1
    quantity: natural_frequency_1
    unit: Hz
    simulation: rotor1Modal
    case: design
    body: rotor_1
    min: 2000.0
    description: first rotor_1 mode, unloaded with the bore fixed; requirement first blade mode >= 2 kHz (section 13 step 7)
simulations:
  - id: mrfCold
    physics: cfd_steady
    solver: openfoam
    cases: [cold]
    bodies: [air, rotor_1, rotor_2, drum_shaft]
    inputs:
      fluidDensity: {value: 1.204, unit: kg/m3, provenance: stated, source: "sources/axjet_design_and_implementation_guide.md section 14.1 (cold case)"}
      fluidViscosity: {value: 1.813e-5, unit: Pa s, provenance: stated, source: "sources/axjet_design_and_implementation_guide.md section 14.1 (cold case)"}
    settings: {flow_key: flowLMin, speed_key: speedRpm, inlet_diameter_mm: 300.0, cell_mm: 6.0, surface_level: 3, iterations: 1500, processes: 8, timeout_s: 36000}
    regions:
      - {name: tip1, shape: rotor_tip, body: rotor_1, inside_mm: 1.0, outside_mm: 1.5, axial_margin_mm: 3.0, description: rotor_1 tips and the 0.25 mm gap to case_r1}
      - {name: tip2, shape: rotor_tip, body: rotor_2, inside_mm: 1.0, outside_mm: 1.5, axial_margin_mm: 3.0, description: rotor_2 tips and the 0.25 mm gap to stator_1}
    refinement:
      - {factor: 1.0, regions: {tip1: 1, tip2: 1}}
      - {factor: 0.8, regions: {tip1: 1, tip2: 1}}
      - {factor: 0.64, regions: {tip1: 1, tip2: 1}}
    outputs: [dpCold, torqueCold]
    description: >-
      steady MRF (k-omega SST) of the spool at 8,000 rpm about the rotorSpin axis; the tip regions are refined on every
      level so each ladder step refines everywhere (the guide's bare 1.0 first level mixed a global and a regional step).
      Expect resolved false on the first ladder (FAN-01 experience): a geometry check, not a performance prediction.
  - id: rotor1Stress
    physics: structural_static
    solver: calculix
    cases: [design]
    bodies: [rotor_1]
    inputs:
      rotor_1.youngsModulus: {value: 7.45e+10, unit: Pa, provenance: stated, source: "sources/axjet_design_and_implementation_guide.md section 14.1 (2618-T61)"}
      rotor_1.poissonRatio: {value: 0.33, unit: "", provenance: stated, source: "sources/axjet_design_and_implementation_guide.md section 14.1 (2618-T61)"}
      rotor_1.density: {value: 2760.0, unit: kg/m3, provenance: stated, source: "sources/axjet_design_and_implementation_guide.md section 14.1 (2618-T61)"}
    settings: {mesh_size_mm: 1.5, fixed_boundary: rotor1Bore}
    refinement: [1.0, 0.7, 0.5]
    outputs: [rotor1TipGrowth]
    description: centrifugal load at the design speed of rotorSpin, bore fixed
  - id: rotor1Modal
    physics: modal
    solver: calculix
    cases: [design]
    bodies: [rotor_1]
    inputs:
      rotor_1.youngsModulus: {value: 7.45e+10, unit: Pa, provenance: stated, source: "sources/axjet_design_and_implementation_guide.md section 14.1 (2618-T61)"}
      rotor_1.poissonRatio: {value: 0.33, unit: "", provenance: stated, source: "sources/axjet_design_and_implementation_guide.md section 14.1 (2618-T61)"}
      rotor_1.density: {value: 2760.0, unit: kg/m3, provenance: stated, source: "sources/axjet_design_and_implementation_guide.md section 14.1 (2618-T61)"}
    settings: {modes: 6, mesh_size_mm: 1.5, fixed_boundary: rotor1Bore}
    refinement: [1.0, 0.7, 0.5]
    outputs: [rotor1Mode1]
    description: >-
      six modes of rotor_1 with the bore fixed, no loads (the design case only labels the run); mesh size and ladder
      mirror rotor1Stress because the source states neither
