schema_version: 1
kind: assembly
name: axjet-c2
intent: >-
  AXJET-220 two-stage transonic axial compressor module per section 14.1 of
  sources/axjet_design_and_implementation_guide.md (authoritative): bolt-on bellmouth lip, inlet frame with five struts,
  hub fairing and front bearing housing, nose cone with the starter, 29-blade rotor_1 blisk, 41-vane stator_1 ring,
  31-blade rotor_2 blisk, 47-vane OGV ring, stacked casing rings and the D40 drum shaft. One revolute joint (the spool on
  case_r1) runs at 44,000 rpm design; an 8,000 rpm cold steady MRF case on the derived air body predicts the static
  pressure rise and the rotor torque as a geometry check, and CalculiX cases predict the rotor_1 centrifugal tip growth
  at design speed and its first natural frequency.
units: {length: mm, angle: deg}
frame:
  origin: engine axis at the rotor_1 leading-edge plane (guide section 3)
  axes:
    x: "up, toward the aircraft dorsal intake; the +x inlet strut and the first hole of every flange lie on +x"
    y: completes a right-handed frame
    z: "engine axis, flow toward +z"
  datums:
    - {name: A, description: "rotor_1 leading-edge plane z = 0"}
    - {name: B, description: "engine axis x = y = 0"}
    - {name: C, description: "the +x direction: inlet strut and first flange hole"}
envelope: {min: [-155.0, -155.0, -225.0], max: [155.0, 155.0, 262.0], tolerance: 0.5}
datum_part: case_r1
parts:
  - name: case_r1
    kind: modelled
    design: axjet-c2-case_r1
    intent: >-
      Compressor casing ring over rotor 1 in the assembly frame (origin on the engine axis at the rotor_1 leading-edge
      plane, z along the axis with the flow, x up). Ring z -18 ... 18, OD 200 between the flanges, bore D180.5 (r 90.25)
      over its full length: the 0.5 mm sprayed Al-Si/polyester abradable that lines a recess over z -2 ... 18 is
      modelled as part of this body and finished at D180.5, so the rotor_1 tips (r 90.0) run at the 0.25 mm cold
      clearance. Front flange z -18 ... -12 and rear flange z 12 ... 18 (6 thick, inferred to match the inlet_frame
      rear flange), OD 224, each with 8 x D5.5 (M5 clearance) holes on PCD 212 through the flange, one hole on +x,
      45 deg pitch (revision 1: an M5 head or nut at r 106 clears the ring wall and the rim). Interfaces: front face
      z -18 seats on the inlet_frame rear flange; rear face z 18 seats on the stator_1 front flange; the bore is the
      rotor_1 tip shroud (the two eddy-current speed and clearance probes over the rotor_1 tips are not modelled).
    material: 6061-T6
    density_kg_m3: 2700
  - name: bellmouth
    kind: modelled
    design: axjet-c2-bellmouth
    intent: >-
      Bolt-on test bellmouth lip in the assembly frame, axisymmetric about z, z -95 ... -72. Inner (flow) contour: the
      quarter-ellipse of section 9 centred at (z -45, r 125) with axial semi-axis 50 and radial semi-axis 34.75, running
      from r 95.8 at the rear face z -72 (the inlet_frame continues it to r 90.25 at z -45) to its front point r 125 at
      z -95 (radial tangent); there a 6 mm quarter-round lip centred at (z -89, r 125), tangent to the ellipse at
      (z -95, r 125) and to the outer skin at (z -89, r 131), closes the contour without a crease; the outer skin starts
      at r 131 and returns to the rear flange (inferred profile). Rear flange z -77 ... -72 (5 thick, inferred to match
      the inlet_frame front flange), OD 224, with 8 x M5 tapped blind holes from the rear face z -72 on PCD 216, one on
      +x (modelled as D4.2 tap-drill holes 10 deep); the screws enter from behind the inlet_frame flange. Interfaces:
      rear face z -72 (r 95.8 ... 112) seats on the inlet_frame front flange, and the inner contour meets the
      inlet_frame contour at r 95.8 without a step.
    material: 6061-T6
    density_kg_m3: 2700
  - name: inlet_frame
    kind: modelled
    design: axjet-c2-inlet_frame
    intent: >-
      Inlet frame with hub, struts, hub fairing and front bearing housing, one body in the assembly frame. Duct: front
      flange z -72 ... -67 (OD 224, 8 x D5.5 through holes on PCD 216, one on +x, for the M5 screws into the
      bellmouth, inserted from behind the flange; contour r 95.8 at the face); inner contour
      continuing the bellmouth quarter-ellipse (centre z -45, r 125; semi-axes 50 axial, 34.75 radial) from r 95.8 at
      z -72 to r 90.25 at z -45, then cylindrical r 90.25 to z -18; duct outer wall r 100 between the flanges
      (inferred, as the casing rings); rear flange z -24 ... -18 (OD 224, 8 x D5.5 on PCD 212, one on +x, 45 deg
      pitch) seating on case_r1 at z -18. Hub: outer surface r 32 from z -80 to -40; front bearing seat bore D52 H6
      z -75 ... -35 (modelled D52.0; bearing_front sits in it at z -72 ... -42); front wall z -80 ... -75 with a D40
      bore (inferred: clears the drum_shaft M20 nose thread and the nose nut) and 4 x M3 tapped holes on PCD 56
      (inferred) for the nose cone; behind z -35 nothing of the inlet_frame lies inside r 30 (the spinning stack nut,
      OD 56, sits at z -18 ... -8; the drum is D36 to D40 there). Fairing: a 3 mm shell rising straight from r 32 at
      z -40 to r 57.6 at z -15, then cylindrical r 57.6
      to its rear face at z -11, 3 mm ahead of the rotor_1 front face (z -8). Front seal sleeve: bore D97 (r 48.5) from
      z -21 to -11, joined to the fairing by a web ahead of z -19 (inferred), so the rotor_1 seal arm (r 44 ... 48.1,
      z -18 ... -8) runs inside it at 0.4 mm radial and at least 1 mm axial clearance. Struts: five symmetric NACA
      0020-type sections, 30 mm axial chord (z -70 ... -40), 6 mm maximum thickness, radial from the hub (r 32) into the
      duct wall, 72 deg pitch with one on +x (the +x service strut stays solid; its line passage is not modelled). The
      flow path is
      continuous with the bellmouth at z -72, the nose cone (r 32) at z -80 and case_r1 (r 90.25) at z -18.
    material: 6061-T6
    density_kg_m3: 2700
  - name: nose_cone
    kind: modelled
    design: axjet-c2-nose_cone
    intent: >-
      Nose cone in its own frame: origin on the engine axis at its rear face, which seats on the inlet_frame hub front
      face (assembly z -80); axes parallel to the assembly axes (z rearward with the flow, x up), so the cone lies at
      z <= 0. Outer surface: D64 cylinder from z 0 to -50 (assembly -80 ... -130), then a tangent ogive (arc radius
      35.14 = (32^2 + 35^2) / 64, tangent to the cylinder at z -50) to the tip at z -85 (assembly -165); 2 mm wall,
      closed at the tip. Starter bulkhead: a 3 mm plate at z -28 ... -25 (assembly -108 ... -105) across the bore with a
      D12 centre hole for the starter shaft and the motor's 4 x M3 pattern (D3.4 on PCD 30, inferred); the starter body
      (D50 x 35, assembly z -143 ... -108) bolts to its front face z -28. Rear rim: an inner lip z -3 ... 0 from r 26 to
      the wall (inferred) with 4 x D3.4 holes on PCD 56 (inferred) for the M3 screws into the hub. Interfaces: rear face
      z 0 on the hub front face; the D64 surface continues the hub's r 32 flow surface without a step; the inner wall
      stays at least 2 mm clear of the starter (r 25).
    material: 6061-T6
    density_kg_m3: 2700
  - name: rotor_1
    kind: modelled
    design: axjet-c2-rotor_1
    intent: >-
      Rotor-1 blisk in its own frame: axis +z through the origin (the spool turns positively about +z), origin on the
      axis at the blade leading-edge plane (assembly z 0), x parallel to the assembly x. 29 blades, radially stacked on
      the section centroids, no lean or sweep; hub flow surface r 57.6 from z -8 to 0 (front hub extension), then
      straight to r 61.0 at z 16; hub blade extent z 0 ... 16; flat tip at r 90.0, minimum tip thickness 0.8; root
      fillet r 1.5 kept on the hub. Sections at hub / mean / tip (r 57.6 / 73.8 / 90.0) from section 4.3, angles from
      the axial direction, positive in the direction of rotation: inlet metal 62.0 / 67.3 / 71.4 deg, camber 32.7 /
      14.0 / 7.6 deg, exit metal 29.3 / 53.3 / 63.8 deg, stagger about 45.6 / 60.3 / 67.6 deg, maximum thickness 8 / 5
      / 3.5 % of chord; chord 24 / 22 / 20 (hub solidity 1.7 to 1.8, section 4.2 item 4); circular-arc camber with
      NACA-65 thickness, LE radius 0.3, TE thickness 0.5 (step-2 section files replace these when they exist). Disc: rim
      r 50 ... 57.6 from z -8 to 16 under the front hub extension and the blade roots; web 10 thick at the bore, 6 thick
      at r 50; bore D40 H6 through z -8 ... 24 (modelled D40.0, line-to-line on the drum; the 10 um interference and the
      two D4 dowels are not modelled); front face z -8 bears on the stack nut (revision 1); seal arm r 44 ... 48.1 from z -18
      to -8 with three teeth whose tips are at D96.2, running 0.4 inside the inlet_frame seal sleeve (D97); rear face
      z 24 is a D100 spigot boss (r 20 ... 50) that carries the seal spacer. Behind z 16 nothing of rotor_1 lies outside
      r 50, so it stays 4 mm from the stator_1 inner band (front face z 20, inner surface r 58). Mass about 0.9 kg.
    material: 2618-T61
    density_kg_m3: 2760
  - name: stator_1
    kind: modelled
    design: axjet-c2-stator_1
    intent: >-
      Stator-1 vane ring with its casing ring, one body in the assembly frame. Casing: z 18 ... 58, OD 200 between the
      flanges; front flange z 18 ... 24 and rear flange z 52 ... 58 (6 thick, inferred), OD 224, 8 x D5.5 (M5
      clearance) on PCD 212, one hole on +x, as case_r1. Bore r 90.25 over z 18 ... 20 and z 38 ... 58 (over rotor 2 the 0.5 mm abradable in
      its recess, z 40 ... 58, is modelled as part of the ring and finished at r 90.25, so the rotor_2 tips run at
      0.25); outer band flow surface r 90.0 over z 20 ... 38 (band r 90.0 ... 93.5 integral with the ring). 41 vanes
      between the bands, leading edge at z 22, axial extent set by chord and stagger within z 22 ... 36, chord 15,
      radial stacking; sections at hub, mean and tip from section 4.3 (baseline, 0 deg exit flow): inlet metal 50.5 /
      43.5 / 37.9 deg, camber 61.9 / 54.5 / 48.5 deg, exit metal -11.4 / -11.0 / -10.6 deg, stagger about 19.5 / 16.3 /
      13.6 deg, maximum thickness 8 / 7 / 6 % of chord, LE radius 0.25, TE thickness 0.5. Inner band: flow surface
      r 61.0 at z 20 rising straight to r 64.5 at z 38; front face z 20 (4 mm behind the rotor_1 hub trailing edge at
      z 16); rear face z 38 (3 mm ahead of the rotor_2 front hub extension at z 41); inner surface r 58.0 carrying a
      two-tooth labyrinth (tooth tips at r 58.0) that faces the seal spacer (OD 115) at 0.5 mm radial gap; nothing of
      stator_1 lies inside r 58.0. Interfaces: front face z 18 on case_r1; rear face z 58 carries the ogv_ring.
    material: 6061-T6
    density_kg_m3: 2700
  - name: seal_spacer
    kind: modelled
    design: axjet-c2-seal_spacer
    intent: >-
      S1 seal spacer in its own frame: axis +z through the origin, origin on the axis at its front face (assembly
      z 24), x parallel to the assembly x. Plain ring OD 115 (r 57.5), ID 40 (modelled D40.0, line-to-line on the
      drum), length 14 (z 0 ... 14, assembly 24 ... 38). Front face bears on the rotor_1 rear spigot boss (D100) at
      assembly z 24; rear face carries the rotor_2 front face at assembly z 38; the OD runs 0.5 mm inside the stator_1
      inner-band labyrinth (r 58.0) and is the rotating half of that seal.
    material: 2618-T61
    density_kg_m3: 2760
  - name: rotor_2
    kind: modelled
    design: axjet-c2-rotor_2
    intent: >-
      Rotor-2 blisk in its own frame: axis +z through the origin (the spool turns positively about +z), origin on the
      axis at the blade leading-edge plane (assembly z 42), x parallel to the assembly x. 31 blades, radially stacked on
      the section centroids, no lean or sweep; hub flow surface r 64.8 at z 0 straight to r 66.5 at z 13 (assembly
      42 ... 55); front hub extension r 64.8 from z -1 to 0 (assembly 41 ... 42; inferred, 3 mm behind the stator_1
      inner band at assembly z 38); hub blade extent z 0 ... 13; flat tip at r 90.0, minimum tip thickness 0.8; root
      fillet r 1.5 kept on the hub. Sections at hub / mean / tip (r 64.8 / 77.4 / 90.0) from section 4.3: inlet metal
      66.7 / 70.1 / 73.1 deg, camber 26.3 / 13.6 / 8.5 deg, exit metal 40.4 / 56.5 / 64.6 deg, stagger about 53.6 /
      63.3 / 68.8 deg, maximum thickness 8 / 5 / 3.5 % of chord; chord 22 / 20 / 18; circular-arc camber with NACA-65
      thickness, LE radius 0.3, TE thickness 0.5. Disc in the proportions of rotor_1 (web 10 thick at the bore, 6 under
      the rim), axial extent z -4 ... 20 (assembly 38 ... 62), bore D40 H6 (modelled D40.0, line-to-line on the drum;
      dowels not modelled). Front face z -4 (assembly 38) bears on the seal spacer over r 20 ... 57.5, and nothing of
      rotor_2 lies outside r 57.5 ahead of z -1 (0.5 mm radial and 3 mm axial to the stator_1 inner band). Behind the
      hub trailing edge (z 13) the outer surface steps down to r 63.0 and continues as the rear seal sleeve OD 126 x
      ID 60, z 20 ... 28 (assembly 62 ... 70), which runs 0.5 mm inside the OGV inner-band labyrinth (r 63.5). The disc
      rear face z 20 (assembly 62) inside the sleeve bears on the drum D46 shoulder (r 20 ... 23, revision 1). Mass
      about 1.0 kg.
    material: 2618-T61
    density_kg_m3: 2760
  - name: ogv_ring
    kind: modelled
    design: axjet-c2-ogv_ring
    intent: >-
      Outlet guide vane ring with its casing ring, one body in the assembly frame. Casing: z 58 ... 80, OD 200 between
      the flanges; front flange z 58 ... 64, OD 224, 8 x D5.5 (M5 clearance) on PCD 212 (one on +x) seating on
      stator_1; rear flange z 74 ... 80, OD 224, 8 x D5.5 on PCD 212 for the diffuser of the full engine (inferred: the
      same joint as the other casing rings). Outer band flow surface r 90.0 over z 59 ... 78 (band r 90.0 ... 93.5 integral with the
      ring), bore r 90.25 over z 58 ... 59 and z 78 ... 80 (station 3). 47 vanes, single row, leading edge at z 61,
      axial extent set by chord and stagger within z 61 ... 76, chord 14, radial stacking; sections at hub, mean and tip
      from section 4.3 (baseline, 0 deg exit flow): inlet metal 53.8 / 48.9 / 44.5 deg, camber 65.3 / 60.4 / 56.0 deg,
      exit metal -11.5 deg at all three, stagger about 21.1 / 18.7 / 16.5 deg, maximum thickness 8 / 7 / 6 % of chord,
      LE radius 0.25, TE thickness 0.5 (the tandem pair and solidity-1.8 options of section 4.2 are not modelled).
      Inner band: flow surface r 66.5 from its front face z 59 (4 mm behind the rotor_2 hub trailing edge at z 55) to
      z 61, rising straight to r 67.5 at z 76, then r 67.5 to z 80; inner surface r 63.5 carrying a two-tooth labyrinth
      (tooth tips at r 63.5) that faces the rotor_2 rear seal sleeve (OD 126, z 62 ... 70) at 0.5 mm radial gap;
      nothing of the ogv_ring lies inside r 63.5. Interface: front face z 58 on stator_1.
    material: 6061-T6
    density_kg_m3: 2700
  - name: drum_shaft
    kind: modelled
    design: axjet-c2-drum_shaft
    intent: >-
      Drum shaft in its own frame: axis +z through the origin, origin on the axis at the rotor_1 leading-edge plane
      (assembly z 0), x parallel to the assembly x; z -90 ... 262. Front: M20 x 1 LH thread z -90 ... -75 (modelled as
      a plain D20) for the nose nut and starter clutch; D25 h5 front bearing journal z -75 ... -40 (modelled D25.0);
      step to a D36 neck at z -40 (the bearing inner-race spacer bears on the D25/D36 step). D36 neck z -40 ... -18 so
      the stack nut passes over it; M39 x 1.5 stack_nut thread z -18 ... -8 (modelled as a plain D39); D40 h6 seats
      (modelled D40.0) z -8 ... 62: rotor_1 z -8 ... 24, seal spacer z 24 ... 38, rotor_2 z 38 ... 62; integral
      shoulder D46 x 6 at z 62 ... 68, its front face z 62 the rotor_2 rear stop; D40 drum z 68 ... 254. Rear flange
      D60 x 8 at z 254 ... 262 with 6 x M5 tapped on PCD 50 and a D44 H7 x 2 recess in its rear face for the
      coupling-hub spigot of the full engine. Bore D28 from z -30 through the flange (inferred: the source's z -45 bore
      start would cut through the D25 journal, which ends at z -40), leaving a 4 mm wall under the D36 neck. The rotor
      stack loads from the front against the z 62 shoulder (revision 1).
    material: 17-4PH H1025
    density_kg_m3: 7800
  - name: bearing_front
    kind: modelled
    design: axjet-c2-bearing_front
    intent: >-
      Front bearing pair (2 x 25 x 52 x 15 hybrid angular-contact, Si3N4 balls, back-to-back) as one envelope ring in
      its own frame: axis +z through the origin, origin on the axis at its front face (assembly z -72), x parallel to
      the assembly x. OD 52 (line-to-line in the inlet_frame D52 H6 seat), ID 25 (line-to-line on the drum_shaft D25
      journal), length 30 (z 0 ... 30, assembly -72 ... -42), 0.5 x 45 deg chamfers on all four edges.
    material: steel
    density_kg_m3: 7800
  - name: stack_nut
    kind: modelled
    design: axjet-c2-stack_nut
    intent: >-
      Stack nut in its own frame: axis +z through the origin, origin on the axis at its front face (assembly z -18),
      x parallel to the assembly x. Ring OD 56, ID 39 (the M39 x 1.5 thread modelled as a plain D39 bore on the drum's
      plain D39 thread section), length 10 (z 0 ... 10, assembly -18 ... -8); six spanner notches in the OD at 60 deg
      pitch, one centred on +x, 6 wide x 3 deep through the length (inferred). Its rear face (assembly z -8) clamps the
      rotor_1 disc front face; the OD (r 28) stays inside the rotor_1 seal arm (r 44), and the tool enters axially from
      the front through the seal arm (revision 1).
    material: 17-4PH H1025
    density_kg_m3: 7800
  - name: starter
    kind: purchased
    catalog: {name: starter, kind: cylinder, point: [0.0, 0.0, -143.0], direction: [0.0, 0.0, 1.0], radius: 25.0, length: 35.0}
    description: >-
      1 kW-class outer-rotor brushless starter motor (D50 x 35, 22-28 V), catalog cylinder in its own frame, which is
      the assembly frame: z -143 ... -108, its rear face on the nose_cone bulkhead at z -108; the one-way needle clutch
      (z -105 ... -95) and the shaft are not modelled.
  - name: air
    kind: derived
    role: fluid
    material: air
    density_kg_m3: 1.204
    description: >-
      The whole wetted region the air walls and minus bodies bound, built in the assembly source by the evaluator's
      recipe: the padded box minus one fused tool of the walls (bellmouth, inlet_frame, nose_cone, case_r1, stator_1,
      ogv_ring, bearing_front, starter, rigPlenum, rigExit, rigExitPlug) and the minus bodies (rotor_1, seal_spacer,
      rotor_2, drum_shaft, stack_nut), clipped at the inlet cap z -220 and the outlet cap z 90, keeping the piece that
      holds the seed (0, 0, -200). It is the gas path (plenum r 150, bellmouth, inlet duct, compressor annulus, exit
      annulus r 67.5 ... 90.25 over z 80 ... 90) plus the seal pockets and labyrinth cavities connected to it; the closed
      nose cavity and the drum bore are separate pieces and not part of it.
  - name: rigPlenum
    kind: derived
    role: solid
    description: >-
      Test-cell plenum skin, rig hardware built in the assembly source, stationary, one solid revolved about z in the
      assembly frame: wall r 150 ... 155 over z -225 ... -95 plus its rear wall z -95 ... -90 over r 125 ... 155, whose
      inner edge meets the bellmouth lip at its tangent point (z -95, r 125). It bounds the r 150 plenum radially.
  - name: rigExit
    kind: derived
    role: solid
    description: >-
      Exit duct outer sleeve, rig hardware built in the assembly source, stationary, one solid in the assembly frame:
      r 90.25 ... 95 over z 80 ... 95, seated on the ogv_ring rear face at z 80; it bounds the exit annulus outside.
  - name: rigExitPlug
    kind: derived
    role: solid
    description: >-
      Exit centre body, rig hardware built in the assembly source, stationary, one solid in the assembly frame: annulus
      r 20 ... 67.5 over z 80 ... 95, seated on the OGV inner band rear face at z 80 and line-to-line on the D40 drum
      (r 20, axisymmetric there, so the spinning drum does not interfere); it bounds the exit annulus inside and closes
      the cavity behind the OGV band from the outlet plane.
parameters:
  - {name: designSpeed, value: 44000.0, unit: rpm, provenance: stated, tolerance: 1.0, source: "sources/axjet_design_and_implementation_guide.md section 1", description: "design spool speed, tip speed 415 m/s at r 90"}
  - {name: coldSpeed, value: 8000.0, unit: rpm, provenance: stated, tolerance: 1.0, source: "sources/axjet_design_and_implementation_guide.md section 14.1", description: cold MRF case speed}
  - {name: coldMassFlow, value: 0.418, unit: kg/s, provenance: stated, tolerance: 0.001, source: "sources/axjet_design_and_implementation_guide.md section 14.1", formula: "2.30 x coldSpeed / designSpeed", description: cold-case air mass flow (flow proportional to speed)}
  - {name: rotor1BladeCount, value: 29.0, unit: "", provenance: stated, tolerance: 0.1, source: "sources/axjet_design_and_implementation_guide.md section 4.1"}
  - {name: rotor1Pitch, value: 12.41, unit: deg, provenance: derived, tolerance: 0.01, formula: "360 / rotor1BladeCount", description: "one rotor_1 blade pitch, the range of the spin sweep"}
  - {name: tipRadius, value: 90.0, unit: mm, provenance: stated, tolerance: 0.01, source: "sources/axjet_design_and_implementation_guide.md section 4", description: constant compressor tip radius}
  - {name: casingBoreRadius, value: 90.25, unit: mm, provenance: stated, tolerance: 0.01, source: "sources/axjet_design_and_implementation_guide.md section 4.4 (bore D180.5)", description: finished casing bore over both rotors}
  - {name: tipClearance, value: 0.25, unit: mm, provenance: stated, tolerance: 0.01, source: "sources/axjet_design_and_implementation_guide.md sections 2.3 and 4.1", formula: "casingBoreRadius - tipRadius", description: cold compressor tip clearance}
  - {name: rotor1Station, value: 0.0, unit: mm, provenance: stated, tolerance: 0.05, source: "sources/axjet_design_and_implementation_guide.md section 14.1", description: rotor_1 own origin on the drum (assembly z)}
  - {name: sealSpacerStation, value: 24.0, unit: mm, provenance: stated, tolerance: 0.05, source: "sources/axjet_design_and_implementation_guide.md section 14.1", description: seal_spacer front face on the drum}
  - {name: rotor2Station, value: 42.0, unit: mm, provenance: stated, tolerance: 0.05, source: "sources/axjet_design_and_implementation_guide.md section 14.1", description: rotor_2 leading-edge plane on the drum}
  - {name: stackNutStation, value: -18.0, unit: mm, provenance: stated, tolerance: 0.05, source: "revision 1 reviewer notes, change 1 (approved; supersedes guide sections 8.1 and 14.1, z 62)", description: stack_nut front face on the drum}
  - {name: drumShoulderStation, value: 62.0, unit: mm, provenance: stated, tolerance: 0.05, source: "revision 1 reviewer notes, change 1 (approved)", description: front face of the drum D46 shoulder (z 62 ... 68)}
  - {name: bearingFrontStation, value: -72.0, unit: mm, provenance: stated, tolerance: 0.05, source: "sources/axjet_design_and_implementation_guide.md section 14.1", description: front bearing ring front face in the hub}
  - {name: noseConeStation, value: -80.0, unit: mm, provenance: stated, tolerance: 0.05, source: "sources/axjet_design_and_implementation_guide.md section 14.1", description: nose_cone rear face on the hub front face}
  - {name: starterFaceStation, value: -108.0, unit: mm, provenance: stated, tolerance: 0.05, source: "sources/axjet_design_and_implementation_guide.md section 8.3", description: starter rear face on the bulkhead}
  - {name: inletFlangeStation, value: -72.0, unit: mm, provenance: stated, tolerance: 0.05, source: "sources/axjet_design_and_implementation_guide.md section 2.4", description: bellmouth to inlet_frame flange plane}
  - {name: caseFrontStation, value: -18.0, unit: mm, provenance: stated, tolerance: 0.05, source: "sources/axjet_design_and_implementation_guide.md section 4.4", description: inlet_frame to case_r1 flange plane}
  - {name: caseRearStation, value: 18.0, unit: mm, provenance: stated, tolerance: 0.05, source: "sources/axjet_design_and_implementation_guide.md section 4.4", description: case_r1 to stator_1 flange plane}
  - {name: ogvFrontStation, value: 58.0, unit: mm, provenance: stated, tolerance: 0.05, source: "sources/axjet_design_and_implementation_guide.md section 4.4", description: stator_1 to ogv_ring flange plane}
  - {name: rowGap1, value: 4.0, unit: mm, provenance: derived, tolerance: 0.05, formula: "20 - 16 (stator_1 inner band front face minus rotor_1 hub trailing edge)", description: rotor_1 to stator_1 axial row gap}
  - {name: rowGap2, value: 4.0, unit: mm, provenance: inferred, tolerance: 0.05, formula: "59 - 55 (OGV inner band front face minus rotor_2 hub trailing edge)", rationale: "the source gives the OGV ring z 58 ... 80 and vanes z 61 ... 76 but not the inner band front face; 4 mm mirrors rowGap1", description: rotor_2 to OGV axial row gap}
  - {name: plenumRadius, value: 150.0, unit: mm, provenance: stated, tolerance: 0.05, source: "sources/axjet_design_and_implementation_guide.md section 14.1", description: air plenum radius (inlet disc D300)}
