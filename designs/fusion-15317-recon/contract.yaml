schema_version: 1
name: fusion-15317-recon
intent: >-
  Reconstruct the mechanical part shown in the attached renders, sections and dimension sheet
  as editable, parameterized KCL in the part's own frame (bbox min [-44.45, 92.804, -44.45],
  size [88.9, 32.544, 88.9] mm). The part is Fusion Gallery body 22337_e2f65ed2_0003_1
  (joint set joint_set_15317): a Ø88.9 flange disk with a through U-slot and two stepped
  arm bores, on a Ø50.8 hub with a revolved waist. Declare every hole, boss and shaft as an
  acceptance cylinder and every planar face level as a named face; one solid; export STEP
  and STL. Held-out: the pipeline is frozen, the reference CAD is evaluator-only.
units:
  length: mm
  angle: deg
material: null
density_kg_m3: null
process: null
release_status: reconstruction
frame:
  origin: >-
    Native reference-model origin [0,0,0] on the common Y axis of the hub and flange
    cylinders. This origin is not on the solid: the hub bottom is at y = 92.804. Do not
    rebase the bounding-box minimum to the origin.
  axes:
    x: >-
      Perpendicular to the hub axis, toward the +X arm (positive bbox x). front.png plots
      x horizontally; the U-slot walls sit at x = ±19.844.
    y: >-
      Along the hub and flange axis, from the hub toward the slotted +Y face. Hub bottom
      y = 92.804, flange underside y = 106.298, arm tops y = 125.348.
    z: >-
      Completes a right-handed frame in the disk plane. front.png plots z vertically; the
      +Z rim is the top of that view. The two small rim holes both sit at x = -5.077.
  datums:
    - name: A
      description: Hub bottom face y = 92.804, outward normal -y, area 2026.83 mm2 (the Ø50.8 end).
    - name: B
      description: Hub and flange axis, the Y axis through [0, 0, 0].
    - name: C
      description: U-slot midplane x = 0, halfway between the slot walls at x = ±19.844.
envelope:
  min: [-44.45, 92.804, -44.45]
  max: [44.45, 125.348, 44.45]
  tolerance: 0.05

parameters:
  - name: flangeDia
    value: 88.9
    unit: mm
    provenance: stated
    source: sources/dimension-sheet.md
    tolerance: 0.02
    description: Flange outer diameter; equals the x and z envelope extents.
  - name: hubDia
    value: 50.8
    unit: mm
    provenance: stated
    source: sources/dimension-sheet.md
    tolerance: 0.02
    description: Hub outer diameter on the cylindrical end and on the groove-shoulder OD.
  - name: hubYMin
    value: 92.804
    unit: mm
    provenance: stated
    source: sources/dimension-sheet.md
    tolerance: 0.02
    description: Hub bottom plane (datum A). Decreasing this value lengthens the hub in -Y.
    edit_test:
      delta: -2
      expect:
        volume_delta: 4053.66
        direction: increase
        bbox_delta: [0, 2, 0]
        tolerance_rel: 0.02
      infeasible_deltas: [14]
  - name: flangeYMin
    value: 106.298
    unit: mm
    provenance: stated
    source: sources/dimension-sheet.md
    tolerance: 0.02
    description: Flange underside and hub-to-flange junction plane.
  - name: flangeYMax
    value: 125.348
    unit: mm
    provenance: stated
    source: sources/dimension-sheet.md
    tolerance: 0.02
    description: Arm-top plane. Increasing this value thickens the flange in +Y.
    edit_test:
      delta: 2
      expect:
        volume_delta: 5599.76
        direction: increase
        bbox_delta: [0, 2, 0]
        tolerance_rel: 0.02
      sweep:
        min: 123.348
        max: 127.348
        steps: 3
  - name: slotY
    value: 112.648
    unit: mm
    provenance: stated
    source: sources/dimension-sheet.md
    tolerance: 0.02
    description: U-slot floor (+y face). Decreasing this value cuts the slot deeper.
    edit_test:
      delta: -1
      expect:
        volume_delta: -3407.28
        direction: decrease
        bbox_delta: [0, 0, 0]
        tolerance_rel: 0.02
      infeasible_deltas: [-7]
  - name: slotHalf
    value: 19.844
    unit: mm
    provenance: stated
    source: sources/dimension-sheet.md
    tolerance: 0.02
    description: Half-width of the U-slot; walls at x = ±slotHalf.
  - name: grooveY
    value: 103.917
    unit: mm
    provenance: stated
    source: sources/dimension-sheet.md
    tolerance: 0.02
    description: Planar -y shoulder of the hub waist, an annulus on the hub OD.
  - name: grooveFaceArea
    value: 414.95
    unit: mm
    provenance: stated
    source: sources/dimension-sheet.md
    tolerance: 0.5
    description: Area of the single planar face at y = grooveY (used to recover the inner radius).
  - name: holeMajorDia
    value: 11.113
    unit: mm
    provenance: stated
    source: sources/dimension-sheet.md
    tolerance: 0.02
    description: Larger coaxial diameter of each arm bore.
  - name: holeMinorDia
    value: 7.938
    unit: mm
    provenance: stated
    source: sources/dimension-sheet.md
    tolerance: 0.02
    description: Smaller coaxial diameter of each arm bore.
  - name: holeY
    value: 118.204
    unit: mm
    provenance: stated
    source: sources/dimension-sheet.md
    tolerance: 0.05
    description: Y of the −Z major bore and both minor bores.
  - name: holeZ
    value: 19.05
    unit: mm
    provenance: stated
    source: sources/dimension-sheet.md
    tolerance: 0.05
    description: "Absolute z of the minor bores and the -Z major bore."
  - name: holeMajorPosY
    value: 118.139
    unit: mm
    provenance: stated
    source: sources/dimension-sheet.md
    tolerance: 0.05
    description: Y of the +Z Ø11.113 axis; 0.065 mm from holeY.
  - name: holeMajorPosZ
    value: 18.923
    unit: mm
    provenance: stated
    source: sources/dimension-sheet.md
    tolerance: 0.05
    description: Z of the +Z Ø11.113 axis; 0.127 mm from holeZ.
  - name: rimHoleDia
    value: 2.261
    unit: mm
    provenance: stated
    source: sources/dimension-sheet.md
    tolerance: 0.02
    description: Diameter of the two short rim holes.
  - name: rimHoleY
    value: 109.594
    unit: mm
    provenance: stated
    source: sources/dimension-sheet.md
    tolerance: 0.05
    description: Y of both rim-hole axes (in the flange web).
  - name: rimHoleX
    value: -5.077
    unit: mm
    provenance: stated
    source: sources/dimension-sheet.md
    tolerance: 0.05
    description: X of both rim-hole axis stations; both holes are clocked toward -X.
  - name: rimHoleZ
    value: 39.746
    unit: mm
    provenance: stated
    source: sources/dimension-sheet.md
    tolerance: 0.05
    description: "Absolute z of the rim-hole centres of extent."
  - name: rimHoleLen
    value: 8.763
    unit: mm
    provenance: stated
    source: sources/dimension-sheet.md
    tolerance: 0.05
    description: Axial length of each rim hole from the Ø88.9 skin inward.
  - name: xFace
    value: 36.512
    unit: mm
    provenance: stated
    source: sources/dimension-sheet.md
    tolerance: 0.02
    description: "Absolute x of the four small planar faces at the arm-bore (y,z) stations."
  - name: hubNeckRadius
    value: 21.1
    unit: mm
    provenance: measured
    source: sources/section-z0.png
    tolerance: 0.4
    description: Minimum hub radius on the revolved waist (section-z0 outline).
  - name: hubNeckY
    value: 102.2
    unit: mm
    provenance: measured
    source: sources/section-z0.png
    tolerance: 0.4
    description: Y of the waist minimum radius.
  - name: hubWaistY
    value: 94.5
    unit: mm
    provenance: measured
    source: sources/section-z0.png
    tolerance: 0.5
    description: Y where the waist profile meets the hub OD again, above the short cylindrical end.
  - name: flangeRadius
    value: 44.45
    unit: mm
    provenance: derived
    formula: flangeDia / 2
    tolerance: 0.02
    description: Flange outer radius; envelope |x| and |z|.
  - name: hubRadius
    value: 25.4
    unit: mm
    provenance: derived
    formula: hubDia / 2
    tolerance: 0.02
    description: Hub outer radius.
  - name: flangeThick
    value: 19.05
    unit: mm
    provenance: derived
    formula: flangeYMax - flangeYMin
    tolerance: 0.02
    description: Flange axial length; matches the Ø88.9 pin length on the sheet.
  - name: hubLen
    value: 13.494
    unit: mm
    provenance: derived
    formula: flangeYMin - hubYMin
    tolerance: 0.02
    description: Hub axial length including the waist; matches the Ø50.8 pin length.
  - name: slotDepth
    value: 12.7
    unit: mm
    provenance: derived
    formula: flangeYMax - slotY
    tolerance: 0.02
    description: U-slot depth from the arm tops.
  - name: slotWidth
    value: 39.688
    unit: mm
    provenance: derived
    formula: 2 * slotHalf
    tolerance: 0.02
    description: Full U-slot width between the x = ±slotHalf walls.
  - name: overallY
    value: 32.544
    unit: mm
    provenance: derived
    formula: flangeYMax - hubYMin
    tolerance: 0.02
    description: Envelope y size.
  - name: grooveInnerRadius
    value: 22.651
    unit: mm
    provenance: derived
    formula: sqrt(hubRadius * hubRadius - grooveFaceArea / pi)
    tolerance: 0.05
    description: Inner radius of the grooveY annulus, assuming a full 360 deg ring on the hub.

features:
  - id: hub
    kind: revolve
    description: Ø50.8 hub from hubYMin to flangeYMin, with a short cylindrical end then a revolved waist.
    parameters: [hubDia, hubRadius, hubYMin, flangeYMin, hubLen, hubNeckRadius, hubNeckY, hubWaistY, grooveY, grooveInnerRadius]
    verify:
      - method: bbox
      - method: solid
        points: [[0, 98.0, 0]]
        note: Inside the remaining hub core, more than 5 mm from the waist and the end face.
      - method: face
        face: hubBottom
      - method: cylinder
        cylinder: hubOd
      - method: dimension
        dimension: dimHubLen
  - id: flange
    kind: extrude
    description: Ø88.9 disk from flangeYMin to flangeYMax.
    parameters: [flangeDia, flangeRadius, flangeYMin, flangeYMax, flangeThick]
    verify:
      - method: bbox
      - method: solid
        points: [[0, 109.4, 0]]
        note: Flange web below the slot floor, on the Y axis, away from the rim holes.
      - method: face
        face: flangeBottom
      - method: cylinder
        cylinder: flangeOd
      - method: dimension
        dimension: dimFlangeThick
      - method: section
        section: secYWeb
  - id: u_slot
    kind: pocket
    description: Through U-slot, walls at x = ±slotHalf, floor at slotY, open at flangeYMax and through z.
    parameters: [slotY, slotHalf, slotWidth, slotDepth, flangeYMax, flangeRadius]
    verify:
      - method: void
        points: [[0, 119.0, 0]]
        note: Mid-slot air, 6 mm above the floor and 19.8 mm from each wall.
      - method: face
        face: slotFloor
      - method: face
        face: slotWallNegX
      - method: face
        face: slotWallPosX
      - method: face
        face: armTopPosX
      - method: face
        face: armTopNegX
      - method: section
        section: secZ0
      - method: dimension
        dimension: dimSlotWidth
      - method: dimension
        dimension: dimSlotDepth
  - id: hub_waist
    kind: revolve
    description: >-
      Revolved concave waist on the hub. Planar -y shoulder at grooveY (annulus to grooveInnerRadius);
      profile dips to hubNeckRadius at hubNeckY and meets the hub OD again at hubWaistY. Revolve the
      section-z0 silhouette; it is not a single circular fillet.
    parameters: [grooveY, grooveInnerRadius, grooveFaceArea, hubNeckRadius, hubNeckY, hubWaistY, hubRadius]
    verify:
      - method: void
        points: [[23.5, 102.2, 0]]
        note: In the waist cut, 2.4 mm outside the measured neck and 1.9 mm inside the hub OD.
      - method: solid
        points: [[0, 98.0, 0]]
      - method: face
        face: grooveShoulder
      - method: section
        section: secX0
      - method: section
        section: secZ0
  - id: arm_bores
    kind: hole
    count: 2
    description: >-
      Two stepped through-bores along X, one at +Z and one at -Z. Each has a Ø11.113 cylinder and a
      coaxial Ø7.938 cylinder. Four small planar faces at x = ±xFace sit at the bore stations.
    parameters: [holeMajorDia, holeMinorDia, holeY, holeZ, holeMajorPosY, holeMajorPosZ, xFace]
    verify:
      - method: void
        points:
          - [30.0, 118.2, 19.05]
          - [30.0, 118.2, -19.05]
          - [-30.0, 118.2, 19.05]
          - [-30.0, 118.2, -19.05]
        note: On the minor-bore axes inside each arm, 10 mm from the slot wall.
      - method: cylinder
        cylinder: holeMajorPosZ
      - method: cylinder
        cylinder: holeMajorNegZ
      - method: cylinder
        cylinder: holeMinorPosZ
      - method: cylinder
        cylinder: holeMinorNegZ
      - method: face
        face: boreShoulderNegXPosZ
      - method: face
        face: boreShoulderNegXNegZ
      - method: face
        face: boreShoulderPosXNegZ
      - method: face
        face: boreShoulderPosXPosZ
  - id: rim_holes
    kind: hole
    count: 2
    description: Two short Ø2.261 holes drilled from the flange OD toward the Y axis, both clocked at x = -5.077.
    parameters: [rimHoleDia, rimHoleY, rimHoleX, rimHoleZ, rimHoleLen]
    verify:
      - method: void
        points:
          - [-5.077, 109.594, 39.746]
          - [-5.077, 109.594, -39.746]
        note: Sheet centres of extent, on each rim-hole axis.
      - method: cylinder
        cylinder: rimHolePosZ
      - method: cylinder
        cylinder: rimHoleNegZ
      - method: section
        section: secYWeb
      - method: count
        section: secYWeb
        count: 1

interfaces:
  - name: hubSeat
    description: Hub end face and hub OD; the seating cylinder and datum A.
    must_not_change: true
    checks: [hubBottom, hubOd, dimHubLen]
  - name: flangeOd
    description: Flange outer cylinder and envelope x/z.
    must_not_change: true
    checks: [flangeOd, bboxX, bboxZ]
  - name: slot
    description: U-slot walls, floor and arm tops.
    must_not_change: true
    checks: [slotFloor, slotWallNegX, slotWallPosX, armTopPosX, armTopNegX, dimSlotWidth, dimSlotDepth]
  - name: armBores
    description: Stepped X-axis bores through the arms.
    must_not_change: true
    checks: [holeMajorPosZ, holeMajorNegZ, holeMinorPosZ, holeMinorNegZ]
  - name: rimHoles
    description: Short radial rim holes in the flange web.
    must_not_change: true
    checks: [rimHolePosZ, rimHoleNegZ]

acceptance:
  volume:
    expected: 93854.25
    tolerance_rel: 0.002
    provenance: stated
    note: sources/dimension-sheet.md envelope and mass properties. Not a closed construction formula because the hub waist is a measured revolve.
  surface_area:
    expected: 23161.97
    tolerance_rel: 0.01
    provenance: stated
    note: sources/dimension-sheet.md; waist and bore-step edges dominate the uncertainty.
  center_of_mass:
    expected: [0.004, 110.098, -0.001]
    tolerance: 0.1
    provenance: stated
    note: sources/dimension-sheet.md. The +x offset matches the two rim holes both sitting at x = -5.077.
  solid_count: 1
  sections:
    - id: secX0
      plane: x
      at: 0.0
      expect:
        area: 1201.08
        loops: 1
        holes: 0
        area_tolerance_rel: 0.01
      description: Through the slot midplane; hub waist plus the flange web under the slot (19.84 x 88.9 bbox).
    - id: secYWeb
      plane: y
      at: 109.076
      expect:
        area: 6171.07
        loops: 1
        holes: 0
        area_tolerance_rel: 0.01
      description: Through the flange web; full Ø88.9 disk minus the two rim-hole notches.
    - id: secZ0
      plane: z
      at: 0.0
      expect:
        area: 1826.08
        loops: 1
        holes: 0
        area_tolerance_rel: 0.01
      description: Through the Y axis; U-slot profile and hub waist, missing the arm bores at z = ±19.
  faces:
