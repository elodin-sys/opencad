open_questions:
  - >-
    Hub waist generating curve: section-z0 outline is not a single circular fillet
    (algebraic fit R ≈ 8.0 mm about (r,y) ≈ (29.65, 102.21) has 0.36 mm rms residual).
    Construct by revolving the section-z0 / section-x0 silhouette. Neck radius 21.1 mm at
    y ≈ 102.2 and return to the hub OD at y ≈ 94.5 are pixel-measured (±0.4 mm).
  - >-
    The +Z Ø11.113 axis is at [0, 118.139, 18.923] while the +Z Ø7.938 is at
    [0, 118.204, 19.05] (0.14 mm). The −Z pair is coaxial. Treat as a stepped bore; the
    offset may be reference-tessellation noise.
  - >-
    Four planar faces at x = ±36.512 (25.73 mm2 each) sit at the bore (y,z) centroids.
    36.512 = 44.45 − 7.938. They may be counterbore shoulders or clipped step faces; the
    axial profile between Ø11.113 and Ø7.938 is not drawn.
  - >-
    Both rim holes are clocked at x = −5.077 (azimuth about 7.3 deg off ±Z toward −X).
    No source states a design angle; the sheet values and the COM x = 0.004 are the evidence.
  - Material, density and manufacturing process are unspecified.
  - No reference mesh is in the bundle (held-out); acceptance.deviation is unset.
