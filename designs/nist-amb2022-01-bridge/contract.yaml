acceptance:
  bbox_tolerance: 0.02
  volume:
    expected: 3678.1
    tolerance_rel: 0.003
    provenance: derived
    note: 'Nominal ideal geometry, conditional on the two inferred track widths. Define A=bodyWidth*(overallLength-noseLength/2),
      G=gapWidth*(legStraightHeight+overhangRise/2), T=singleWallCount*singleWallWidth+doubleWallCount*doubleWallWidth,
      Vb=A*bodyHeight, Vg=bodyWidth*G (one gap), Vt=tabCount*tabWidth*bodyWidth*tabHeight, Vc=cavityLength*cavityWidth*thinWallHeight,
      and Vw=cavityLength*thinWallHeight*T. V=Vb-legCount*Vg+Vt-Vc+Vw=4425-720+27.5-64+9.6=3678.1 mm^3.

      Center-of-mass formulas are recorded here because the schema''s center_of_mass type has no note field. Let
      a_j be the gap starts listed in interLegGaps. xb=(bodyWidth*overallLength^2/2-bodyWidth*noseLength^2/6)/A;
      dxg=gapWidth*(legStraightHeight/2+overhangRise/3)/(legStraightHeight+overhangRise/2); zg=(legStraightHeight^2+legStraightHeight*overhangRise+overhangRise^2/3)/(2*(legStraightHeight+overhangRise/2));
      xt=firstTabX+(tabCount-1)*tabPitch/2+tabWidth/2; xc=cavityStartX+cavityLength/2; zc=baseThickness+thinWallHeight/2.
      Mx=Vb*xb-Vg*sum(a_j+dxg)+Vt*xt-(Vc-Vw)*xc. My=(Vb-legCount*Vg+Vt-Vc)*bodyWidth/2+cavityLength*thinWallHeight*(singleWallWidth*(singleWall1Y+singleWall2Y)+doubleWallWidth*(doubleWall1Y+doubleWall2Y)).
      Mz=Vb*bodyHeight/2-legCount*Vg*zg+Vt*(bodyHeight+tabHeight/2)-(Vc-Vw)*zc. COM=[Mx,My,Mz]/V. Nominal first
      moments are [135794.55,9196.21,24543.675] mm^4. The small +y offset follows the measured alternating-wall
      placement; do not force symmetry.'
  surface_area:
    expected: 3384.458441227
    tolerance_rel: 0.005
    provenance: derived
    note: Includes all external faces and all five sealed-pocket boundaries. A and G as in volume.note; P=2*(overallLength-noseLength)+bodyWidth+2*sqrt(noseLength^2+(bodyWidth/2)^2).
      External S=2*A+bodyHeight*P+legCount*(-gapWidth*bodyWidth-2*G+bodyWidth*(2*legStraightHeight+overhangRise+sqrt(gapWidth^2+overhangRise^2)))+2*tabCount*(tabWidth+bodyWidth)*tabHeight=3170.058441227
      mm^2. Let C=cavityLength, D=cavityWidth, J=thinWallHeight and T as in volume.note. Internal S=2*((C+J)*(D-T)+(thinWallCount+1)*C*J)=214.4
      mm^2. Total=3384.458441227 mm^2. Each partition spans both cavity ends and touches floor and ceiling; touching
      interfaces are not counted as exposed faces.
