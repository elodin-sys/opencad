open_questions:
- What are the nominal finished CAD widths of the single-track and double-track internal walls? They are not dimensioned.
  Pending documentation, singleWallWidth=0.10 mm (tolerance 0.075 mm) and doubleWallWidth=0.20 mm (tolerance 0.15
  mm) are inferred rectangular merged-wall equivalents; laser spot diameter does not establish wall thickness.
- Can NIST provide the exact transverse centerlines and end-junction profiles of the four L10 walls? Figure 4 gives
  approximate +y order single, double, single, double at y=1.30, 2.05, 2.90, 3.65 mm (each tolerance 0.15 mm). The
  scan schematic does not fix finished bead or junction profiles.
- Which alloy and density apply to this individual artifact if a mass result is required? The supplied geometry
  excerpt gives neither; material and density remain null.
