open_questions:
  - "Silicone density is not in the sources (typical 50 A silicone 1100-1200 kg/m3); density_kg_m3 is left null, so no mass claim."
  - "The tube is modelled uncompressed; roller occlusion, tube stretch over the rollers and the clamp squeeze are not represented."
  - "Bore patency has no void probe or passage: the 0.5 mm bore radius cannot host a point 1 mm from its wall. It is pinned by the midPlane section (2 separate strips), the legs and apex section holes, and the bore cylinders."
  - "Leg length 30 mm and the straight exit along -x are taken from the intent; the real tube runs on past the clamp to fittings that are not modelled."
  - "A drafting check sliced the stator STEP normal to its file y axis at y = 1.2, 2.1, 3.0 cm about (x, z) = (-2.05, -2.05) cm: the track vertices lie at r = 12.14-12.15 mm (x10), 0.02-0.03 mm inside the stated 12.17 (outside the 0.01 tolerance). The stated value is kept; the assembly may show a <= 0.03 mm tube/track overlap unless the track differs at the tube's mid-plane height."
