open_questions:
- "Changed (revision 1, reviewer notes): Amendment 6 corrects heatsinkToCover.min_gap from 3 to 2.5 mm and documents the designed 2.68 mm skirt gap fixed by proposal sections 4.2/4.3, consistent with the reviewer-reported OpenCascade minimum of 2.680 mm. The 3 mm entry was a drafting error; fanPlenum remains the airflow requirement at >=4 mm."
- 'Changed (revision 1, reviewer notes): Amendment 5 aligns vtxMount intent to z203.5..212 (8.5 mm). The unchanged
  R4 boss on the verified screw axis207.5 sets the bottom203.5, and plate top212 sets the top. The original
  extent shift+3 differed from the screw shift+3.5; pack end201 needs no material below203.5, so the revised
  bottom adds clearance without moving any feature or interface.'
- 'Changed (revision 1, reviewer notes): Corrected skirtBandClear outer bound from29.3 to29.2 and specified the
  lips-only exception to resolve the groove back-wall conflict; reviewer notes supersede proposal section8.4. Mandatory
  skirtBandClear: both mirrored bands abs(x)26.4..29.2,y14.8..22.2,z22..202 contain no shell or sled material except
  the two shell groove lips at abs(x)28..29.2,y14.8..16 and20..22.2. The outer bound is the groove back face at
  abs(x)29.2; tongue outer face29.1 retains0.1 clearance. No shell material above y15 past z202.'
- 'Changed (revision 1, reviewer notes): Replaced the unspecified shell screw head diameter/depth with the selected
  hardware and countersink dimensions to resolve the flank-fastener drafting question. ISO 10642 M3 x 8, head D6.0
  nominal, D6.72 max,90deg. Each flank hole has a90deg countersink D6.4 at the outer skin surface, depth1.5 to the
  D3.4 clearance bore through the3.6 skin and pad; heads sit flush to0.1 below the surface.'
- 'Draft geometry is unbuilt: exported STEP, section/probe/face checks, all paired clearances, camera sweep, source
  acceptance and independent service/passage checks remain to be verified; assembly check validates schema and links
  only.'
- AssemblyAcceptance has no rigid-body removal transform, local forbidden-region, axis-coaxiality, normal-wall,
  passage or dihedral test field. Keep installed joints rigid; shellSlide(+z0..250), coverSlide(+z0..180), skirtBandClear,
  grilleTop, propTipToBody, shellScrewsCoaxial, noseSmooth and apertureUnchanged are mandatory downstream independent
  OpenCascade checks specified in the brief and part intents, not certified by the camSweep evaluator.
- Nominal12mm F-F standoffs from rearMount underside-7.2 end at-19.2, while unchanged v1 PCB top/ESC joint is-19.0.
  Resolve the0.2mm seating datum and hardware engagement without silently moving ESC or changing reused geometry;
  source ESC total-thickness/proxy ambiguities also remain.
- 'Aleph4mm M2.5 male-female standoffs are the assumed hardware: confirm body diameter5, material brass/aluminium,
  thread lengths and matching male-female base-to-carrier posts. Choose tapped D2.5 wall holes or short inserts
  before manufacture; fallback M2.5x18 counterbored fastening is not the default.'
- Strap slot width/length and strap stock, XT60 exact retention/pocket clearances, wire insulation diameters, simultaneous
  two10AWG plus8-pin harness routing/bend radii and strain relief are unspecified. Preserve stated envelopes/stations
  and verify D27-power-bay-keel-channel-alcove routes with actual hardware.
- Countersunk screw catalog cylinders represent shank/axis only; actual M3x4 heat-set insert fit needs hardware
  confirmation and the specified ISO 10642 M3 x 8 head seating needs local90deg countersink/flushness checks. The
  nominal0.4 pad gap and4mm engagement must be checked under clamping, not inferred from the cylinder.
- 'Brow continuation249.3..256.7 has no separate new width law: preserve Sprite aperture/brow source features with
  C ending7.8 at256.7; do not extrapolate W beyond249.3. Verify a smooth local join while retaining0.1 aperture
  and hinge tolerances.'
- Rear-cover tab translated-11.05 gives exact span9.45..28.95 and inherited bore25.45, versus nominal rear screw25.5;
  retain both within0.1 axis tolerance. VTX seed translated+13 yields old insert207.0, so the modified bore must
  independently move to207.5; verify neck/boss seating against normal-offset crown.
- Shell mounts no main payload means sled carries Aleph, pack and XT60; staging explicitly retains nose servo/VTX
  and closure mounts on shell. Service sweep moves shell and attached nose hardware together with cover/screws removed;
  cover sweep moves only cover. Verify no group collision with loaded fixed sled and tail, including hardware absent
  from envelope models.
- Motor and prop SKU, motorBoltPattern interpretation and hardware, physical camera/servo/VTX envelopes and exact
  bent-wire linkage remain unqualified. Preserve v1 camera mounts,0..90deg range and1:1 camBody coupling;10rpm is
  only inherited animation default. D127 prop circles at(+/-80,+/-80),z47..59 are independent construction checks,
  not physical prop models.
- 'Exact filament PETG or ASA for sled/shell/cover, densities, print orientation/supports, tolerances and insert
  pullout strength are not qualified; reused mounts retain source PLA defaults. No all-up mass/CG gate: proposal258g
  prints,890g all-up and z87 CG are planning estimates; missing motors/wiring and conservative envelope solids preclude
  physical mass inference.'
- Optional regulator choice, actual pack dimensions including straps/leads, net grille open area and cooling, direct6S
  transient/startup/load qualification and installed propulsion performance remain open. Baseline22.2/25.2V,28V
  limit,18V and60W planning allowance are context only; its7-inch propulsion,2200mAh pack and legacy FC recommendations
  are superseded. No simulation, heat load or fluid-domain result is invented.
