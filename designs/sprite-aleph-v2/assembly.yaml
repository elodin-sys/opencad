schema_version: 1
kind: assembly
name: sprite-aleph-v2
intent: 'sprite-aleph-v2: a second variant of the Sprite tail-sitter FPV drone carrying the Aleph compute stack,
  rebuilt around a mounting sled. A printed sled bolts to the carbon X frame on its four clamp axes and carries
  everything: the Aleph on edge against a 4 mm starboard wall through four metal standoffs, right over the frame
  (z 19..107), and the 6S pack flat in a tray forward of it (z 120..201). The shell is an open-bottom 60 x 75 sleeve
  that slides down over the loaded sled and fixes with four flush countersunk M3 through its flanks into inserts
  in sled pads; it mounts no payload. The cover slides on from the nose in the Sprite''s tongue-and-groove (groove
  y 16..20, z 22..202) with the skirt band y 15..22 kept clear; the Aleph''s heatsink grille stops at y 14. The
  nose is one smooth taper: keel rising from z 125, crown descending from 185, width tapering from 202, cubic Hermite
  laws tangent to the unchanged Sprite camera aperture (shell tip 249.3, cover brow 256.7), sections morphing to
  half-ellipses by 225. The tail (rear shell, ESC placement and slots, rear mount, launch pad) and the carbon frame
  are v1 as built. 5 in props, PETG or ASA for the sled, shell and cover, every printed part fits a Bambu X1C. All
  numbers are in sprite-aleph-v2-proposal.md (iteration 2) and the staging notes.'
units:
  length: mm
  angle: deg
frame:
  origin: centre of the carbon mainFrame top face, z = 0, on the fuselage axis x = y = 0; the Sprite assembly frame
  axes:
    x: lateral, positive to starboard
    y: toward the top cover
    z: along the fuselage from the carbon plate top face toward the nose; nose up in hover
  datums:
  - name: A
    description: Carbon frame top face z = 0; sled base bottom seats here; all new skins use this same origin.
  - name: B
    description: frame plate bottom face z = -6; the rear mount and rear shell seat here
  - name: C
    description: fuselage axis x = y = 0
envelope:
  min:
  - -94.0
  - -94.0
  - -100.0
  max:
  - 94.0
  - 94.0
  - 256.7
  tolerance: 0.5
datum_part: mainFrame
parts:
- name: mainFrame
  kind: modelled
  design: sprite-aleph-v2-main-frame
  material: carbon fibre plate
  intent: 'Reuse sources/sprite-aleph-main-frame-main.py VERBATIM with every acceptance requirement from sources/sprite-aleph-main-frame-contract.yaml
    and its brief, in its unchanged own source frame. No geometry edits or new holes. The following inherited v1/Sprite
    feature description describes already-built geometry, not instructions to repeat modifications: Carbon X frame
    plate of the Sprite Aleph FPV drone (Build Guide step 1: the four motors bolt to the carbon frame), body mainFrame
    of the sprite-aleph assembly, in its own frame = the source frame of 013_Main Frame.stl (reference ingest, identity
    transform, datum keep), which is the assembly frame. A 6 mm plate at z = -6..0 whose outline reaches x, y =
    +-93.49 with four 12 mm arms on the diagonals; mesh volume 43060 mm3. Reproduced from the mesh: the 27 mm centre
    opening, the M3 centre bolt pattern (30 x 30 square, 3.1 mm holes) that clamps main shell, plate and rear mount
    with M3x30 screws (step 2), the two D-shaped slots beside the centre opening, and at each arm tip the motor
    hole pattern (6 mm centre hole plus four radial 3.1 mm slots for 16-19 mm motor bolt circles), the motor axes
    being x = +-80, y = +-80 (the main shell nacelle rings are centred there). Interfaces: top face z = 0 carries
    the main shell floor; bottom face z = -6 carries the rear mount and rear shell rims; each arm tip carries a
    motor cover. Authoritative: 013_Main Frame.stl and its reference ingest; the Assembly Guide is illustrative.
    Reuse sources/sprite-drone-main-frame-main.py verbatim except adding editable motorBoltPattern, default 12 mm
    square slot pattern, before carbon cutting. Preserve default geometry, measured slot lengths and width, all
    source features, interfaces and whole-part acceptance. This is cut carbon, not a printed frame. Parameter record:
    plateThickness=6.0 mm (tolerance 0.01); bodyHalfWidth=25.0 mm (tolerance 0.02); bodyHalfLength=37.5 mm (tolerance
    0.02); bodyEndRadius=25.0 mm (tolerance 0.1); bodyEndCentreY=12.5 mm (tolerance 0.1); centreHoleDiameter=27.0
    mm (tolerance 0.05); centreBoltSpacing=30.0 mm (tolerance 0.02); centreBoltDiameter=3.1 mm (tolerance 0.02);
