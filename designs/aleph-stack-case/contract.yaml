schema_version: 1
name: aleph-stack-case
intent: create a case enclosure for a full aleph stack, allowing for the heat sink to extend outside the top to
  allow airflow, and making sure to have openings for the J4, J5, J7, UARTs, the molex power port, eth gadget USB-C,
  and RPI debugger USB-C ports. This will be 3D printing in PETG, so make sure it has enough thickness for strength.
  Make sure the stack secures to the case via the top standoff screw holes.
units:
  length: mm
  angle: deg
material: PETG
process: FDM / FFF 3D printing; two fixed printed bodies in one PartContract
release_status: prototype
frame:
  origin: 'Use the aleph-stack assembly origin: the intersection of the unrounded minimum-x and minimum-y base-board
    outline edges on the base PCB bottom plane z=0. It is a virtual datum inside the case, not the printed case
    minimum corner. Do not recenter exported case bodies.'
  axes:
    x: Along the 88.0 mm base edge toward x=88 and the Molex power overhang at +x.
    y: Along the 52.5 mm base edge toward the J4/J5/J7 GH row at +y.
    z: Normal to the boards toward the carrier, module and heatsink/fan.
  datums:
  - name: A
    description: Base PCB underside z=0; the four bottom-cover pad top faces lie on this plane.
  - name: B
    description: Vertical common board/standoff axis at x=3,y=3; the other axes are (85,3),(85,49.5),(3,49.5).
  - name: C
    description: Virtual base outline planes x=0 and y=0; carrier outline coincides with them, and its lower face
      is z=11.56.
  - name: D
    description: Carrier top face z=13.13; proposed 14 mm roof spacers extend from here to roof underside z=27.13.
envelope:
  min: [-5.2, -7.7, -6.67]
  max: [94.51, 57.7, 30.33]
  tolerance: 0.5
parameters:
- name: boardLength
  value: 88.0
  unit: mm
  provenance: stated
  tolerance: 0.3
  description: Both board outlines along x.
  source: sources/assembly.yaml; sources/connector-index.md (text extract, assembly frame)
- name: boardWidth
  value: 52.5
  unit: mm
  provenance: stated
  tolerance: 0.3
  description: Both board outlines along y.
  source: sources/assembly.yaml; sources/connector-index.md (text extract, assembly frame)
- name: stackMinX
  value: 0.0
  unit: mm
  provenance: stated
  tolerance: 0.3
  description: Minimum hardware x in the supplied assembly envelope.
  source: sources/assembly.yaml; sources/connector-index.md (text extract, assembly frame)
- name: stackMinY
  value: -2.5
  unit: mm
  provenance: stated
  tolerance: 0.3
  description: Minimum hardware y; the Hirose ix overhang is included.
  source: sources/assembly.yaml; sources/connector-index.md (text extract, assembly frame)
- name: stackMinZ
  value: -1.97
  unit: mm
  provenance: stated
  tolerance: 0.3
  description: Lowest modelled base component; unmeasured feet are excluded by the source.
  source: sources/assembly.yaml; sources/connector-index.md (text extract, assembly frame)
- name: stackMaxX
  value: 89.31
  unit: mm
  provenance: stated
  tolerance: 0.3
  description: Maximum hardware x, set by Molex 105430-1202.
  source: sources/assembly.yaml; sources/connector-index.md (text extract, assembly frame)
- name: baseBoardThickness
  value: 1.56
  unit: mm
  provenance: stated
  tolerance: 0.02
  description: Base PCB thickness, quoted from the supplied text.
  source: sources/assembly.yaml; sources/connector-index.md (text extract, assembly frame)
- name: boardStackHeight
  value: 10.0
  unit: mm
  provenance: stated
  tolerance: 0.1
  description: Female-female inter-board standoff length; source value still needs physical confirmation.
  source: sources/assembly.yaml; sources/connector-index.md (text extract, assembly frame)
- name: carrierBoardThickness
  value: 1.57
  unit: mm
  provenance: stated
  tolerance: 0.02
  description: Carrier PCB thickness, quoted from the supplied text.
  source: sources/assembly.yaml; sources/connector-index.md (text extract, assembly frame)
- name: carrierBottom
  value: 11.56
  unit: mm
  provenance: derived
  tolerance: 0.1
  description: Carrier lower PCB face.
  formula: baseBoardThickness + boardStackHeight
- name: carrierTop
  value: 13.13
  unit: mm
  provenance: derived
  tolerance: 0.1
  description: Carrier upper PCB face and lower seats of the proposed roof spacers.
  formula: carrierBottom + carrierBoardThickness
- name: moduleSeatHeight
  value: 6.56
  unit: mm
  provenance: stated
  tolerance: 0.05
  description: Carrier upper PCB face to module underside, from assembly.yaml.
  source: sources/assembly.yaml; sources/connector-index.md (text extract, assembly frame)
- name: moduleBottom
  value: 19.69
  unit: mm
  provenance: derived
  tolerance: 0.1
  description: Module underside after the documented 180 degree z rotation.
  formula: carrierTop + moduleSeatHeight
- name: moduleKeepoutTopLocal
  value: 6.28
  unit: mm
  provenance: stated
  tolerance: 0.1
  description: Maximum top-side module keep-out above its local PCB bottom, including the README DRAM revision.
  source: sources/assembly.yaml, module intent; sources/README.txt
- name: moduleKeepoutTop
  value: 25.97
  unit: mm
  provenance: derived
  tolerance: 0.1
  description: Conservative upper component keep-out; roof underside is 1.16 mm above it.
  formula: moduleBottom + moduleKeepoutTopLocal
- name: heatsinkBottom
  value: 23.52
  unit: mm
  provenance: stated
  tolerance: 0.1
  description: Heatsink underside on the SoC lid in the assembly frame.
  source: sources/assembly.yaml; sources/connector-index.md (text extract, assembly frame)
- name: heatsinkLength
  value: 61.0
  unit: mm
  provenance: inferred
  tolerance: 2.0
  description: Nominal heatsink x extent, an estimate rather than a caliper measurement.
  rationale: 414/460 pixels of a 69.6 mm module, with the supplied approximate 3 percent perspective correction,
    gives 60.76 mm. Retain the source estimate and its wide uncertainty.
  source: sources/orin-fan.jpg; sources/assembly.yaml heatsinkLength
- name: heatsinkWidth
  value: 40.0
  unit: mm
  provenance: inferred
  tolerance: 2.0
  description: Nominal heatsink y extent.
  rationale: 274/302 pixels of a 45 mm module, with the same approximate perspective correction, gives 39.60 mm.
    Retain 40 +/- 2 mm.
  source: sources/orin-fan.jpg; sources/assembly.yaml heatsinkWidth
- name: heatsinkHeight
  value: 15.0
  unit: mm
  provenance: inferred
  tolerance: 3.0
  description: Heatsink height above the SoC contact face.
  rationale: The assembly text estimates approximately 17 mm above the module PCB, less the SoC lid rise. The oblique
    photo is not independently height-calibrated; retain the stated photo estimate and +/-3 mm.
  source: sources/assembled.png; sources/assembly.yaml heatsinkHeight
- name: heatsinkCenterX
  value: 44.0
  unit: mm
  provenance: derived
  tolerance: 0.1
  description: Module and heatsink hole pattern center in x; confirmed by the assembly transform.
  formula: boardLength / 2
- name: moduleBackY
  value: 46.0
  unit: mm
  provenance: stated
  tolerance: 0.1
  description: Assembly y of the module gold-finger edge after its rotation.
  source: sources/assembly.yaml; sources/connector-index.md (text extract, assembly frame)
- name: heatsinkLocalCenterY
  value: 24.81
  unit: mm
  provenance: stated
  tolerance: 0.1
  description: Module-local y of the heatsink mounting pattern center.
  source: sources/assembly.yaml; sources/connector-index.md (text extract, assembly frame)
- name: heatsinkCenterY
  value: 21.19
  unit: mm
  provenance: derived
  tolerance: 0.1
  description: Heatsink center after the module rotation; do not use board y midpoint.
  formula: moduleBackY - heatsinkLocalCenterY
- name: heatsinkTop
  value: 38.52
  unit: mm
  provenance: derived
  tolerance: 3.0
  description: Nominal top of the heatsink and full reference stack.
  formula: heatsinkBottom + heatsinkHeight
- name: mountXLow
  value: 3.0
  unit: mm
  provenance: stated
  tolerance: 0.05
  description: Left top-standoff axes.
  source: sources/assembly.yaml; sources/connector-index.md (text extract, assembly frame)
- name: mountXHigh
  value: 85.0
  unit: mm
  provenance: derived
  tolerance: 0.05
  description: Right top-standoff axes.
  formula: boardLength - mountXLow
- name: mountYLow
  value: 3.0
  unit: mm
  provenance: stated
  tolerance: 0.05
  description: Front top-standoff axes.
  source: sources/assembly.yaml; sources/connector-index.md (text extract, assembly frame)
- name: mountYHigh
  value: 49.5
  unit: mm
  provenance: derived
  tolerance: 0.05
  description: Rear top-standoff axes.
  formula: boardWidth - mountYLow
- name: mountPitchX
  value: 82.0
  unit: mm
  provenance: derived
  tolerance: 0.05
  description: Required x pitch of four mounting axes.
  formula: mountXHigh - mountXLow
- name: mountPitchY
  value: 46.5
  unit: mm
  provenance: derived
  tolerance: 0.05
  description: Required y pitch of four mounting axes.
  formula: mountYHigh - mountYLow
- name: wallThickness
  value: 3.2
  unit: mm
  provenance: inferred
  tolerance: 0.6
  description: Structural side-wall gauge; the two pieces share the resulting outer x/y footprint.
  rationale: A 3.2 mm nominal PETG shell gives several deposited roads and material around service openings. The
    2.4 mm acceptance minimum is a prototype gauge, not a load or temperature rating; shop settings remain open.
  edit_test:
    delta: 0.8
    expect:
      volume_delta: 8508.61408
      direction: increase
      bbox_delta: [1.6, 1.6, 0.0]
      tolerance_rel: 0.3
    sweep:
      values: [2.8, 3.2, 4.0]
    infeasible_deltas: [-3.2]
- name: roofThickness
  value: 3.2
  unit: mm
  provenance: inferred
  tolerance: 0.6
  description: Roof gauge, independent of the side-wall edit.
  rationale: The roof carries the four mounting screw heads and spans the cavity; use the same structural nominal
    gauge as the walls until the shop confirms it.
- name: floorThickness
  value: 3.2
  unit: mm
  provenance: inferred
  tolerance: 0.6
  description: Bottom-cover slab gauge.
  rationale: The closed bottom and integral compression pads need a structural PETG floor; use 3.2 mm nominal with
    a 2.4 mm verified minimum.
- name: boardClearance
  value: 2.0
  unit: mm
  provenance: inferred
  tolerance: 0.5
  description: Offset of internal side-wall planes from the full stack x/y envelope.
  rationale: A small 2 mm allowance accommodates the source 0.3 mm envelope uncertainty and FDM fit without using
    connector anchors as connector outlines. A gap probe would have only 1 mm nominal margin, so clearance checks
    and planes are used instead.
- name: floorClearance
  value: 1.5
  unit: mm
  provenance: inferred
  tolerance: 0.5
  description: Floor-to-lowest-modelled-component gap.
  rationale: Reserve 1.5 mm below the -1.97 mm component envelope; corner support pads are the only intentional
    contact with the base PCB.
- name: seamGap
  value: 0.3
  unit: mm
  provenance: inferred
  tolerance: 0.15
  description: Vertical separation of the cap rim and bottom-cover slab.
  rationale: Two independently fastened fixed pieces need a small non-interfering seam. They register on the same
    stack axes; no sliding, hinge, snap-fit or kinematic joint is introduced.
- name: roofSpacerHeight
  value: 14.0
  unit: mm
  provenance: inferred
  tolerance: 0.5
  description: Four proposed metal compression-spacer lengths above the carrier.
  rationale: A 14 mm spacer puts the roof underside at z 27.13, above the full z 25.97 module component keep-out,
    while keeping the fan outside. This avoids thin plastic lugs beside the rear SO-DIMM housing. Purchased or cut-to-length
    spacers must be confirmed.
- name: roofSpacerDiameter
  value: 4.5
  unit: mm
  provenance: inferred
  tolerance: 0.4
  description: Proposed metal spacer outside diameter; spacers are hardware, not printed solids.
  rationale: A narrow 4.5 mm OD tube fits the corner axes, nominally 0.70 mm from the SO-DIMM x boundary at the
    rear. No commercial part number or thread engagement is assumed.
- name: mountHoleDiameter
  value: 3.0
  unit: mm
  provenance: inferred
  tolerance: 0.2
  description: Case clearance holes for the eight M2.5 screws; top four are the required stack attachment.
  rationale: Use a provisional printed 3.0 mm clearance hole, slightly larger than the source board D2.9 holes.
    Verify the actual printed fit; the case does not contain printed M2.5 threads.
- name: basePadDiameter
  value: 8.0
  unit: mm
  provenance: inferred
  tolerance: 0.75
  description: Four integral bottom-cover compression-pad diameters.
  rationale: An 8 mm pad around a 3 mm bore leaves a nominal 2.5 mm radial PETG ligament and transfers load to the
    base mounting lands. Availability of this larger underside land is an explicit open question.
- name: portMargin
  value: 1.5
  unit: mm
  provenance: inferred
  tolerance: 0.5
  description: Tangential and vertical expansion of connector-body projections at service windows.
  rationale: Use 1.5 mm around supplied body envelopes as a provisional mating-plug allowance. Merge adjacent windows
    to avoid thin webs; cable overmoulds, latches and reach are not dimensioned.
- name: heatsinkMargin
  value: 4.0
  unit: mm
  provenance: inferred
  tolerance: 1.0
  description: Per-side roof-opening allowance around the nominal heatsink footprint.
  rationale: A 4 mm nominal gap covers half of the +/-2 mm size uncertainty plus an inferred 0.5 mm centering allowance,
    leaving 2.5 mm to the conservative x/y keep-out. It also leaves substantial air access around the fan shroud.
  edit_test:
    delta: 0.5
    expect:
      volume_delta: -377.6
      direction: decrease
      bbox_delta: [0.0, 0.0, 0.0]
      tolerance_rel: 0.03
    sweep:
      values: [3.5, 4.0, 4.5]
    infeasible_deltas: [-4.0]
- name: innerXMin
  value: -2.0
  unit: mm
  provenance: derived
  tolerance: 0.1
  description: Internal -x wall plane.
  formula: stackMinX - boardClearance
- name: innerXMax
  value: 91.31
  unit: mm
  provenance: derived
  tolerance: 0.1
  description: Internal +x wall plane.
  formula: stackMaxX + boardClearance
- name: innerYMin
  value: -4.5
  unit: mm
  provenance: derived
  tolerance: 0.1
  description: Internal -y wall plane.
  formula: stackMinY - boardClearance
- name: innerYMax
  value: 54.5
  unit: mm
  provenance: derived
  tolerance: 0.1
  description: Internal +y wall plane.
  formula: boardWidth + boardClearance
- name: outerXMin
  value: -5.2
  unit: mm
  provenance: derived
  tolerance: 0.1
  description: Case minimum x.
  formula: innerXMin - wallThickness
- name: outerXMax
  value: 94.51
  unit: mm
  provenance: derived
  tolerance: 0.1
  description: Case maximum x.
  formula: innerXMax + wallThickness
- name: outerYMin
  value: -7.7
  unit: mm
  provenance: derived
  tolerance: 0.1
  description: Case minimum y.
  formula: innerYMin - wallThickness
- name: outerYMax
  value: 57.7
  unit: mm
  provenance: derived
  tolerance: 0.1
  description: Case maximum y.
  formula: innerYMax + wallThickness
- name: floorTop
  value: -3.47
  unit: mm
  provenance: derived
  tolerance: 0.1
  description: Upper surface of the bottom-cover slab.
  formula: stackMinZ - floorClearance
- name: floorBottom
  value: -6.67
  unit: mm
  provenance: derived
  tolerance: 0.1
  description: Lowest printed face.
  formula: floorTop - floorThickness
- name: shellBottom
  value: -3.17
  unit: mm
  provenance: derived
  tolerance: 0.1
  description: Lower rim of the upper cap.
  formula: floorTop + seamGap
- name: roofBottom
  value: 27.13
  unit: mm
  provenance: derived
  tolerance: 0.1
  description: Roof underside, seated on the four metal spacers.
  formula: carrierTop + roofSpacerHeight
- name: roofTop
  value: 30.33
  unit: mm
  provenance: derived
  tolerance: 0.1
  description: Top of printed case; below the heatsink top.
  formula: roofBottom + roofThickness
- name: heatOpeningLength
  value: 69.0
  unit: mm
  provenance: derived
  tolerance: 0.1
  description: Rectangular roof opening along x.
  formula: heatsinkLength + 2 * heatsinkMargin
- name: heatOpeningWidth
  value: 48.0
  unit: mm
  provenance: derived
  tolerance: 0.1
  description: Rectangular roof opening along y.
  formula: heatsinkWidth + 2 * heatsinkMargin
- name: heatOpeningXMin
  value: 9.5
  unit: mm
  provenance: derived
  tolerance: 0.1
  description: Left roof aperture edge.
  formula: heatsinkCenterX - heatOpeningLength / 2
- name: heatOpeningXMax
  value: 78.5
  unit: mm
  provenance: derived
  tolerance: 0.1
  description: Right roof aperture edge.
  formula: heatsinkCenterX + heatOpeningLength / 2
- name: heatOpeningYMin
  value: -2.81
  unit: mm
  provenance: derived
  tolerance: 0.1
  description: Front roof aperture edge.
  formula: heatsinkCenterY - heatOpeningWidth / 2
- name: heatOpeningYMax
  value: 45.19
  unit: mm
  provenance: derived
  tolerance: 0.1
  description: Rear roof aperture edge.
  formula: heatsinkCenterY + heatOpeningWidth / 2
- name: caseLength
  value: 99.71
  unit: mm
  provenance: derived
  tolerance: 0.1
  description: Overall printed x span.
  formula: outerXMax - outerXMin
- name: caseWidth
  value: 65.4
  unit: mm
  provenance: derived
  tolerance: 0.1
  description: Overall printed y span.
  formula: outerYMax - outerYMin
- name: caseHeight
  value: 37.0
  unit: mm
  provenance: derived
  tolerance: 0.1
  description: Overall printed z span.
  formula: roofTop - floorBottom
- name: fanExposure
  value: 8.19
  unit: mm
  provenance: derived
  tolerance: 3.0
  description: Nominal exposed heatsink height; 5.19 mm at the -3 mm height uncertainty.
  formula: heatsinkTop - roofTop
features:
- id: upperCap
  kind: shell
  description: One connected inverted rectangular cap. Outer box (-5.2,-7.7,-3.17)..(94.51,57.7,30.33); cavity (-2,-4.5,-3.17)..(91.31,54.5,27.13)
    opens through the bottom. Subtract all listed apertures. Keep separate from bottomCover.
  parameters: [wallThickness, roofThickness, innerXMin, innerXMax, innerYMin, innerYMax, outerXMin, outerXMax, outerYMin,
    outerYMax, shellBottom, roofBottom, roofTop]
  verify:
  - method: bbox
  - method: section
    section: cavityBand
  - method: solid
    points:
    - [-3.6, 25.0, 15.0]
    - [92.91, 25.0, 15.0]
    - [44.0, -6.1, 19.0]
    - [44.0, 56.1, 19.0]
  - method: face
    face: roofDeck
- id: bottomCover
  kind: extrude
  description: Separate flat cover at z -6.67..-3.47, sharing the cap outer x/y footprint. Four integral pads rise
    to z=0. Lower screws fasten it to the lower ends of the existing stack standoffs. A 0.3 mm seam remains under
    the cap rim.
  parameters: [floorThickness, floorTop, floorBottom, outerXMin, outerXMax, outerYMin, outerYMax, seamGap]
  verify:
  - method: section
    section: floorBand
  - method: solid
    points:
    - [44.0, 25.0, -5.07]
  - method: face
    face: floorOutside
- id: lowerSupportPads
  kind: boss
  description: Four D8 annular pads, z -3.47..0, at the board corner axes; fused only to the bottom cover. Nominal
    radial material around each D3 bore is 2.5 mm.
  parameters: [basePadDiameter, mountHoleDiameter, floorTop, mountXLow, mountXHigh, mountYLow, mountYHigh]
  verify:
  - method: cylinder
    cylinder: lowerPad1
  - method: cylinder
    cylinder: lowerPad2
  - method: cylinder
    cylinder: lowerPad3
  - method: cylinder
    cylinder: lowerPad4
  - method: section
    section: padBand
  count: 4
- id: topStandoffBores
  kind: hole
  description: Four D3 vertical through-holes in the roof, z 27.13..30.33, at (3,3),(85,3),(85,49.5),(3,49.5). M2.5
    screws and four proposed D4.5 x 14 metal spacers connect these roof lands to the carrier top-standoff holes.
    Do not mount to the module heatsink holes.
  parameters: [mountHoleDiameter, mountXLow, mountXHigh, mountYLow, mountYHigh, roofBottom, roofTop, roofSpacerHeight,
    roofSpacerDiameter]
  verify:
  - method: cylinder
    cylinder: topHole1
  - method: cylinder
    cylinder: topHole2
  - method: cylinder
    cylinder: topHole3
  - method: cylinder
    cylinder: topHole4
  - method: section
    section: roofBand
  count: 4
- id: bottomClosureBores
  kind: hole
  description: Four D3 through-bores in the lower cover and pads, z -6.67..0, on the same four axes. These retain
    the bottom cover; the required stack attachment remains the four top screws.
  parameters: [mountHoleDiameter, mountXLow, mountXHigh, mountYLow, mountYHigh, floorBottom]
  verify:
  - method: cylinder
    cylinder: bottomHole1
  - method: cylinder
    cylinder: bottomHole2
  - method: cylinder
    cylinder: bottomHole3
  - method: cylinder
    cylinder: bottomHole4
  - method: section
    section: floorBand
  count: 4
- id: heatsinkAperture
  kind: cut
  description: 69 x 48 rectangular opening through the roof, centered (44,21.19), bounds x 9.5..78.5 and y -2.81..45.19.
    Fan top z 38.52 is outside roof z 30.33. No grate or lip may intrude into the heatsink or fan air keep-outs.
  parameters: [heatsinkLength, heatsinkWidth, heatsinkHeight, heatsinkBottom, heatsinkCenterX, heatsinkCenterY,
    heatsinkMargin, heatOpeningLength, heatOpeningWidth, roofTop, fanExposure]
  verify:
  - method: section
    section: roofBand
  - method: void
    points:
    - [10.75, 21.19, 28.73]
    - [77.25, 21.19, 28.73]
    - [44.0, -1.56, 28.73]
    - [44.0, 43.94, 28.73]
    - [44.0, 21.19, 44.52]
  - method: dimension
    dimension: heatOpeningSpanX
  - method: dimension
    dimension: heatOpeningSpanY
- id: rearHeaderWindow
  kind: cut
  description: Open the +y wall at x 6.58..74.83, z 0.06..7.48. This covers the whole source GH row, including base
    J4 UART7, J5 UART8 and J7 UART2/I2C4; it also clears the unnamed neighboring headers. Do not turn the UART1
    silk label into a fictitious connector.
  parameters: [portMargin]
  verify:
  - method: section
    section: rearService
  - method: void
    points:
    - [21.6, 56.1, 3.77]
    - [31.0, 56.1, 3.77]
    - [41.696, 56.1, 3.77]
  - method: dimension
    dimension: rearWindowWidth
- id: frontHeaderAndUsbWindows
  kind: cut
  description: 'Subtract the union of three -y wall rectangles: lower x 30.23..76.68, z 0.06..7.48 (second GH row
    and base J11B1); upper J9 x 40.66..52.40, z 6.95..13.06; upper J8 x 60.81..72.75, z 6.69..13.06. They overlap
    into one connected window with two raised portions; retain the 8.41 mm web between the high portions.'
  parameters: [portMargin, carrierBottom]
  verify:
  - method: section
    section: frontService
  - method: void
    points:
    - [35.0, -6.1, 3.77]
    - [70.71, -6.1, 3.25]
    - [46.53, -6.1, 10.0]
    - [66.78, -6.1, 9.9]
  - method: dimension
    dimension: frontWindowWidth
  - method: dimension
    dimension: carrierJ9WindowWidth
  - method: dimension
    dimension: carrierJ8WindowWidth
  count: 3
- id: powerAndCarrierUsbWindow
  kind: cut
  description: One +x window at y 5.15..18.21, z 0.06..17.74. It opens base J12 Molex 105430-1202 and carrier top
    J10 USB-C, including their x overhangs. The two vertical windows are deliberately merged to avoid a 1.5 mm PETG
    web.
  parameters: [portMargin, carrierBottom, carrierTop]
  verify:
  - method: section
    section: rightService
  - method: void
    points:
    - [92.91, 11.02, 5.1]
    - [92.91, 12.34, 14.69]
  - method: dimension
    dimension: powerWindowWidth
  - method: dimension
    dimension: powerWindowHeight
- id: baseSideUsbWindow
  kind: cut
