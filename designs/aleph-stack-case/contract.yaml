open_questions: ['Which physical USB-C receptacles are called eth gadget and RPI debugger? The names are absent
    from the supplied files; all five edge USB-C receptacles are opened without assigning either name to a refdes.',
  'Does UARTs include any connection beyond base J4 UART7, J5 UART8, J7 UART2/I2C4 and the two edge GH rows? UART1
    is an interior silk label, not an identified connector.', 'What PETG shop wall gauge, nozzle/layer settings,
    print orientation, supports, service loads and operating temperature should govern release? The draft uses 3.2
    mm structural skins with a 2.4 mm regional minimum; no load or creep rating is established.', 'Do the actual
    mating plugs, latches, cable bends and insertion reach fit the inferred 1.5 mm port margin, 2.0 mm side allowance
    and 1.5 mm floor gap? Only receptacle/body envelopes are supplied.', 'Can the heatsink 61 x 40 x 15 mm estimate,
    its center, full fin outlets and fan cable route be measured? The roof uses +/-2 mm x/y size, +/-3 mm height
    and an inferred +/-0.5 mm centering allowance; airflow performance is not verified.', 'May the unmeasured photographed
    thumbscrews and feet be replaced for this prototype by eight M2.5 screws and four OD4.5 x14 mm metal roof spacers?
    Confirm actual spacer bore/OD, screw heads, lengths, torque, thread depth and safe engagement from both ends
    of the existing female-female standoffs.', 'Are D8 mm bottom-pad contact lands clear and mechanically acceptable
    at all four base-board holes? The hole axes are known, but the larger underside bearing lands and nearby omitted
    components were not measured.', 'Do the real spring bracket, omitted components and tallest DRAM revision remain
    inside the supplied and conservatively expanded keep-outs? The raw CAD/PCB/mesh files were not inspected, and
    the photograph includes unmodelled hardware.', 'Is external access also required to Hirose ix Ethernet, microSD,
    the carrier FFC connector or the carrier fan header? Their keep-outs are protected, but separate service openings
    were not requested and are not included.']
